meta:
  change_id: kline_field_backfill
  title: reits_kline_daily 字段级回填（daily_return_pct + amount）+ 非交易日脏行清理
  created: '2026-09-14T17:35:00+08:00'
  confirmed_at: '2026-09-14T20:44:01+08:00'
  archived_at: '2026-09-15T07:20:00+08:00'
  status: completed
  supersedes: kline_amount_repair
why:
  problem: business.reits_kline_daily 有 24,732 行 daily_return_pct 为 NULL（占 47.96%）与 259 行 amount 为 NULL；其中 178 行为 2026-09-10/09-11
    的字段级缺口，81 行为 2026-05-03（劳动节假期）被 sina 源整批重复写入的幽灵交易日脏行。
  motivation: reits_kline_daily 由 reits_kline_daily.json 全量重建（build 的 CREATE OR REPLACE），而每日新增的 tdx 类 bar 一律带 NULL daily_return_pct，编排中的补录脚本只补缺失键、不补字段
    NULL → 缺口逐日沉淀；且任何只改 PG 的修复都会被下一轮 build 回滚。
