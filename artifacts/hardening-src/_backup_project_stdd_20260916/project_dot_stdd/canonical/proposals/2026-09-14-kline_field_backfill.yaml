capabilities:
  new:
  - name: kline_field_backfill
    description: 权威日线字段级回填 + 非交易日脏行清理（幂等、可编排、可独立执行）
  modified: []
constraints:
- 只写 JSON 真源；PG 由紧随的 build 全量重建传播，不引入第二条会漂移的写路径
- 非交易日脏行删除须过三重守卫（不在日历 ∧ 严格早于日历最大日 ∧ (周末 ∨ 与上一交易日逐行重复)）
- 删除前强制备份；生产库写入与删行须逐次向用户确认
- 回填只作用于 NULL 行，厂商已有值逐字节不变
stakeholders:
- D哥（项目所有者 / 审批）
risk_areas:
- capability: kline_field_backfill
  risk: 只改 PG 不改 JSON → 下轮 build 回滚
  mitigation: 双写 JSON；TC-018 断言重跑完整 build 后缺口不复现
- capability: kline_field_backfill
  risk: 误删真实交易日数据
  mitigation: 删除前备份 81 行到 backups/；三重守卫 + 与 04-30 逐行对等断言
- capability: kline_field_backfill
  risk: 把幽灵日当正常日填出假收益率
  mitigation: 填值前用 tdx_kline_daily 交易日历过滤（实测仅排除 1 行）
- capability: kline_field_backfill
  risk: 除息日未复权收益率被误读为暴跌
  mitigation: 在 JSON coverage 记录口径；TC-023 断言 |涨跌|>10% 的行全部可解释
- capability: kline_field_backfill
  risk: --apply-pg 沿用 JSON 推导的待删计划 → PG 脏行永远删不掉
  mitigation: 改为对 PG 自身行集合重放三重守卫（ADJ-001，SC-006-003）
non_goals:
- business.tdx_kline_daily（只读，不改）
