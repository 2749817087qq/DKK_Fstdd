# design-adjustments.yaml — 设计调整汇总（Canonical YAML）
# change: kline_field_backfill
# 生成阶段：Phase 3 (BUILD) Part C —— 汇总实现与执行期间对 Phase 2 设计的偏离/补强
#
# 结论：requires_re_spec=false / requires_re_build=false
#   全部 10 项调整（ADJ-001..010）均在 Phase 3 内闭环（实现已改、测试已补、已复跑验证），
#   未改变 spec.yaml 任何既有 REQ 的语义；另**新增 2 个 Scenario**：
#     SC-006-003（PG 侧待删日期独立推导）、SC-006-004（三系统一致 JSON↔PG↔DuckDB）
#   → spec 由 Gate 2 时的 18 REQ / 22 SC 变为 18 REQ / 24 SC；
#     测试由 23 TC 变为 25 TC（新增 TC-KFB-024 / TC-KFB-025）。

meta:
  change_id: kline_field_backfill
  created: "2026-09-14"
  total_adjustments: 10
  requires_re_spec: false
  requires_re_build: false

adjustments:

  - id: ADJ-001
    category: design_change
    original: >
      design.md 决策 1「以 JSON 为唯一写入目标，PG 由 build 传播」推导出
      apply_to_pg(conn, plan)：待删日期取自 JSON 计划 plan.purge。
    adjusted: >
      apply_to_pg(conn, purge_dates, backups_dir, stamp)：待删日期改由
      plan_pg_purge() → load_pg_kline() 从 **PG 自身行集合** 重放三重守卫得出；
      并新增 write_pg_purge_backup() 在删前落盘 backups/pg_phantom_<ts>.csv。
    reason: >
      【执行期发现的真实缺口，会导致生产库脏行永久残留】
      第 ③ 步 `--apply-pg` 时 JSON 已修复完毕，plan.purge 恒为空，
      而 PG 仍实有 81 行 2026-05-03 脏行（实测 json_purge=0 / pg_purge=81）。
      原实现会静默跳过 DELETE，且 verify() 会 MISMATCH 退出。
      幽灵行判定本就是 (行集合, 日历, 日历最大日) 的纯函数，对 PG 行集合重算即可，
      无需引入第二条写路径，与决策 1 并不冲突。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build
    evidence:
      - "执行期预演输出：非交易日脏行(JSON) 待删 0 行 / 非交易日脏行(PG) 待删 81 行"
      - "修复后执行：{'pg_backup_rows': 81, 'ret_updated': 24642, 'amt_updated': 178, 'deleted': 81}"
      - "修复后 verify：json=(51486,89,0,0,89) == pg=(51486,89,0,0,89) → OK"

  - id: ADJ-002
    category: boundary_discovery
    original: >
      purge_dates 直接来自 plan_purge 的返回值 [(code, date), ...]，
      被当作纯日期列表传给 `WHERE date = ANY(%s)`。
    adjusted: >
      新增 _normalize_dates()，把 [(code, date), ...] 与 ['date', ...] 两种形状
      统一归一为去重排序的纯日期列表；write_pg_purge_backup 与 apply_to_pg 均先归一。
    reason: >
      实测报错 `操作符不存在: text = record` —— psycopg2 把元组按 record 适配，
      生成 ARRAY[('180101','2026-05-03'), ...]。属调用契约未定义清楚导致的类型混用。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build
    evidence:
      - "psycopg2.errors.UndefinedFunction: 操作符不存在: text = record"
      - "TC-KFB-024 norm_ok=True（元组/字符串/空三种输入均归一正确）"

  - id: ADJ-003
    category: design_change
    original: >
      仅对 JSON 侧删行做强制备份（backups/phantom_<ts>.csv），
      PG 侧 DELETE 为裸执行，无留痕。
    adjusted: >
      新增 write_pg_purge_backup()：PG 侧删除前把待删行的完整 11 列落盘到
      backups/pg_phantom_<ts>.csv，并把路径与行数写入 stats 一并打印。
    reason: >
      项目红线「生产库写入与删行不得静默执行」。JSON 侧有留痕而 PG 侧没有，
      属不对称的审计缺口。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build
    evidence:
      - "backups/pg_phantom_20260914_212712.csv，81 行 × 11 列"

  - id: ADJ-004
    category: test_change
    original: >
      TC-KFB-001 断言 `max_date == "2026-09-11"`（硬编码日历最大日）。
    adjusted: >
      改为 `max_date == max(calendar)`，仅断言日历自洽 + 非空 + 无周末行。
    reason: >
      交易日历由 business.tdx_kline_daily 推导，会被外部采集进程推进
      （本会话期间即新增 2026-09-14 的 89 行，source='tencent'），
      硬编码最大日会让测试因外部数据变化而假失败。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build

  - id: ADJ-005
    category: test_change
    original: >
      TC-KFB-006 断言 `len(plan.ret_fills) == 24642`（修复前状态的期望值）。
    adjusted: >
      改为双段断言：(a) 确定性 fixture —— 不在日历内的日期绝不被回填且不污染
      prev_close 链；(b) 真实 JSON 状态段 —— 计划数 ∈ {0, 24642} 且幽灵日不在回填集合内。
    reason: >
      S5 一次性执行后 JSON 已修复，ret_fills 自然为 0，原断言必然假失败。
      把「修复前的期望值」当永久断言是测试与数据状态不同步的典型错误。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build

  - id: ADJ-006
    category: test_change
    original: >
      TC-KFB-023 断言 `n_big == 4 and n_exdiv == 4`
      （|涨跌幅|>10% 的行恰好 4 行且全部是除息日）。
    adjusted: >
      改为「可解释性」断言：命中除息日 == 4；非除息日的大跳变必须落在该标的
      序列前 2 行内，且其 close 须被独立源 business.tdx_kline_daily 佐证；
      unexplained 与 uncorroborated 均须为 0。
    reason: >
      原断言同样是在「24,732 行收益率为 NULL」的修复前状态测得的。
      回填后第 5 行被计入：508080（中金亦庄产业园REIT）2025-06-27 = +10.0113%，
      该标的序列首行即 2025-06-26（rn=1，无 prev_close），06-27 为第二行
      （上市次日涨停），两次除息在 2026-04-08 / 2026-09-02，与除息无关；
      tdx_kline_daily 同 (code,date) 的 close/volume 完全一致 → 真实大跳变，非口径错误。
      改为可解释性断言后，既容得下真实大跳变，又能捕捉回填口径错误。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build
    evidence:
      - "TC-KFB-023 n_big=5 n_exdiv=4 unexplained=0 uncorroborated=0 extra=[('508080','2025-06-27',10.0113,2)]"

  - id: ADJ-007
    category: boundary_discovery
    original: >
      coverage 更新只写本次修复新增的 5 个字段
      （return_fill_count / amount_fill_count / purged_rows / return_caliber / last_repair_at）。
    adjusted: >
      新增 _coverage_target() / coverage_needs_refresh()；update_coverage() 追加
      cov.update(_coverage_target(doc))，同步刷新 total_records 与 date_range；
      main() 增「无字段缺口但 coverage 不一致 → 仅刷新元数据」分支，
      并引入 needs_json_write 统一判定是否进入写盘路径。
    reason: >
      SC-005-002 要求「既有字段值自洽」。S5 删 81 行后 JSON 实际 51,486 行，
      而 coverage.total_records 仍写 51,567，违反该 Scenario。
      （该缺陷在执行后复核时发现，属自审漏项。）
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build
    evidence:
      - "coverage.total_records: 51567 → 51486；date_range 重算为 2021-06-21 ~ 2026-09-11"
      - "TC-KFB-014 强化为「记录口径 + 既有字段值自洽」并 PASS"

  - id: ADJ-008
    category: boundary_discovery
    original: >
      main() 的早退条件为 `if not needs_json_write and not pg_purge_dates: SKIP`。
    adjusted: >
      新增 pg_field_gap(conn) —— 只数「真正会被 SQL_RET / SQL_AMT 改写」的行
      （有 prev_close 的 null 收益率行 + 有源可取的 null amount 行）；
      早退条件改为 `not needs_json_write and not (pg_purge_dates or pg_gap > 0)`，
      并在头部与 [PG-ONLY] 提示中打印该值。
    reason: >
      【执行期发现的第二处缺口】若 PG 单独落后（有 NULL 但无幽灵行），
      原条件会因 pg_purge_dates 为空而直接 SKIP → PG 永远不被修复。
      但也不能改用「null 行数」判早退：各标的 89 个首行永久为 NULL（无 prev_close），
      会让 --apply-pg 永不早退、每次白跑一个事务。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build
    evidence:
      - "修复后二次执行 --apply-pg：可回填字段(PG)=0 行 → [SKIP]，零备份，VERIFY OK"
      - "TC-KFB-024 pg_gap=0"

  - id: ADJ-009
    category: boundary_discovery
    original: >
      main() 的 CalendarEmptyError 保护性中止路径 `except ... return 2` 未关闭连接。
    adjusted: >
      conn 初始化为 None，中止路径判断 `if conn is not None: conn.close()` 后再 return 2。
    reason: >
      C4 失败模式检查（资源泄漏项）发现：load_calendar 抛错时连接已建立但从未关闭。
      进程随即退出故实际影响低，但属明确的资源泄漏模式，且修复成本为零。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build

  - id: ADJ-010
    category: test_quality
    original: >
      TC-KFB-007 / 015 / 018 断言 `amount IS NULL 的行数 == 0`。
    adjusted: >
      改为断言「**可回填缺口 == 0**」——
      (a) TC-015 / 018：`mod.pg_field_gap(conn) == 0`（源有值而表为 NULL 的行数），
          同时保留 `ret_null == funds`（各标的首行无 prev_close，结构性为 NULL）；
      (b) TC-007：新增子查询 `k.amount IS NULL AND t.amount IS NOT NULL` 计数 == 0，
          保留 09-10/09-11 与源逐行相等的断言。
    reason: >
      【执行期实测暴露的第 5 处状态依赖断言（与 ADJ-004/005/006 同类）】
      2026-09-14 22:37 的 ETL 实测链路：
        sync_kline_json 由 TDX 主站直连补入 **89 行 2026-09-14 当日新行**，
        其 amount 全部为 None（该通道不产 amount）；
        repair_kline 随即补上 daily_return_pct +89，而 amount 因
        `tdx_kline_daily` 当日 amount 尚未到位 → 输出 `amount 无源: ... 另有 79 行`，
        **按设计不编造**，amount 保持 NULL。
      结果 PG/JSON 的 `amount IS NULL` 由 0 变为 89 —— 这不是回归，是**预期行为**：
      缺口会在次日 `tdx_kline_daily` 当日 amount 到位后由同一脚本自愈
      （源有值 + 表为 NULL 即命中 plan_amount_fills）。
      因此 `amount IS NULL == 0` 随交易日推移必然假失败；真实不变量是
      「源可提供的值已全部落库」。这与 ADJ-008 引入 pg_field_gap() 的判据完全同源，
      本次只是把同一判据贯彻到测试断言层。
    affected_capabilities: [kline_field_backfill]
    resolved_in_phase: build
    evidence:
      - "ETL 日志：sync_kline_json [WRITE] 已补入 89 行 -> reits_kline_daily.json"
      - "ETL 日志：repair_kline [JSON] daily_return_pct +89 / amount +0"
      - "ETL 日志：repair_kline - amount 无源: 180103 2026-09-14 ... 另有 79 行"
      - "执行后探针：JSON=(51575,89,89,89,0) PG=(51575,89,89,89,0) fillable_gap=0"

