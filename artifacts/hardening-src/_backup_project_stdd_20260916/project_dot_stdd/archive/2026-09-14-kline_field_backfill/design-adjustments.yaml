spec_deltas:
  - id: SC-006-003
    type: added
    req: REQ-006-001
    text: >
      JSON 已修复（plan.purge 为空）但 PG 仍残留非交易日脏行时，--apply-pg SHALL 从
      PG 自身行集合重放三重守卫得到待删日期，SHALL 删前落盘 pg_phantom_<ts>.csv，
      SHALL 严格按该日期集合发 DELETE 且与两项 UPDATE 同处一个事务。
    reason: ADJ-001 / ADJ-002 / ADJ-003 的规格化落点，保证 spec↔test 可追溯。
  - id: SC-006-004
    type: added
    req: REQ-006-001
    text: >
      完整跑过一次 daily_etl（含 json/build 与末尾 sync_duckdb）后，JSON / PG /
      DuckDB 副本三者的四项计数（总行数 / null 收益率 / null amount / 幽灵日）
      SHALL 完全一致。
    reason: >
      用户报缺陷时即指出「postgresql 与 duckdb 都有数据」。DuckDB 副本
      D:\duckdb\reits.duckdb 由 sync_pg_to_duckdb.py 自 PG 反向重建，
      只验 JSON↔PG 会漏掉副本停留在旧态的情况（执行期实测 duckdb 仍为
      51,567/24,732/259/81）。对应 ADJ-001 的传播链路完整性验证。

test_plan_deltas:
  - id: TC-KFB-024
    type: added
    covers: SC-006-003
    reason: ADJ-001 的回归保护。
  - id: TC-KFB-025
    type: added
    covers: SC-006-004
    reason: ADJ-001 传播链路的跨系统验证。

