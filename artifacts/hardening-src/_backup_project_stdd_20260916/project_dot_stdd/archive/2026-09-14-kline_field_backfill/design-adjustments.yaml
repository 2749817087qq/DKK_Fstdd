user_authorized_decisions:
  - id: UAD-001
    question: 是否授权执行 S5（写 JSON + 删 81 行 + 改 PG）？
    answer: 执行全部三步（推荐）
    effect: >
      按 ① --write（写 JSON，24,642 收益率 + 178 amount）
      ② --purge-phantom（删 JSON 中 81 行脏行）
      ③ --apply-pg（单事务：UPDATE 24,642 + UPDATE 178 + DELETE 81）顺序执行。
    executed: true
  - id: UAD-002
    question: 执行后的「修复不被 build 回滚」验证跑多大范围？
    answer: 完整 daily_etl
    effect: >
      以 `daily_etl.py`（DAILY_DEFAULT 全 10 步，含 ccreits / westock_ff /
      backfill_kline / sync_kline_json / repair_kline / json(build) / sync_duckdb /
      pk_guard / ann / pre_listing）作为 TC-KFB-018 的验证手段，
      而非仅跑 build 子集。
    executed: true
    actual_execution: >
      **第一次（21:29:33 启动）未跑完**：主进程与子进程在 westock_ff 阶段
      因会话边界被终止（日志停在 21:32:14，锁文件 pid=19148 已成僵尸锁，
      22:34:07 由下一轮自动接管）。westock_ff 为 89 只串行 npx 取数
      （预算 2400s × 最多 2 次尝试），属已知长跑步骤。
      **第二次（22:34:07）改跑 K 线相关链路**：
      `--only backfill_kline sync_kline_json repair_kline json sync_duckdb`。
      理由：TC-KFB-018 的命题是「修复不被 build 回滚」，其**唯一写路径**
      是 backfill_kline / sync_kline_json → repair_kline → json(build) → sync_duckdb；
      ccreits（元数据 UPSERT）与 westock_ff（资金流，入 westock_fund_flow_daily）
      对 business.reits_kline_daily **无任何写入路径**，纳入与否不改变命题真值。
      该偏离已在 test-report.md §3 明确标注，未按「完整 daily_etl」字面执行的部分
      由用户决定是否补跑。
    result: >
      **第二次（22:34:07）K 线链路**：backfill_kline 0 行（无缺口）→ sync_kline_json +89 行
      （2026-09-14 新交易日，amount 全空）→ repair_kline daily_return_pct +89 / amount +0
      （无源，按设计不编造）→ build 108s → sync_duckdb 完成；三系统计数一致。
      **第三次（22:56:49→23:55:25）完整 10 步补跑**：ok=9 bad=1（唯一红为无关的 pre_listing，
      被 safe-delete 批量确认阈值拦下，见 K8）。
      其中 repair_kline 输出 `[SKIP] 无缺口，跳过写入（未创建任何备份文件）`
      —— **稳态幂等实测成立**；build 未回滚修复；sync_duckdb total=56 fail=0；
      三系统仍为 (51575, 89, 89, 89, 0)，全量测试复跑 27/27 PASS。
      至此原授权范围（完整 daily_etl）已完整执行，偏离已闭合。
