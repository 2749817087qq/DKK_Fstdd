  - ★ 执行期铁律：当 A 是 B 的纯函数、脚本要同时改 A 与 B 时，任何「从 A 推导的计划」
    都不能直接用于改 B —— A 修好后计划就空了（--apply-pg 曾因此漏删 PG 全部 81 行脏行）
  - ★ 一次性数据迁移的验收测试必须区分「迁移前的期望值」与「迁移后的不变量」
  - ★ 断言「NULL 数 == 0」前必须先问「该字段是否总该有值」；对源可能缺失的字段，
    唯一正确的不变量是「可回填缺口 == 0」（当日新行 amount 天然无源，次日自愈）
