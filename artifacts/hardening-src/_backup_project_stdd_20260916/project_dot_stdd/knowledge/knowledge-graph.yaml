- id: EXP-007
  pattern: psycopg2 的 list 参数会按元素类型适配，元组会变成 record
  source_change: kline_field_backfill
  origin: local
  severity: normal
  phase: unknown
  summary: '**报错**：`psycopg2.errors.UndefinedFunction: 操作符不存在: text = record` `LINE 4: WHERE date = ANY(ARRAY[(''180101'',
    ''2026-05-0...` **原因**：`plan_purge` 返回 `[(code, date), ...]`，被直接当日期列表传给 `WHERE date = ANY(%s)`。 psycopg2 把 list 里的 tuple
    适配成 composite/record，于是 `text = record` 无操作符。 **修法**：新增 `_normalize_dates()`，把 `[(code, date), ...]` 与 `[''date'', ...]`
    两种形状 统一归一为去重排序的纯日期列表，两个调用点（DELETE 与删前备份 SELECT）都先归一。'
