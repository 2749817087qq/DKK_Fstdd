spec:
  name: announcement_sync_all
  summary: 联网全量爬取 REIT 公告元数据并升级/关联现有 announcements
  change_dir: .stdd/changes/announcement_sync_all
  gates:
    - GATE1_APPROVED   # 范围/合并/关联三决策已确认
    - GATE2_APPROVED   # 本文件 spec 确认
    - GATE3_APPROVED   # 验收测试通过

requirements:
  - id: REQ-1
    type: code
    title: 改 save_announcements_to_db 为 UPSERT，web 为权威层且保留 pdf_local_path
    detail: >
      conflict_action 由 "do_nothing" 改为 "upsert"；web 记录不含 pdf_local_path 字段，
      冲突 SET 子句覆盖 source_url/pdf_url/category/confidence/exchange/source/source_module/is_generic，
      confidence 用 GREATEST(existing, excluded) 防降级，exchange 用 COALESCE 保留，pdf_local_path 不在 SET 中故原 disk_scan 关联得以保留。
    accept: >
      重跑同一基金不产生重复行（content_hash 唯一），disk_scan 行的 source_url/pdf_url 被 web 值填充，
      pdf_local_path 仍非空。

  - id: REQ-2
    type: code
    title: 新增 reconcile_pdf_local_path() 回填 web 行的文件关联
    detail: >
      对 source IN ('SZSE','SSE') 且 pdf_local_path IS NULL 的行，按
      (fund_code, publish_date, 标题子串) 匹配 business.announcement_files(abs_path) 并设置 pdf_local_path。
    accept: >
      回填后 web 行 pdf_local_path 覆盖率 ≥ 80%（与 announcement_files 可 JOIN）。

  - id: REQ-3
    type: code
    title: 编排器 run_announcement_sync_all.py 串联 爬取→升级→回填
    detail: >
      调用 announcement_sync.sync_all_reits()（含 pre_listing 子同步）后跑 reconcile_pdf_local_path()，
      输出统计（新增/升级/回填数）。支持 --dry-run 仅统计不写库可选。
    accept: 编排器可独立运行，端到端产出可复核统计。

  - id: REQ-4
    type: test
    title: 单只试点 + 全量验收
    detail: >
      先以 180101 单只跑通 crawl+write 闭环（STDD Step 1.4 切片验证），再全量 --all 后台跑。
    accept: >
      单只试点后 announcements 该标的有 source_url/pdf_url；全量后 announcements 行数显著增加、
      覆盖 94 标的、content_hash 无重复、pdf_local_path 覆盖率达标。

  - id: REQ-5
    type: test
    title: 不破坏上一 slice 资产
    detail: 全量后 announcement_files 行数不变（29632），announcements 94 标的覆盖不丢。
    accept: announcement_files COUNT 仍为 29632，announcements DISTINCT fund_code = 94。
