meta:
  capability: "eol-governance"
  change_id: "2026-09-15-crlf-eol-governance"
  created: "2026-09-15"
  confidence: high

requirements:
  - id: REQ-001
    description: "仓库必须在根目录声明明确的 EOL 规则，覆盖包括 upstream/ 在内的所有子目录"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "proposal.yaml what_changes C1 / success_criteria 第 1 条"
        given: "一个已 clone 的 stdd-repo 仓库工作副本"
        when: "读取仓库根目录的 .gitattributes 文件"
        then: "该文件 SHALL 存在，且内容 SHALL 为 `* text=auto eol=lf`"
        and:
          - "该规则 SHALL 对 upstream/ 子目录同样生效（Git 属性按路径递归匹配）"
          - "仓库的 .git/info/attributes SHALL 不存在（避免与入库规则冲突）"

      - id: SC-002
        confidence: high
        evidence: "proposal.yaml success_criteria 第 2 条 / 实测：无规则 640 行 → 有规则 0 行"
        given: "一个干净的临时 Git 仓库，core.autocrlf=true，含 670 个 LF 行尾的文件"
        when: "在该仓库执行 git add -A"
        then: "stderr 中 'LF will be replaced by CRLF' 告警行数 SHALL 为 0"
        and:
          - "作为对照：相同文件集在无 .gitattributes 时实测告警为 640 行"

  - id: REQ-002
    description: "应用规则后，仓库的行尾状态必须在索引与工作区之间保持一致"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "proposal.yaml success_criteria 第 3 条 / 实测当前混合态为 4"
        given: "已应用 .gitattributes 规则并完成工作区重建的 stdd-repo"
        when: "执行 git ls-files --eol 并统计 i/lf 与 w/crlf 同时出现的文件"
        then: "该类混合态文件数 SHALL 为 0"
        and:
          - "修复前实测值为 4（docs/WORKBUDDY_INSTALL_NOTES.md、skills/stdd-fin/SKILL.md、tools/verify_workbuddy_skills.py、upstream/.gitignore）"

      - id: SC-004
        confidence: high
        evidence: "proposal.yaml success_criteria 第 4 条 / design.md Risks 第 1 行"
        given: "已完成本变更的 stdd-repo"
        when: "执行 git ls-files --eol 并统计 i/crlf 状态的索引项"
        then: "索引中 i/crlf 文件数 SHALL 为 0"
        and:
          - "此断言用于拦截 `* -text` 类规则误用导致的索引行尾翻转（实测该误用会产生 4 个 i/crlf）"

      - id: SC-005
        confidence: high
        evidence: "proposal.yaml success_criteria 第 5 条 / 实测 diff 为 0"
        given: "应用规则并执行 git add --renormalize . 之后"
        when: "执行 git diff --cached --stat 查看索引相对 HEAD 的变更"
        then: "变更文件数 SHALL 为 0"
        and:
          - "此断言证明本变更仅归一工作区行尾，未改动任何文件的实质内容"

  - id: REQ-003
    description: "EOL 治理不得破坏仓库内脚本的可执行性"
    scenarios:
      - id: SC-006
        confidence: high
        evidence: "proposal.yaml success_criteria 第 6 条 / design.md Context 约束"
        given: "已完成本变更，且 upstream/bin/stdd 检出于工作区"
        when: "检查该文件的行尾并执行 stdd init / new / status"
        then: "该文件行尾 SHALL 为 LF（不含 \\r），且三个子命令 SHALL 均正常返回"
        and:
          - "文件首行 shebang SHALL 不以 \\r 结尾"

  - id: REQ-004
    description: "EOL 策略须在文档中可查，便于后续维护者理解与排障"
    scenarios:
      - id: SC-007
        confidence: high
        evidence: "proposal.yaml what_changes C2（README §8 故障排除）"
        given: "已完成本变更的 stdd-repo"
        when: "查看 README 的「故障排除」章节"
        then: "该章节 SHALL 包含 .gitattributes 的作用说明"
        and:
          - "该章节 SHALL 包含批量 add 时的建议做法"
