    type: modified
  - id: C5
    description: "数据目录 .stdd/ → .fstdd/（含现有数据迁移）"
    type: modified
  - id: C6
    description: "Python 包 upstream/stdd/ → upstream/fstdd/"
    type: modified
  - id: C7
    description: "项目名 DKKstdd → Fstdd（含 README/NOTICE 等文档）"
    type: modified
  - id: C8
    description: "移除上游同步机制（upgrade skill 改为自管理版本）"
    type: removed

capabilities:
  new:
    - name: "独立命名空间"
      description: "全部标识使用 fstdd/FSTDD 前缀，与同名 STDD 实现彻底区分"
  modified:
    - name: "skill 集合"
      description: "6 个 skill 由 stdd-* 更名为 fstdd-*，触发词同步更新"
    - name: "CLI"
      description: "入口与 Python 包更名为 fstdd，内部 import 路径同步调整"

constraints:
  - "现有 .stdd/ 数据必须可迁移，两个已归档 change（crlf-eol-governance、skill-engineering-standards）不得丢失"
  - "改名后 install / verify / CLI 三项必须仍可用"
  - "替换必须避免双重匹配（STDD_SRC 不得变成 FFSTDD_SRC）"
  - "upstream/ 内部的包名改动必须保持 Python import 自洽"

stakeholders:
  - "D哥（项目所有者，决定改名范围与上游关系）"

risk_areas:
  - capability: "独立命名空间"
    risk: "全局替换可能误伤非标识用途的 stdd 字样（注释、变量名、URL）"
    mitigation: "分层推进（先标识层、后包与目录），每层改完立即实测；替换规则按长串优先排序"
  - capability: "CLI"
    risk: "Python 包改名后 import 断裂，导致 CLI 完全不可用"
    mitigation: "包改名单独成切片，改完立即跑 fstdd --help 与 init/new/status 冒烟"
  - capability: "skill 集合"
    risk: "数据目录改名后旧数据不可读，历史 change 丢失"
    mitigation: "迁移前完整备份（bundle），迁移后验证两个归档 change 可列出"

non_goals:
  - "不改动方法论内容（四阶段 UNDERSTAND→SPEC→BUILD→DELIVER 与 3 道 Gate 保持不变）"
  - "不引入 vsem-azamat/stdd 的 10 个细粒度 skill"
  - "不修改上游代码的功能逻辑，仅改标识与路径"

