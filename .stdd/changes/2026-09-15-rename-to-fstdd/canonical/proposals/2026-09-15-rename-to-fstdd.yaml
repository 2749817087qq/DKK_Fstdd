# 2026-09-15-rename-to-fstdd.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-09-15-rename-to-fstdd"
  title: "项目改名为 Fstdd（F=Fin）并独立于上游"
  created: "2026-09-15T22:40:53.535980"
  status: draft
  version: "2.9"

why:
  problem: |
    本项目当前名为 DKKstdd，其 skill 名、CLI 命令名、数据目录、Python 包名
    全部沿用上游 STDD 的命名。本机曾并存另一套同名实现
    （vsem-azamat/stdd，plugin build v0.11.0），两套都叫 stdd、
    都用 .stdd/ 目录、都提供 stdd CLI，混装会互相干扰。
    手工改名尝试已证明风险：364 处替换后第一处验证即失败
    （STDD_SRC → FSTDD_SRC → FFSTDD_SRC 双重替换，环境变量全部失效）。
  motivation: |
    1. 明确区分：Fstdd 作为独立项目标识，避免与同名实现混淆
    2. 定位清晰：F=Fin，项目定位为金融场景研发流程
    3. 独立发展：不再跟随上游，可自由演进

what_changes:
  - id: C1
    description: "skill 名 stdd-* → fstdd-*（6 个：fstdd、fstdd-understand/spec/build/deliver/upgrade）"
    type: modified
  - id: C2
    description: "CLI 入口 upstream/bin/stdd → upstream/bin/fstdd"
    type: modified
  - id: C3
    description: "环境变量 STDD_SRC/STDD_OUT/STDD_PY/STDD_CLI → FSTDD_*"
    type: modified
