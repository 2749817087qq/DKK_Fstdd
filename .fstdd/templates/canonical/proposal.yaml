# proposal.yaml — Canonical 格式（AI 起草、AI 修改、AI 消费）
# V2.7 引入，与 proposal.md (Human View) 并存

meta:
  change_id: ""                # 与 changes/<name>/ 目录名一致
  title: ""                    # 变更标题
  created: ""                  # ISO 8601 时间戳
  status: draft                # draft | confirmed | in_progress | completed

why:
  problem: ""                  # 问题陈述
  motivation: ""               # 为什么现在做
  evidence:                    # 证据块（TC-EPR-001：两字段必填非空）
    observed_at: "2026-01-01T00:00:00+00:00"   # 观测时刻（带时区；不得用生成时刻冒充采集时刻）
    observed_base_git_sha: "TODO-观测时-HEAD"    # 观测时的 git HEAD
    details: ""                # 证据细节（实测数据 / 命令与输出摘要）

what_changes:
  - id: C1
    description: ""            # 变更描述
    type: new                  # new | modified | removed

capabilities:
  new:
    - name: ""                 # capability 名称
      description: ""          # 描述
  modified:
    - name: ""
      description: ""

constraints:
  - ""

stakeholders:
  - ""

risk_areas:
  - capability: ""             # capability 名称
    risk: ""                   # 风险描述
    mitigation: ""             # 缓解措施

non_goals:
  - ""

critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false

anchoring:
  level: L1                    # L1 | L2 | L3 | L4
  reference_changes: []        # L3 时引用
  anchor_implementations: []   # L4 时引用

success_criteria:
  - ""

# ===== 金融领域专属字段（optional: financial=true 时填充）=====
# 由 understand.md Step 0.5 判定 FINANCIAL_PROJECT=YES 时启用
finance:                          # optional: true
  domain: ""                      # fintech | banking | payments | trading | defi | quant | other
  redlines:                       # 7 红线覆盖 — 全部 true 才能过 Gate 1
    transaction_accuracy: false    # 交易准确性: Decimal / 零浮点 / 币种统一
    idempotency: false            # 幂等性: 所有写操作幂等
    audit_immutability: false     # 审计不可篡改: 不可变日志
    books_match_reality: false    # 账实相符: reconciliation 机制
    no_silent_degradation: false  # 降级不静默: 显式标记 + 告警 + 拒绝
    data_compliance: false        # 数据合规: KYC/AML/脱敏/跨境
    no_hardcode: false            # 无硬编码: 阈值/费率配置化
  threads:                        # 四条主线自查（至少 1 条为 true）
    capital_flow: false           # 资金流: 支付/转账/清算
    trading_matching: false       # 交易撮合: 订单簿/撮合引擎
    risk_compliance: false        # 风险合规: 风控/KYC/AML
    tech_infra: false             # 技术底座: 消息队列/分布式/可观测性
