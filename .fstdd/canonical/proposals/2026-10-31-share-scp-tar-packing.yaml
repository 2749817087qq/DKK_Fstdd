risk_areas:
  - capability: share-transport-performance
    risk: "远端没有 tar 命令（极老发行版 / busybox）⇒ 解包失败，比逐文件更糟"
    mitigation: |
      ① 解包前先 `command -v tar` 探测，无 tar 直接回退逐文件模式；
      ② 解包失败时清理半成品目录并回退逐文件；
      ③ 本机服务器实测有 GNU tar（Ubuntu 22.04）。
  - capability: share-transport-performance
    risk: "tar 包内含路径穿越条目（如 `../evil`）导致远端解包写到批次目录外"
    mitigation: |
      打包时用 `arcname=os.path.basename(f)` 强制扁平化 —— 只保留文件名，不带任何目录成分；
      并在打包前复用既有的「`-` 开头文件名拒绝」校验。
  - capability: share-transport-performance
    risk: "改 scp 实现破坏既有 15 个 transport 测试"
    mitigation: "先跑 `tests/test_share_ssh_transport.py` 建立基线；改动后逐个复核失败项，只改因实现变更而必须调整的断言"

non_goals:
