# 2026-10-31-share-scp-tar-packing.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-10-31-share-scp-tar-packing"
  title: "经验回传 scp 通道改 tar 打包：112 个文件 5m19s → 目标 <30s"
  created: "2026-10-31T13:16:39+00:00"
  status: draft
  version: "2.9"

why:
  problem: |
    `tools/share_experience.py` 的 `_scp_dir()` 把 out_dir 里**每个文件单独列进 scp 命令行**
    （`scp -r -- file1 file2 ... file112 host:dir/`）。112 个经验实测耗时 **5 分 19 秒**。

    后果不是「慢」，而是**假失败**：任何外层 timeout < 5min 的调用（CI、skill 自动调用、
    人工 `timeout 120`）都会在传输中途 SIGTERM 杀掉进程 ⇒ `subprocess.run` 返回非 0
    ⇒ `_scp_dir` 判失败 ⇒ `publish()` 降级到 inbox 通道（本机无 inbox token ⇒ 401）
    ⇒ 审计记 `target: endpoint` / `result: failure`。

    **但已传的文件留在服务器上** —— 实测 2026-10-31 三次不同 timeout 留下 13 / 25 / 37 个
    文件的三个半成品批次，而审计全部记成「失败」。症状极具迷惑性：服务器上明明有文件，
    审计说没传上去。

    这个假信号直接导致我在 v3.6.0 DELIVER 收尾时误报「经验回传失败、112 条待传」——
    而这恰恰是 v3.6.0「反漂移机制」要防的**形态 A（无证据断言：看了审计就下结论，
    没核实服务器上的事实）**。

  motivation: |
    「审计说的和实际发生的不一致」比「慢」严重得多 —— 它让所有基于审计的判断都不可信。
    而且这条通道是 Phase 4 DELIVER 的自动步骤，每次交付都会跑，假信号会持续制造误判。

  evidence:
    observed_at: "2026-10-31T12:40:02+00:00"
    observed_base_git_sha: "f7a30b9d14a57161e7b2e03369e67a2fa4f2d4b7"
    details: |
      1) 完整跑一次（timeout 900）：
         `[OK] 已 scp 112 条经验 → fstdd-hub:/home/ubuntu/fstdd-inbox/local-experiences-20261031-203459`
         `经验静默回传: 成功（目标 scp）` —— **耗时 5m19s**（12:34:43 → 12:40:02 UTC）。
      2) 三次超时中断留下的半成品批次（服务器 `ls | wc -l` 实测）：
         - `local-experiences-20261031-202819`：13 files（我给的 timeout 60s）
         - `local-experiences-20261031-202930`：25 files（timeout 90s）
         - `local-experiences-20261031-203115`：37 files（timeout 120s）
         三次审计全部记 `target: endpoint` / `result: failure` / `HTTP 401`。
      3) 对照：19:25:53 与 19:29:27 两次无 timeout 限制的批次均为 **89 files（完整）**。
      4) 现有实现位置：`tools/share_experience.py:_scp_dir()` 第 1010-1015 行
         `scp -r -- <全部文件> host:batch_dir/`（显式枚举，注释说明是为了绕开
         Windows scp 不展开 glob 的问题）。

what_changes:
  - id: C1
    description: |
      新增 `_pack_tar(out_dir) -> tuple[Path | None, str]`：用 Python 标准库 `tarfile`
      把 out_dir 下所有文件打成单个 `<node_id>-experiences-<ts>.tar.gz`（写到临时目录），
      返回路径与失败原因。用标准库而非系统 `tar` 命令 —— 跨平台（Windows/macOS/Linux）
      且不依赖 PATH。
    type: new

  - id: C2
    description: |
      改 `_scp_dir()` 第 4 步：从「枚举全部文件逐个 scp」改为
      「scp 单个 tar 包 → 远端 `tar -xzf` 解包 → 删 tar」。批次目录名与时间戳语义不变
      （仍是 `{node_id}-experiences-{YYYYmmdd-HHMMSS}`），保证既有消费方（服务器侧扫描）
      不受影响。
    type: modified

  - id: C3
    description: |
      远端解包后的**文件数校验**改为：`ls batch_dir/*.md | wc -l` 与打包前的本地文件数
      比对，不一致则返回失败（防止解包不完整被当成功）。同时校验 tar 包已被删除
      （不留残骸）。
    type: modified

  - id: C4
    description: |
      保留**逐文件 scp 作为 fallback**：tar 打包失败（如文件被占用 / tarfile 异常）时
      自动回退到原有逐文件路径，并在 reason 里标注「已回退逐文件模式」。
      理由：tar 是性能优化，不该成为新的单点故障。
    type: modified

  - id: C5
    description: |
      新增 `tests/test_share_scp_tar.py`：覆盖 ① tar 打包产物可被解开且文件数与源一致
      ② 打包后单次 scp 的 argv 里只有 1 个源文件 ③ 远端解包文件数不符 ⇒ 失败
      ④ tar 打包异常 ⇒ 回退逐文件 ⑤ 安全校验（`..` 路径、`-` 开头文件名）在 tar 路径上
      仍然生效。
    type: new

capabilities:
