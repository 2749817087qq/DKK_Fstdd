# spec.yaml — 行为规格（Canonical YAML）— ci-checker-tc-recognition
# 检查器识别口径修复：测试文件 glob（两种命名）+ TC-ID 查重（定义行口径）。
# 真实判据不放宽：planned TC 无实现仍 FAIL；两案例定义行共用 ID 仍 FAIL。

meta:
  capability: "ci-checker-tc-recognition"
  change_id: "2026-10-16-ci-checker-tc-recognition"
  created: "2026-10-16T22:45:00+08:00"
  confidence: high

requirements:
  - id: REQ-CTR-001
    description: "测试文件识别由单一事实源 iter_test_files(tests_dir) 承担：同时产出 test_*.py 与 test-*.py 两种命名，去重无重复；ci.py check_tc_implementation_coverage / diff.py / trace.py 三处调用点一律经此 helper 扫描。"
    scenarios:
      - id: SC-CTR-001
        confidence: high
        evidence: "observed_at=2026-10-16T22:30:00+08:00 source=@c99ef7d 只读实测：对下游归档 change（测试全为连字符命名）跑 ci check-failures 报 TC 实现覆盖 0/10；以修正 glob（+test-*.py）复测同逻辑得 9/10（唯一缺失 TC-EPR-002 为模板引用）。EXP-2026-0001 同根因。"
        given: "tests/ 目录下存在连字符命名 test-hyphen.py，其内容承载 test-plan 中的 planned TC-ID"
        when: "调用 check_tc_implementation_coverage"
        then: "该 TC-ID SHALL 被识别为实现，覆盖检查 SHALL PASS（不再因命名漏扫报 0/N 假 FAIL）"
      - id: SC-CTR-002
        confidence: high
        evidence: "proposal constraints #1：不放宽真实判据。阈值逻辑（<50% FAIL）原样保留。"
        given: "planned TC-ID 在 tests/ 下两种命名的全部测试文件中均不存在"
        when: "调用 check_tc_implementation_coverage"
        then: "检查 SHALL 仍按原阈值判定 FAIL/WARN（glob 补全只扩大识别面，不放宽缺口检测）"
      - id: SC-CTR-003
        confidence: high
        evidence: "design.md Decision 1/2：单一事实源 + seen 去重。"
        given: "tests/ 目录同时含 test_*.py 与 test-*.py 混合命名文件"
        when: "调用 iter_test_files"
        then: "两种命名文件 SHALL 全部产出且无重复条目；docstring SHALL 声明「新增命名模式唯一修改点」"
      - id: SC-CTR-004
        confidence: high
        evidence: "design.md Decision 1 备选 C：diff.py:99 / trace.py:95 同根因点位一并切换（用户 Gate 1 未异议纳入）。"
        given: "tests/ 下仅有连字符命名测试文件承载某 TC-ID"
        when: "执行 fstdd diff 与 fstdd trace（subprocess CLI）"
        then: "diff SHALL 识别到该测试文件（不再显示「未覆盖」假阴性）；trace SHALL 定位到该测试文件与函数（不再空手）"

  - id: REQ-CTR-002
    description: "TC-ID 查重以定义行为口径：check_tcid_unique 与 validate.py:82-88 逐字一致地统计 `| **ID** | TC-… |` 定义行——两个案例定义行不得共用同一 TC-ID；矩阵/正文中引用 TC-ID 属正常写法，不判重复。"
    scenarios:
      - id: SC-CTR-005
        confidence: high
        evidence: "EXP-2026-0017（下游）：全文口径迫使每个 TC-ID 字面压到恰一次；validate.py 注释声明定义行意图。"
        given: "test-plan.md 中同一 TC-ID 在正文/矩阵多处被引用，但 `| **ID** | TC-… |` 定义行恰有一条"
        when: "调用 check_tcid_unique"
        then: "检查 SHALL PASS（多处引用属模板正常写法，EXP-2026-0017 固化）"
      - id: SC-CTR-006
        confidence: high
        evidence: "validate.py:82-88 注释声明的真实意图「两个案例不得共用同一 ID」；proposal constraint #1。"
        given: "test-plan.md 中两条案例定义行共用同一 TC-ID"
        when: "调用 check_tcid_unique"
        then: "检查 SHALL FAIL 并列出该重复 ID（真实判据不放松）"
      - id: SC-CTR-007
        confidence: high
        evidence: "EXP-20260917-A1 决定性取证：同一判据跑 10 个已归档 change，全文口径下 10/10 全部误报「重复 TC-ID」。"
        given: "EXP-20260917-A1 证据表中的 10 个历史归档 change（2026-09-15 ~ 2026-09-17，全部已通过 Gate 3 验收）"
        when: "对每个归档 change 执行 ci check-failures 的 (d) 项"
        then: "(d) SHALL 全部 PASS（0 误报；修复前该集合 10/10 FAIL）"

  - id: REQ-CTR-003
    description: "修复落地方式须可审计：既有测试 TC-CI-008 随语义同批更新并留痕；新增回归测试固定 RED→GREEN；修复前后对同一 change 复跑对比留证。"
    scenarios:
      - id: SC-CTR-008
        confidence: medium
        evidence: "design.md Decision 4：旧 fixture 编码旧全文语义，修复后必然转红，须同批更新并注释说明。"
        given: "本 change 修改 ci.py 的 check_tcid_unique 统计口径"
        when: "运行更新后的既有测试 test_check_failures_detects_duplicate_tc_ids（TC-CI-008）"
        then: "该测试 SHALL 以新语义 fixture（两定义行共用 ID）通过，且测试内 SHALL 含「旧 fixture 语义随 C4 同批更新」的审计注释"
      - id: SC-CTR-009
        confidence: medium
        evidence: "proposal success_criteria #4：真实数据复跑取证（修复前后对比）。"
        given: "下游归档 change 2026-10-16-default-free-fixture（修复前实测 (d) FAIL、覆盖 0/10）"
        when: "修复后对其复跑 ci check-failures"
        then: "(d) SHALL 由 FAIL 转 PASS，TC 实现覆盖 SHALL 由 0/10 转 9/10（唯一缺失 TC-EPR-002 为模板引用，成因不变）"
