# experience-id-generation.yaml — 行为规格（Canonical YAML）
# change: 2026-10-21-installation-id-prefix

meta:
  capability: "experience-id-generation"
  change_id: "2026-10-21-installation-id-prefix"
  created: "2026-10-21T20:30:00+08:00"
  confidence: high

requirements:
  - id: REQ-EID-001
    description: >-
      `_next_id()` SHALL 在 `installation_id` 可用时产出带前缀的 ID。
    scenarios:
      - id: SC-EID-001
        confidence: high
        evidence: "proposal C2: _next_id 改为读 installation_id"
        given: "项目 `.fstdd/version.yaml` 含 `installation_id: STDD-A1B2C3D4`"
        when: "调用 `_next_id(index, project_root)`"
        then: "返回值 SHALL 为 `STDD-A1B2C3D4-EXP-{year}-{NNNN:04d}`"
        and:
          - "NNNN SHALL 为 index.last_id + 1"
      - id: SC-EID-002
        confidence: high
        evidence: "proposal C2: 回落到旧格式"
        given: "项目 `.fstdd/version.yaml` 不存在、无 `installation_id` 字段、或字段值形状非法"
        when: "调用 `_next_id(index, project_root)`"
        then: "返回值 SHALL 为 `EXP-{year}-{NNNN:04d}`（旧格式，无前缀）"
        and:
          - "不得抛异常"
          - "不得生成空前缀（如 `-EXP-2026-0001`）"
          - "字段值形状非法时（如 `[A, B]` / `../etc/passwd` / `WBCC`）SHALL 向 stderr 出声，SHALL NOT 静默回落 —— 否则「配了 ID 却一直产出旧格式」会被当成功能未生效"
          - "形状校验 SHALL 复用 `fstdd.cli.utils.INSTALLATION_ID_RE`（与生成端同一常量）"
      - id: SC-EID-003
        confidence: high
        evidence: "proposal C2: project_root=None 回落"
        given: "`project_root` 参数为 None（如单元测试直接调用）"
        when: "调用 `_next_id(index, None)`"
        then: "返回值 SHALL 为 `EXP-{year}-{NNNN:04d}`（旧格式）"

  - id: REQ-EID-002
    description: >-
      `experience add` 命令产出的经验文件 SHALL 使用带前缀的 ID（当 installation_id 可用时）。
    scenarios:
      - id: SC-EID-004
        confidence: high
        evidence: "proposal success criteria: experience add 产出含前缀"
        given: "项目有 `installation_id: STDD-A1B2C3D4`，index last_id=5"
        when: "执行 `fstdd experience add --pattern 'test' --root-cause 'bug' ...`"
        then: "产出文件名 SHALL 含 `STDD-A1B2C3D4-EXP-{year}-0006`"
        and:
          - "frontmatter 的 `experience_id` SHALL 为完整带前缀 ID"
          - "index 的 last_id SHALL 更新为 6"

  - id: REQ-EID-003
    description: >-
      `_iter_experience_files` SHALL 能识别带前缀的经验文件。
    scenarios:
      - id: SC-EID-005
        confidence: high
        evidence: >-
          EXP-2026-0013: ID 正则与实际形态必须一致；
          proposal C3: 确认 _iter_experience_files 可识别带前缀文件名
        given: "经验目录含文件 `STDD-A1B2C3D4-EXP-2026-0001.md`，frontmatter 含 `experience_id: STDD-A1B2C3D4-EXP-2026-0001`"
        when: "调用 `_iter_experience_files(exp_dir)` 与 `_rebuild_index(exp_dir)`"
        then: "`_iter_experience_files` SHALL 返回该文件（`Path` 列表）；`_rebuild_index` 的 eid 集合 SHALL 含完整带前缀 ID"
        and:
          - "不得因前缀不符合 `EXP-*` glob 而遗漏"
          - "`_iter_experience_files` 返回 `Path` 而非 `(eid, data)` 元组 —— eid 解析发生在 `_load_experience` / `_rebuild_index` 内"
          - "完全无 frontmatter 的 `.md` 会被 `_load_experience` 判为 None 而不进索引（2026-09 起既有语义，本 change 不改）"
      - id: SC-EID-006
        confidence: high
        evidence: "proposal C3: frontmatter 优先"
        given: "经验目录含文件 `random-name.md`，frontmatter `experience_id: STDD-X-EXP-2026-0001`"
        when: "调用 `_rebuild_index(exp_dir)`"
        then: "索引中的 eid SHALL 为 `STDD-X-EXP-2026-0001`（从 frontmatter 取）"
        and:
          - "frontmatter 优先于文件名 stem"
          - "索引中 SHALL NOT 出现 `random-name`"

  - id: REQ-EID-004
    description: >-
      `_rebuild_index` SHALL 正确提取带前缀 ID 的数字部分用于 `last_id` 计算。
    scenarios:
      - id: SC-EID-007
        confidence: high
        evidence: >-
          experience.py:347 `index["last_id"] = max(numeric_ids)`；
          带前缀 ID 的数字提取需兼容
        given: "经验目录含 `STDD-A1B2C3D4-EXP-2026-0005.md` 和 `EXP-2026-0003.md`（旧格式共存）"
        when: "调用 `_rebuild_index(exp_dir)`"
        then: "`last_id` SHALL 为 5（取两者数字部分的最大值）"
        and:
          - "不得因前缀部分无法解析为数字而报错或跳过"
