  root_cause: "为修一个数据完整性问题同时加了两道防线：底层开启数据库外键约束，\n  上层加显式存在性校验。\n  做变异测试时注入「去掉底层开关」这个缺陷，测试**仍然全绿**\
    \ —— \n  因为上层校验先拦住了非法输入，底层根本没机会触发。\n  于是变异测试报告「该缺陷存活」，但真实情况是「该缺陷不可观测」，两者含义完全不同。\n"
  severity: medium
  tags:
  - testing
  - mutation-testing
  - defense-in-depth
  - observability
  title: defense in depth 的第二层防线天然不可观测 —— 上层校验拦住后，底层的开关开没开，变异测试也测不出来
  type: failure_pattern
- category: design
  cross_project_count: 2
  description: 收紧权限时一刀切禁止，摧毁了数据形态完全相同、无法区分的既有合法工作流
