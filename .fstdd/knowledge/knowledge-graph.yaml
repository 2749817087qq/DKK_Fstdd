- category: design
  cross_project_count: 1
  description: 巡检/检测逻辑豁免「当前对象」（active/current exemption），导致单对象场景下检测恒零命中 —— 最常见的失效形态恰恰是它唯一管不了的那个
  fix_template_refs:
  - KG-098-FIX
  id: KG-098
  metrics:
    last_seen: ''
    occurrence_count: 1
    severity_trend: stable
  projects:
  - stdd
  root_cause: '`_show_zombie_changes(project_root, current_name)` 里有一行

    `if d.name == current_name: continue` —— 本意是「你正在看的这个

    change 不用提醒你它僵尸」，但 `fstdd status` 无参时解析到的就是活跃

    change，于是**单 change 项目里唯一可能的僵尸被永久豁免**。

    用户看到「无僵尸警告」会误以为健康，实际是检测根本没扫它。


    豁免类逻辑的通病：豁免条件在「多对象场景」下看起来合理

    （当前对象确实最不可能僵尸），但在「单对象场景」退化成全量豁免。

    而项目里单对象场景是常态。

    '
  severity: high
  tags:
  - detection-gap
  - exemption
  - zombie
  - mutation-testing
  title: 巡检/检测逻辑豁免「当前对象」（active/current exemption），导致单对象场景下检测恒零命中 —— 最常见的失效形态恰恰是它唯一管不了的那个
  type: failure_pattern
- category: design
  cross_project_count: 1
  description: 检测/告警函数写完从未被调用（零调用方死代码）——「长期零命中」不是系统健康，是检测根本没通电
  fix_template_refs:
  - KG-099-FIX
  id: KG-099
  metrics:
    last_seen: ''
    occurrence_count: 1
    severity_trend: stable
  projects:
  - stdd
  root_cause: '`guard.py _check_phase_integrity_guard`（滞后/卡壳检测，50 行）全仓

    **零调用方**。Build 完成 >24h 未进 DELIVER、Spec 完成 >24h 未进 Build

    两类告警写了没人见过 —— 不是没发生，是函数没人调。

    更隐蔽的是：它内部的吞异常点在审计时看起来像「运行中的检测的

    失效模式」，实际是「死代码里的失效模式」，优先级判断都会被误导。


    零命中的检测逻辑有两类死因：①被吞异常杀死（EXP-20260917-B3）；

    ②从未接线（本条）。B3 的「可疑资产」清单如果只查运行痕迹，

    查不到② —— 死代码没有运行痕迹。

    '
  severity: high
  tags:
  - dead-code
  - detection
  - wiring
  - zero-caller
  title: 检测/告警函数写完从未被调用（零调用方死代码）——「长期零命中」不是系统健康，是检测根本没通电
  type: failure_pattern
- category: tooling
  cross_project_count: 1
  description: 审计表/白名单用 (文件, 语句内容) 做定位指纹，遇同文件重复语句（pass×N）互相顶替 —— 零漂移校验把 A 处的记录错配到
    B 处，漂移检测本身失真
  fix_template_refs:
  - KG-100-FIX
  id: KG-100
  metrics:
    last_seen: ''
    occurrence_count: 1
    severity_trend: stable
  projects:
  - stdd
  root_cause: 'guard.py 有 6 个 `except Exception: pass`，指纹 (file, stmt) 全是

    ("guard.py", "pass")。字典存储时后写的覆盖先写的，审计表里

    116 行的记录被拿去和 532 行的实况比对，报出「漂移 416 行」的

    荒谬结论。


    根因是把「定位」外包给了不唯一的属性。行号会漂、语句内容会重，

    两者单独都不足以定位；组合 + 同指纹序数才稳定：

    **(file, stmt, handler, 同指纹出现序数)**，行号只做 ±5 容差校验。

    '
  severity: medium
  tags:
  - fingerprint
  - audit-table
  - whitelist
  - drift-check
  title: 审计表/白名单用 (文件, 语句内容) 做定位指纹，遇同文件重复语句（pass×N）互相顶替 —— 零漂移校验把 A 处的记录错配到 B 处，漂移检测本身失真
  type: failure_pattern
