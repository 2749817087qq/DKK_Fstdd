  root_cause: 'guard.py 有 6 个 `except Exception: pass`，指纹 (file, stmt) 全是

    ("guard.py", "pass")。字典存储时后写的覆盖先写的，审计表里

    116 行的记录被拿去和 532 行的实况比对，报出「漂移 416 行」的

    荒谬结论。


    根因是把「定位」外包给了不唯一的属性。行号会漂、语句内容会重，

    两者单独都不足以定位；组合 + 同指纹序数才稳定：

    **(file, stmt, handler, 同指纹出现序数)**，行号只做 ±5 容差校验。

    '
