  description: SCHEMA 里声明了 FOREIGN KEY，但连接从未开启 PRAGMA foreign_keys —— 约束形同虚设，脏数据静默写入
  fix_template_refs:
  - KG-093-FIX
  id: KG-093
  metrics:
    last_seen: ''
    occurrence_count: 2
    severity_trend: stable
  projects:
  - stdd
  root_cause: "SQLite 的 foreign_keys 是**连接级** pragma，默认 OFF，必须在每个连接上显式开启。\n  PRAGMA\
    \ foreign_keys=ON 被写在 SCHEMA 常量里（作为建表脚本的一部分执行），\n  而建立连接的函数只设了 busy_timeout，没有设\
    \ foreign_keys。\n  结果：建表时的那次执行确实开了，但**之后所有业务连接都没开** —— 声明与运行时行为不一致。\n  实测：向不存在的父记录插入子行返回\
    \ 201，生成孤儿数据。\n"
