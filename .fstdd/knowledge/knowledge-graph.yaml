- category: code
  cross_project_count: 1
  description: naive→aware 改造时写成 _dt.now(_dt.timezone.utc) —— _dt 是 datetime 类、timezone
    是模块属性 → 必抛 AttributeError，被外层 except Exception 吞掉 → 检测逻辑静默全哑
  fix_template_refs:
  - KG-074-FIX
  id: KG-074
  metrics:
    last_seen: ''
    occurrence_count: 3
    severity_trend: stable
  projects:
  - stdd
  root_cause: '`from datetime import datetime as _dt` 之后，`_dt` 是**类**，

    `timezone` 挂在**模块**上而不是类上。`_dt.timezone` 是 AttributeError。

    三处（upgrade.py 僵尸检测无关的 upgraded_at 字段 / guard.py 僵尸 change

    检测 / guard.py 卡壳检测）全部包在 `except Exception: pass`（或 continue）

    里 —— 于是：

    - 僵尸 change 检测永远返回 False（不拦截）

    - 卡壳检测永远不加警告

    - upgraded_at 字段缺失时 upgrade notes 写入静默跳过

    没有任何报错、没有任何日志。「比崩溃更糟」的静默失效教科书案例。

    更糟的是静态检测器（check_timestamps L2）只查「now() 是否带时区参数」

    的形态，`_dt.timezone.utc` 形态上「正确」——检测器给了假安全感。

    '
  severity: high
  tags:
