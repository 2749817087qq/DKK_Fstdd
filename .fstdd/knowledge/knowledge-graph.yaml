  root_cause: "`remote.<name>.url` 是 git 的**多值**键：第一个值用于 fetch，**全部**值用于 push。\n环境变量注入（`GIT_CONFIG_COUNT`\
    \ / `GIT_CONFIG_KEY_n` / `GIT_CONFIG_VALUE_n`，\n等价于 `git -c key=value`）只是往这个列表**末尾追加**一项，而**不是替换**。\n\
    \n于是产生一种极难察觉的失效：\n  · `git config --get remote.github.url` -> 返回**注入值**（看起来成功了）\n\
    \  · `git remote -v` -> 注入值被标成**额外的 push URL**\n  · `git ls-remote github` ->\
    \ 依旧走**第一个** URL（真实远端）\n\n「查询接口」与「实际行为」给出相反的答案，而人只会去查前者。\n"
