  projects:
  - stdd
  root_cause: '`guard.py _check_phase_integrity_guard`（滞后/卡壳检测，50 行）全仓

    **零调用方**。Build 完成 >24h 未进 DELIVER、Spec 完成 >24h 未进 Build

    两类告警写了没人见过 —— 不是没发生，是函数没人调。

    更隐蔽的是：它内部的吞异常点在审计时看起来像「运行中的检测的

    失效模式」，实际是「死代码里的失效模式」，优先级判断都会被误导。


    零命中的检测逻辑有两类死因：①被吞异常杀死（EXP-20260917-B3）；

    ②从未接线（本条）。B3 的「可疑资产」清单如果只查运行痕迹，

    查不到② —— 死代码没有运行痕迹。

    '
