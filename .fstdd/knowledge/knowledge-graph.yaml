  root_cause: '实现者凭直觉把「误差上界」理解成「最坏情况总偏差」（含 offset 本身），

    没有验证每个状态的**可达性**。由于 err ≥ |offset| 恒成立，

    err ≤ tolerance 与 |offset| > tolerance 不可能同时满足 ——

    「超限」分支是死代码，而 spec 里白纸黑字要求它存在并返回退出码 1。

    这是「公式写错」与「状态机缺态」的复合缺陷，且单测若只测 happy path

    与「不可测量」就永远发现不了。

    '
