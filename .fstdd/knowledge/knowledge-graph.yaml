  root_cause: "要防止「任何节点都能删除公共讨论」，第一版方案是禁止 ack 所有带任务 ID 的留言。\n  结果既有测试立刻转红：任务失败后的 blocker\
    \ 求助流程就是\n  「自己发求助 -> 自己 ack 表示已处理」，\n  其数据形态（task_id 非空 + 收件人为空）与公共讨论**逐字节相同**，无法区分。\n\
    \  禁止它等于摧毁该工作流。\n"
