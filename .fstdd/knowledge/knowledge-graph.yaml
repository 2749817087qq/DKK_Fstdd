  id: KG-097
  metrics:
    last_seen: ''
    occurrence_count: 2
    severity_trend: stable
  projects:
  - stdd
  root_cause: "流程框架规定会话状态写在 change 目录下（便于追溯），而该目录属于 .fstdd/ **是要进版本库的**。\n  会话文件里含明文租约令牌。本轮该令牌被推到了**公开**仓库。\n\
    \  缓解事实：该任务已完成、令牌已失效，且服务只监听回环地址，实际不可被利用。\n  但**下一次执行会把一个仍在有效期内的令牌推上去**，在租约窗口内可被冒用。\n"
  severity: high
