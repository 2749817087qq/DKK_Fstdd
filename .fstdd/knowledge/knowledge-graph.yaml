  metrics:
    last_seen: ''
    occurrence_count: 1
    severity_trend: stable
  projects:
  - stdd
  root_cause: '设计验证脚本时，注意力集中在「故障能否被制造出来、告警能否被观察到」，

    而「恢复」被当作流程末尾的一个普通步骤。但恢复是**异常安全**问题：

    脚本可能在任意一步被中断（网络断、命令失败、人工 Ctrl-C），

    写在末尾的恢复语句根本执行不到。


    还有一层更隐蔽的：恢复**依赖外部可达性**时，恢复本身可能失败。

    例如「把镜像目标改成不可达地址，验证告警后改回来」——

    改回来的验证若要真正生效，需要那个目标**当时可达**；若恰好不可达，

    环境就永久留在故障态。

    '
  severity: high
  source_files: []
