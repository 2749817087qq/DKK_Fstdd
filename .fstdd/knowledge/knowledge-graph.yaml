  last_synced_at: '2026-10-03T08:33:04+00:00'
  metrics:
    last_seen: ''
    occurrence_count: 1
    severity_trend: stable
  projects:
  - stdd
  root_cause: '`_show_zombie_changes(project_root, current_name)` 里有一行

    `if d.name == current_name: continue` —— 本意是「你正在看的这个

    change 不用提醒你它僵尸」，但 `fstdd status` 无参时解析到的就是活跃

    change，于是**单 change 项目里唯一可能的僵尸被永久豁免**。

    用户看到「无僵尸警告」会误以为健康，实际是检测根本没扫它。


    豁免类逻辑的通病：豁免条件在「多对象场景」下看起来合理

    （当前对象确实最不可能僵尸），但在「单对象场景」退化成全量豁免。

    而项目里单对象场景是常态。

    '
  severity: high
  source_files: []
  tags:
  - detection-gap
  - exemption
  - zombie
  - mutation-testing
  title: 巡检/检测逻辑豁免「当前对象」（active/current exemption），导致单对象场景下检测恒零命中 —— 最常见的失效形态恰恰是它唯一管不了的那个
  type: failure_pattern
