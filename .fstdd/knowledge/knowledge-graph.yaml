  description: 质量检查工具用「文本出现次数」代替「语义单位」做判定，导致规范产物被普遍误报 —— 误报累积后使用者会养成忽略红叉的习惯，真正的失败反而被漏掉
  first_seen_at: '2026-10-03T08:33:04+00:00'
  fix_template_refs:
