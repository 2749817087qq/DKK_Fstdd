    occurrence_count: 1
    severity_trend: stable
  projects:
  - stdd
  root_cause: '实现检查时图省事，把「计数」当成了「判重」：TC-ID 的唯一性本该按「定义处」判定，

    却统计了**全文出现次数** —— 而任何规范编写的 test-plan 都必然在

    「案例定义表 / 执行矩阵 / 优先级清单」三处引用同一个 TC-ID。

    同理，AND 数量的阈值本该按「每个 SC 的 THEN 子句」判定，却统计了**整个 spec 文件**。


    更根本的问题：新增检查时**没有拿历史产物做回归**。若跑一遍已验收的产物，

    会发现它们**全部**报错 —— 这本身就是「检查写错了」的最强信号。

    '
  severity: high
  source_files: []
