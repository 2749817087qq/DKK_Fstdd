breaking_changes: []
install:
  multi_platform: true
  platforms_supported: [workbuddy, claude-code, trae]
  install_script: "tools/install_workbuddy_skills.py --platform <name>"
  update_cmd_per_platform:
    workbuddy:
      - "git pull origin master --tags"
      - "python tools/install_workbuddy_skills.py --platform workbuddy"
    "claude-code":
      - "git pull origin master --tags"
      - "python tools/install_workbuddy_skills.py --platform claude-code"
    trae:
      - "git pull origin master --tags"
      - "python tools/install_workbuddy_skills.py --platform trae"
notes: |
  upstream/ 新增 caveman.py + kg_sync.py 两个模块（本 release 携带），upstream 内核版本仍 3.1.0。
  platforms.yaml 声明 3 平台（workbuddy/claude-code/trae），install 脚本统一入口。
  所有平台 agents 按自身平台跑 --platform <name> 即可安装。

feedback_protocol:
  mandatory: true
  deadline: "24h"
  feedback_schema:
    node_id: "string (FSTDD-XXX)"
    platform: "workbuddy | claude-code | trae"
    timestamp: "ISO 8601"
    overall: "PASS | FAIL | PARTIAL"
    classes: "{L0-L6 status + duration_ms}"
    tcs: "[{id, status, evidence}]"
  publish_side_action: "跟踪各 agent complete result → 汇总 → L7 判定"
  how_to_report: "runner 自动 claim release task → complete + result JSON"