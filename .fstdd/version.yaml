    其 TC 覆盖检查硬编码扫描 `<root>/tests`，**未覆盖 `upstream/tests`（960 用例）**。
  - GitHub Release 因镜像通道未恢复无法创建，属《发布与文档规程》§二偏离（与 3.3.1–3.3.5 同）。

