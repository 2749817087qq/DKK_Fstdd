changelog: |
  v3.3.6 — 遗留债务清理版（门禁可信度：测试套件环境解耦 + 清单/断言去硬编码）

  交付（1 change：2026-10-06-legacy-debt-cleanup，归档 + 根 canonical 并入 6 文件 + canon verify 2/2 + structure merge）：
  - test-suite-portability：36 处 text-mode `subprocess` 补 `encoding="utf-8", errors="replace"`；
    另补 19 处文本 I/O（`Path.read_text/write_text/open`）的 `encoding="utf-8"`；
    `upstream/tests/test_install_scripts.py` 新增 `_force_utf8_output()`，令 Windows 下 PS 5.1
    以 UTF-8 写出重定向 stdout（此前按 `[Console]::OutputEncoding`（本机 CP936）输出 GBK，
    中文被解成 U+FFFD）。实测：根 `tests/` 在「权威 UTF-8」与「非 UTF-8(gbk)」两环境下
    结果**逐字一致**（94 passed / 4 skipped / 0 failed）。
  - release-tooling-accuracy：`.fstdd/standards/release-and-docs.md` 发布清单纠错 ——
    消除失真表述「仓库根**没有** `tests/`」、去掉会漂移的用例数、全量命令改为同时覆盖
    `upstream/tests` 与仓库根 `tests`；`tests/test_finance_content.py::test_L1_11` 与
    `tests/test_install_smoke.py::test_L0_01` 改由 `.fstdd/version.yaml` 派生（去硬编码版本字面量）。
  - canonical-hash-integrity：归档 `2026-09-18-inbox-api-only-write` 的 `proposal.md`
    `source_hash` 同步为 `29c0012fe4d0b612`；全仓 15 条 proposal `canon verify` 全部 2/2。
  - repo-hygiene：`git rm -r --cached _scratch/`（27 条目，含 2 个 gitlink）+ `.gitignore` 增 `_scratch/`；
    磁盘 12 个顶层实体零损失（25 个文件 md5 逐字节一致）。
  - 新增测试 `tests/test_subprocess_encoding_policy.py`（6）、`test_canon_hash_integrity.py`（3）、
    `test_release_manifest_accuracy.py`（10）、`test_repo_hygiene_scratch.py`（8）＝ 27 函数 / 18 TC。

  质量：根 `tests/` 双环境 94 passed / 4 skipped / 0 failed；全量 `pytest upstream/tests`
  953 passed / 5 skipped / 2 failed（1 项提交前预期、1 项 flaky 隔离复跑 PASS）；
  四自检脚本 rename 8/8、eol 7/7、skill_standards 7/7、workbuddy_skills PASS。
  经验：新增 EXP-2026-0020/0021/0022 并 verify；知识图谱 +13 节点（总计 260）。
  设计偏离 8 条（ADJ-001..008，4 large / 1 medium / 3 small）。

  已知问题（非本 change 引入）：
  - `.fstdd/standards/release-and-docs.md` 第 16 行版本号仍写 `3.1.0`（改它会违反本 change
    自身的 SC-001「其余条目逐字不变」，已记为 ADJ-005，建议另立 change 改为引用单一事实源）。
  - `fstdd ci check-failures` 的「(d) 重复 TC-ID」为**工具与约定错配**（工具要求每个 TC-ID
