# FSTDD 本地版本声明（F 仓 / stdd-repo）
# 发行版口径：fstdd_version（须 = .fstdd/config.d/project.yaml 的 stdd_version）
# vendored 上游内核口径：upstream_version（= upstream/ 内核，见 upstream/CHANGELOG.md 与 upstream/pyproject.toml）
fstdd_version: "3.3.1"
upstream_version: "3.1.0"
released_at: "2026-10-04T01:15:00+08:00"
changelog: |
  v3.3.1 — 基线清零版（6 项预存基线 pytest 失败一次性修绿）

  修复（4 类根因 / 5 切片，1 change：2026-10-04-baseline-failures-zero）：
  - 模板双源对齐：项目模板 finance 段下发镜像，canonical/proposal.yaml、canonical/spec.yaml、
    test-plan.md 三文件逐字节一致 —— 修 test_tmpl_001 / test_epr_003。
  - 裸 except 审计活表刷新：新建 change 级 audit/except-points.yaml（changes 优先 archive），
    承接 19 点 + 刷 guard.py 5 处行号 + 新入册 6 点 = 25 点，与实况零漂移 —— 修 test_aud_002 / test_grd_001。
  - 显式 --publish 用例 hermetic 化：用例内 monkeypatch publish_via_scp 为失败，验证属性而非环境
    —— 修 test_tc_cas_008b（生产三档降级逻辑零改动）。
  - naive 时间戳清零：8 处值层补 +00:00；heartbeat.py / fstdd003_daily_share.py 改 .astimezone()；
    3 处标识符日期片段入 category=identifier 豁免 —— 修 test_tsn_007。

  质量：全量 pytest upstream/tests 由 6 failed / 867 passed → 0 failed / 873 passed / 54 skipped；
  check_timestamps 0 违规 / 0 失效豁免 / 0 扫描失败；audit --check 哨兵通过；
  四自检脚本全绿（rename 8/8、eol 7/7、skill_standards 7/7、workbuddy_skills PASS）。
  已知偏离：origin 禁推 → GitHub Release 缺失（待写权限恢复补发）。

  v3.3.0 — 版本归一版（收口 3 个在办 change + 全仓版本口径归一为单一发行版号）

  版本归一（原碎片口径 → 单一发行版 3.3.0）：
  - 发行版 FSTDD = 3.3.0：.fstdd/config.d/project.yaml（stdd_version）、本文件（fstdd_version）、
    根 CHANGELOG.md [3.3.0] 段、发布 tag fstdd-v3.3.0 —— 四处同号，并由 TC-ISO-018 自动锚定。
  - vendored 上游内核 = 3.1.0：upstream/CHANGELOG.md（V3.1.0）与 upstream/pyproject.toml 对齐
    （后者原滞后为 3.0.5，属既有欠账，本次一并对齐）；属独立命名空间，不随发行版号漂移。

  变更收口（DELIVER 3 个 change）：
  - 2026-09-18-detection-silence-fixes、2026-09-21-guard-hook-input-robustness、
    2026-09-23-poll-daemon-499-fix —— 归档 + 根 canonical 并入 + canon verify 2/2 + structure merge。

  说明：GitHub Release 因 origin 禁推无法创建，属《发布与文档规程》§二偏离，已在交付说明显式记录。

  v3.2.0 — 失败模式完备版（C4 第 23 类「过度工程」+ YAGNI-7 决策梯子模板）

  核心变更（1 change / 2 能力 / 11 TC）：
  - build-yagni-ladder: BUILD Part C 的 C4 失败模式清单由 22 类扩展至 23 类，新增
    #23「过度工程（Over-Engineering）」，覆盖方式 = YAGNI-7 决策梯子
    （1 真需要→2 本仓已有→3 标准库→4 平台原生→5 已装依赖→6 一行→7 最小实现），
    首个成立级别即为答案；小节标题「14 类」→「23 类」。
    + 新增 .fstdd/templates/yagni-ladder.md（7 级判定表 + 逐级填写说明 + carve-out 豁免清单：
      安全 / 信任边界校验 / 防数据丢失的错误处理 / 无障碍 —— 永不跳过），双份一致。
    + tests/test_finance_content.py：L1-05/L1-06 断言 22→23，新增 L1-14..L1-17（共 17 TC）。

  质量：L1 17/17 全绿；全量 pytest 32 passed·2 skipped；runner L0+L1 🟢 PASS；
  失败模式 23/23 逐项执行（17 ✅ / 6 SKIPPED 非金融 / 0 ❌）；design-adjustments 2 条（DA-09/DA-10）。
  已知承接：build.md 本地/upstream 全文件既存漂移（DA-10）另立 change 对齐。

  v3.1.2 — 跨节点效率增强版（caveman 语体压缩器 + KG 自动同步器）

  核心变更（1 change / 2 能力 / 46 TC）：
  - caveman-compressor: 新增独立库 upstream/fstdd/caveman.py（compress / compress_dict，≤200 字，deterministic）
    + `fstdd caveman` CLI；canon 生成后追加 caveman_summary.txt；hub_client issue/complete 自动附 scope_min/result_min
    实测：multihub scope 543→230 字（降幅 57.6%，满足 ≥50%）；Phase 1 proposal 11367→200 字（降幅 98.2%）
  - kg-autosync: 新增 upstream/fstdd/kg_sync.py + `fstdd kg sync [--dry-run|--deep|--edge-threshold|--full]`
    scan_targets 5 类路径 → ID 提取 → ADD / UPDATE / DEPRECATE(>30天) / BUILD_EDGES(共现阈值)
    + knowledge-graph.yaml node schema 加 5 字段（first_seen_at / last_synced_at / last_removed_at / deprecated / source_files）
    + graph_version 1.1→1.2；diff_kg.yaml 输出；幂等（连续 sync 计数恒 0/0/0/0）

  质量：46/46 TC 全绿（CAVE 22 + KG 24）；失败模式 22/22 ✅；design-adjustments 8 条（DA-01~08）
  已知承接：kg-sync-incremental（DA-02/03/07）、caveman-structured-hardening（DA-08）、内联引用 ID（DA-04）

  v3.1.1 — FSTDD × 金融融合版（前序 release，tag fstdd-v3.1.1）
  6 change / 7 红线 / 10 维测试 / 22 行 C4 / 4 主线 KG；nodes 170→182

breaking_changes: []
install:
  multi_platform: true
  platforms_supported: [workbuddy, claude-code, trae]
  install_script: "tools/install_workbuddy_skills.py --platform <name>"
  update_cmd_per_platform:
    workbuddy:
      - "git pull origin master --tags"
      - "python tools/install_workbuddy_skills.py --platform workbuddy"
    "claude-code":
      - "git pull origin master --tags"
      - "python tools/install_workbuddy_skills.py --platform claude-code"
    trae:
      - "git pull origin master --tags"
      - "python tools/install_workbuddy_skills.py --platform trae"
notes: |
  upstream/ 新增 caveman.py + kg_sync.py 两个模块（本 release 携带），upstream 内核版本仍 3.1.0。
  platforms.yaml 声明 3 平台（workbuddy/claude-code/trae），install 脚本统一入口。
  所有平台 agents 按自身平台跑 --platform <name> 即可安装。

feedback_protocol:
  mandatory: true
  deadline: "24h"
  feedback_schema:
    node_id: "string (FSTDD-XXX)"
    platform: "workbuddy | claude-code | trae"
    timestamp: "ISO 8601"
    overall: "PASS | FAIL | PARTIAL"
    classes: "{L0-L6 status + duration_ms}"
    tcs: "[{id, status, evidence}]"
  publish_side_action: "跟踪各 agent complete result → 汇总 → L7 判定"
  how_to_report: "runner 自动 claim release task → complete + result JSON"