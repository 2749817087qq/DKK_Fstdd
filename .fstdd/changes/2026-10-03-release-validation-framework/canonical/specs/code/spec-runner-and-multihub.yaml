# spec: run_release_validation.py 单入口 runner + 自动 multihub 回传
# change_id: 2026-10-03-release-validation-framework

meta:
  capability: "validation-runner"
  change_id: "2026-10-03-release-validation-framework"
  created: "2026-10-03T12:48:00+08:00"
  confidence: high

requirements:
  - id: REQ-RUN-001
    description: "单入口参数解析 — --platform / --task-id / --skip / --e2e / --skip-report"
    scenarios:
      - id: SC-RUN-001-1
        confidence: high
        given: "python tests/run_release_validation.py --help"
        when: "执行 help"
        then: "help 输出包含全部 5 个参数说明"
      - id: SC-RUN-001-2
        confidence: high
        given: "--platform workbuddy"
        when: "启动 runner"
        then: "正确解析为 platform='workbuddy'"
      - id: SC-RUN-001-3
        confidence: high
        given: "--skip l2,l3"
        when: "启动 runner"
        then: "classes_to_run 排除 L2 和 L3"

  - id: REQ-RUN-002
    description: "依赖链串行执行 — 前一类 FAIL 立即停，后一类不跑"
    scenarios:
      - id: SC-RUN-002-1
        confidence: high
        given: "L1 静态校验有意 fail（修改源码让 regex 匹配不到）"
        when: "完整跑 runner"
        then: "L1 FAIL 后 runner 停止，L2/L3/L4 不被执行"
        and:
          - "stdout 显示 'STOPPED at L1 due to FAIL'"
          - "exit code = 1"

  - id: REQ-RUN-003
    description: "颜色编码输出 — 🟢🟡🔴⚪🔵 正确出现在 stdout"
    scenarios:
      - id: SC-RUN-003-1
        confidence: high
        given: "某个 TC PASS"
        when: "runner 输出"
        then: "该 TC 行前缀 🟢"
      - id: SC-RUN-003-2
        confidence: high
        given: "某个 TC SKIP"
        when: "runner 输出"
        then: "该 TC 行前缀 ⚪ + skip reason"

  - id: REQ-RUN-004
    description: "最终结构化 JSON — tests/last_report.json 包含完整报告"
    scenarios:
      - id: SC-RUN-004
        confidence: high
        given: "runner 执行完毕（不管 PASS 还是 FAIL）"
        when: "读 tests/last_report.json"
        then: "JSON 存在且含以下顶层字段: node_id, platform, timestamp, overall, classes{duration,status,tcs:[{id,name,status,evidence}]}"
        and:
          - "overall ∈ {'PASS', 'FAIL', 'PARTIAL'}"
          - "timestamp ISO 8601"

  - id: REQ-RUN-005
    description: "自动 multihub 回传 — L6 claim release task → complete + result JSON"
    scenarios:
      - id: SC-RUN-005-1
        confidence: high
        given: "--skip-report 未指定，.heartbeat.env 正确"
        when: "runner 跑完所有指定 classes"
        then: "自动 claim 并 complete release multihub task"
        and:
          - "result 字段是完整 JSON（last_report.json 内容）"
          - "claim 和 complete 都返回 200/201"
      - id: SC-RUN-005-2
        confidence: high
        given: "--skip-report 指定"
        when: "runner 跑完"
        then: "跳过 multihub 回传，只生成本地 last_report.json"
      - id: SC-RUN-005-3
        confidence: high
        given: "multihub 连通性失败"
        when: "runner 尝试 auto-report"
        then: "捕获 HTTP exception，打印指导消息，exit code 不因此增加"
        and:
          - "不吞掉之前已有的 FAIL exit code"

  - id: REQ-RUN-006
    description: "L2/L3 UI 钩子 — 当 runner 无 UI 时 gracefully SKIP"
    scenarios:
      - id: SC-RUN-006
        confidence: high
        given: "runner 在无 UI 环境运行（Linux headless）且没有 --e2e"
        when: "执行到 L2"
        then: "L2 全部 SKIP，reason='no UI available'"
        and:
          - "不硬 FAIL，不阻塞后续 L4/L6"
