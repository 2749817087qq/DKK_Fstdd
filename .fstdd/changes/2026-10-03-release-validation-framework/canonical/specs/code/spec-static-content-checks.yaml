# spec: L1 静态内容校验（test_finance_content.py — 13 TC）
# change_id: 2026-10-03-release-validation-framework

meta:
  capability: "static-content-checks"
  change_id: "2026-10-03-release-validation-framework"
  created: "2026-10-03T12:46:00+08:00"
  confidence: high

requirements:
  - id: REQ-L1-001
    description: "L1-01: skills/fstdd-fin/SKILL.md 文件存在且 > 1500 字符"
    scenarios:
      - id: SC-L1-001
        confidence: high
        given: "仓库根目录下 skills/fstdd-fin/SKILL.md"
        when: "静态检查文件存在"
        then: "assert path.exists() AND assert file.stat().st_size > 1500"

  - id: REQ-L1-002
    description: "L1-02: SKILL.md 包含全部 7 红线关键词"
    scenarios:
      - id: SC-L1-002
        confidence: high
        given: "SKILL.md 内容读入内存"
        when: "逐一检查 7 红线关键词"
        then: "7 个 assert 全 PASS"
        and:
          - "关键词清单: 交易准确性/幂等性/审计不可篡改/账实相符/降级不静默/数据合规/无硬编码"

  - id: REQ-L1-003
    description: "L1-03: understand.md 含 Step 0.5 + 金融判定"
    scenarios:
      - id: SC-L1-003
        confidence: high
        given: ".fstdd/skills/understand.md 内容读入"
        when: "搜索 Step 0.5 和 金融 关键词"
        then: "assert 'Step 0.5' in content AND assert '金融' in content"

  - id: REQ-L1-004
    description: "L1-04: upstream understand.md 同步含 Step 0.5"
    scenarios:
      - id: SC-L1-004
        confidence: high
        given: "upstream/.fstdd/skills/understand.md 内容读入"
        when: "搜索 Step 0.5"
        then: "assert 存在"

  - id: REQ-L1-005
    description: "L1-05: build.md C4 section 精确 22 行（含 header + 22 table rows）"
    scenarios:
      - id: SC-L1-005
        confidence: high
        given: ".fstdd/skills/build.md 内容读入"
        when: "用正则提取 '## C4' 到 '## C5' 之间的 table 行数"
        then: "精确等于 22（不是 14，不是 39）"
        and:
          - "提取方法: 找 | 开头的 table row，排除 header 和 separator"

  - id: REQ-L1-006
    description: "L1-06: upstream build.md C4 同步 22 行"
    scenarios:
      - id: SC-L1-006
        confidence: high
        given: "upstream/.fstdd/skills/build.md"
        when: "同 L1-05 方法"
        then: "精确 22 行"

  - id: REQ-L1-007
    description: "L1-07: B2.5 section 含 10 维金融测试关键词"
    scenarios:
      - id: SC-L1-007
        confidence: high
        given: "build.md 内容"
        when: "搜索 B2.5 section 下的 10 个关键词"
        then: "全部命中: 幂等/对账/精度/时区/降级/一致/安全/审计/合规/恢复"

  - id: REQ-L1-008
    description: "L1-08: 8 类金融失败模式关键词存在"
    scenarios:
      - id: SC-L1-008
        confidence: high
        given: "build.md C4 table"
        when: "搜索 8 类金融失败模式"
        then: "全部命中: 重复扣款/账实不符/静默降级/精度丢失/审计缺口/状态机漏洞/额度穿透/合规遗漏"

  - id: REQ-L1-009
    description: "L1-09: KG FIN- 前缀节点 ≥ 12"
    scenarios:
      - id: SC-L1-009
        confidence: high
        given: "knowledge-graph.yaml 解析为 dict"
        when: "遍历 nodes 列表，统计 id 以 'FIN-' 开头的节点"
        then: "count >= 12"

  - id: REQ-L1-010
    description: "L1-10: KG graph_version >= 1.1"
    scenarios:
      - id: SC-L1-010
        confidence: high
        given: "knowledge-graph.yaml 解析"
        when: "读取 graph_version 字段"
        then: "assert float(version) >= 1.1"

  - id: REQ-L1-011
    description: "L1-11: version.yaml fstdd_version = 3.1.1"
    scenarios:
      - id: SC-L1-011
        confidence: high
        given: ".fstdd/version.yaml 解析"
        when: "读取 fstdd_version"
        then: "assert version == '3.1.1'"

  - id: REQ-L1-012
    description: "L1-12: version.yaml feedback_protocol.mandatory = true"
    scenarios:
      - id: SC-L1-012
        confidence: high
        given: "version.yaml 解析"
        when: "读取 feedback_protocol.mandatory"
        then: "assert mandatory is True"

  - id: REQ-L1-013
    description: "L1-13: 3 平台 install 命令字段齐全"
    scenarios:
      - id: SC-L1-013
        confidence: high
        given: "version.yaml install.install_by_platform 解析"
        when: "检查 workbuddy/claude_code/trae 三个 key 都存在"
        then: "全部存在且各自有 install 命令数组"
