# spec: L0 基础设施冒烟（test_install_smoke.py — 5 TC）
# change_id: 2026-10-03-release-validation-framework

meta:
  capability: "install-smoke"
  change_id: "2026-10-03-release-validation-framework"
  created: "2026-10-03T12:47:00+08:00"
  confidence: high

requirements:
  - id: REQ-L0-001
    description: "L0-01: git pull 拉到 fstdd-v3.1.1 tag"
    scenarios:
      - id: SC-L0-001
        confidence: high
        given: "当前在 FSTDD 工作目录，remote 配置正确"
        when: "执行 git fetch origin --tags; git describe --tags --exact-match HEAD"
        then: "输出 fstdd-v3.1.1 或包含该 tag"
        and:
          - "exit 0"

  - id: REQ-L0-002
    description: "L0-02: install_workbuddy_skills.py --platform <p> → exit 0, 7/7 OK"
    scenarios:
      - id: SC-L0-002
        confidence: high
        given: "--platform 参数传入有效平台"
        when: "执行 python tools/install_workbuddy_skills.py --platform <p>"
        then: "exit code = 0"
        and:
          - "stdout 包含 '7/7 OK' 或类似成功标记"
          - "skill 目标目录下存在 fstdd-fin/SKILL.md"

  - id: REQ-L0-003
    description: "L0-03: verify_workbuddy_skills.py → exit 0, 所有 skill PASS"
    scenarios:
      - id: SC-L0-003
        confidence: high
        given: "install 已完成"
        when: "执行 python tools/verify_workbuddy_skills.py --platform <p>"
        then: "exit code = 0"
        and:
          - "stdout 无 FAIL 行"

  - id: REQ-L0-004
    description: "L0-04: node heartbeat — 本节点出现在 multihub online nodes 列表"
    scenarios:
      - id: SC-L0-004
        confidence: high
        given: ".heartbeat.env 有正确的 FSTDD_NODE_ID"
        when: "执行 hub_client.py 列出 online nodes"
        then: "本节点 id 在列表中"
        and:
          - "multihub 连通性确认"

  - id: REQ-L0-005
    description: "L0-05: multihub ping → exit 0"
    scenarios:
      - id: SC-L0-005
        confidence: high
        given: ".heartbeat.env 有正确的 multihub URL + token"
        when: "执行 hub_client.py ping"
        then: "exit code = 0"
        and:
          - "response status 200"
