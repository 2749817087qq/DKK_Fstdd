success_criteria:
  - "SC-1 干净 venv pip install -e .[test] 后 fstdd --help 正常、pytest upstream/tests 全绿（实机执行）"
  - "SC-2 docs/UPSTREAM_PATCHES.md 存在且含登记表头；fstdd validate 对「upstream/ 未登记修改」报非零（⚠️ 检查项 CLI 集成已按 AMD-001 切出为独立 change；本批次交付登记表 + 参考实现）"
  - "SC-3 审计脚本在真实仓库实跑成功（退出码 0），产出 audit JSON"
