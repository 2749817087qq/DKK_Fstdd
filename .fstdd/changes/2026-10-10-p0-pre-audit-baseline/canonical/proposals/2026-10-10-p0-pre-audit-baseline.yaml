meta:
  change_id: "2026-10-10-p0-pre-audit-baseline"
  title: "P0-pre 审计基线批次 —— 开箱可安装 + vendored 补丁登记契约 + 经验库失真量化基线"
  created: "2026-10-10T12:13:36+00:00"
  status: confirmed
  version: "2.9"
  gate_source: "外部沙箱（Gate 1 = 2026-10-10T18:26+08:00 / Gate 2 = 2026-10-10T18:32+08:00）；本仓登记入库"

why:
  problem: |
    FSTDD 的核心短板是「规矩没有被可信地数据化」：经验库 79 条目中 46 条（58%）因解析器
    `experience.py:428` 只取首个 frontmatter 块而静默丢失 experience_id / category / severity，
    `experience stats` 的分类分布系统性失真。治理可信度是 D1 消费端分层的前提（P0-pre 前置的理由），
    而**修复必须先有量化的修复前基线**，否则「修好了」无法证伪。同时仓库开箱不可用（默认解释器缺
    pyyaml/jinja2/requests/pytest），且对 vendored 内核的修改尚无登记契约，直接动手会制造 fork drift。
  evidence:
    observed_at: "2026-10-10T19:35:51+08:00"
    observed_base_git_sha: "0c8d2de8b5e904b55931eb3183438cd910e35197"
    details: |
      真实仓库只读实跑（命令）：
        python tools/audit_experience_baseline.py --repo . \
               --out .fstdd/experiences/audit-2026-10-experience-baseline.json
      输出摘要：total_entries=79 / dual_block_entries=47 / affected_entries=46（58.2%）/
               field_loss_counts={experience_id:46, category:46, severity:46}
      索引对账（修复 load_index_keys 后）：indexed_true=78 / indexed_false_files=[] /
               unreconciled_files=['EXP-009-20260925-TRPC-REVERSE.md'] / invariant_ok=True
      产物：.fstdd/experiences/audit-2026-10-experience-baseline.json（71,984 B）

what_changes:
  - description: "pyproject.toml：声明运行时依赖（pyyaml/jinja2/requests）与 [test] extra（pytest），打包 upstream/fstdd，fstdd console script 指向 fstdd.cli:main"
  - description: "docs/UPSTREAM_PATCHES.md：vendored 补丁登记表（单一事实源）"
  - description: "tools/audit_experience_baseline.py：只读审计脚本（量化经验库元数据失真）"
  - description: "在真实仓库实跑审计，产出 audit-2026-10-experience-baseline.json 修复前基线并归档"
  - description: "tools/validate_upstream_patches.py + tools/tests/test_governance_baseline.py：validate upstream-patches 检查项的参考实现与测试（⚠️ CLI 集成已按 AMD-001 切出）"

