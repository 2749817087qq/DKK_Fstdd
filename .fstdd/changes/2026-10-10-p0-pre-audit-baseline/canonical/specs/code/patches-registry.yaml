  change_id: 2026-10-10-p0-pre-audit-baseline
  created: '2026-10-10T12:14:43+00:00'
  confidence: high
requirements:
- id: REQ-001
  description: 对 upstream/ 的任何修改先登记，登记有单一事实源
  scenarios:
  - id: SC-001
    given: 仓库根存在 docs/UPSTREAM_PATCHES.md
    when: 读取文件头
    then: SHALL 包含基线声明（E=3.0.5 / K=3.1.0 / R=3.3.8）与指向 UPSTREAM_BASELINE.md 的引用
  - id: SC-002
    given: 表体任一行
    when: 解析该行
    then: SHALL 具备 8 列：# / 文件 / 行号 / 修改原因 / 关联上游issue或PR / 登记日期 / 登记人 / 预期回退版本
  - id: SC-003
    given: 「待登记」区
    when: 检查其内容
    then: SHALL 至少列出 experience.py:428（解析器缺陷）一项；CRLF 项 SHALL 标注「走上游 PR，不本地改」
