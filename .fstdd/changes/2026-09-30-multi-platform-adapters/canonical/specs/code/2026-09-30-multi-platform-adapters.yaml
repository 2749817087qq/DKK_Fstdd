# spec.yaml — 行为规格（Canonical YAML）
meta:
  capability: "multi-platform-adapters"
  change_id: "2026-09-30-multi-platform-adapters"
  created: "2026-09-30T06:46:21+00:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "多平台适配必须由平台薄清单 platforms.yaml 作为唯一事实源，每平台一条清单描述其 skill 根目录解析规则与 front-matter 规则"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "proposal.yaml capabilities.new『多平台 skill 安装』；observed_at=2026-09-30T07:56:18+00:00 source=f556899"
        given: "仓库需要把同一套 FSTDD 共享正文安装到多个目标平台"
        when: "读取多平台适配的配置来源"
        then: "每平台的显示名、skill 根目录解析规则与 front-matter 规则 SHALL 集中在 platforms.yaml 单一声明"
        and:
          - "正文来源 SHALL 引用仓库共享 skill 正文，SHALL NOT 在清单内复制正文"
      - id: SC-002
        confidence: high
        evidence: "proposal.yaml success_criteria[3]；proposal.yaml capabilities.new『新增平台只需在 platforms.yaml 增一条清单』"
        given: "需要为仓库新增一个目标平台"
        when: "开发者准备让安装层支持该平台"
        then: "新增平台 SHALL 只需在 platforms.yaml 增/改一条清单"
        and:
          - "SHALL NOT 需要新增按平台编写的安装代码分支"

  - id: REQ-002
    description: "安装器 install_workbuddy_skills.py 必须接受 --platform 选择目标平台，并按 platforms.yaml 渲染 front-matter 与输出目录"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "proposal.yaml success_criteria[1]；observed_at=2026-09-30T07:56:18+00:00 source=f556899"
        given: "target 平台为 claude-code 且 platforms.yaml 已声明其规则"
        when: "执行安装器并指定 --platform claude-code"
        then: "产出 SHALL 落在 `<claude skills 根>/<name>/SKILL.md`"
        and:
          - "其 front-matter SHALL 符合 Claude Code 规则：不含 version 与 trigger_keywords"
          - "description SHALL 采用 Claude Code 要求的引号形态"
      - id: SC-004
        confidence: high
        evidence: "proposal.yaml what_changes『读 platforms.yaml』；错误平台不得静默回退到 workbuddy"
        given: "传入的 --platform 值未在 platforms.yaml 中声明"
        when: "执行安装器"
        then: "安装器 SHALL 以非零退出码报错并列出可用平台"
        and:
          - "SHALL NOT 静默回退到 workbuddy 或其它平台继续安装"

  - id: REQ-003
    description: "`--platform workbuddy`（含缺省）必须与本次变更前的产出逐字节一致，作为回归保护"
    scenarios:
      - id: SC-005
        confidence: high
        evidence: "proposal.yaml capabilities.modified『workbuddy 逐字节一致』；proposal.yaml success_criteria[0]"
        given: "在变更前已保存 workbuddy 产出的基准快照"
        when: "以 `--platform workbuddy` 重新安装"
        then: "每个 `<name>/SKILL.md` 的字节内容 SHALL 与变更前基准逐字节一致"
      - id: SC-006
        confidence: high
        evidence: "proposal.yaml what_changes『默认 workbuddy，保持现有行为』"
        given: "未显式传入 --platform"
        when: "执行安装器"
        then: "行为 SHALL 等同显式 `--platform workbuddy`"
        and:
          - "默认值 SHALL 在 platforms.yaml 或安装器参数声明中集中定义，不得散落"

  - id: REQ-004
    description: "实现必须只保留一套共享正文，禁止产出按平台复制的手写正文分支"
    scenarios:
      - id: SC-007
        confidence: high
        evidence: "proposal.yaml why『禁止产出 N 份手写适配分支』；proposal.yaml success_criteria[2]"
        given: "仓库内存在任一平台的 skill 产出"
        when: "比对任意平台 skill 的正文与仓库共享正文源"
        then: "该正文 SHALL 与共享正文源同源可验"
        and:
          - "仓库内 SHALL NOT 存在第二份按平台复制的手写正文副本"
      - id: SC-008
        confidence: high
        evidence: "proposal.yaml success_criteria[3]；供代码审查与本变更用例断言"
        given: "安装层代码已实现多平台支持"
        when: "审查安装层源码"
        then: "SHALL NOT 存在按平台展开的 if/else 硬编码分支"
        and:
          - "平台差异 SHALL 全部由 platforms.yaml 数据驱动"

  - id: REQ-005
    description: "入口脚本 install.sh 与 install.ps1 必须把平台选择透传给安装器"
    scenarios:
      - id: SC-009
        confidence: medium
        evidence: "proposal.yaml what_changes『install.sh 增 --platform 透传』；proposal.yaml success_criteria[4]"
        given: "用户在 POSIX shell 环境下执行一键安装"
        when: "执行 `./install.sh --platform <p>`"
        then: "脚本 SHALL 把 `<p>` 透传给安装器并据此完成安装与校验"
        and:
          - "未传 --platform 时 SHALL 保持原有默认行为不变"
      - id: SC-010
        confidence: medium
        evidence: "proposal.yaml what_changes『install.ps1 增 -Platform 透传』；proposal.yaml success_criteria[4]"
        given: "用户在 Windows PowerShell 环境下执行一键安装"
        when: "执行 `./install.ps1 -Platform <p>`"
        then: "脚本 SHALL 把 `<p>` 透传给安装器并据此完成安装与校验"
        and:
          - "未传 -Platform 时 SHALL 保持原有默认行为不变"

  - id: REQ-006
    description: "校验脚本必须平台感知，保证装哪平台就校验哪平台"
    scenarios:
      - id: SC-011
        confidence: high
        evidence: "proposal.yaml what_changes『verify 增平台感知，默认仍 workbuddy』"
        given: "未显式指定平台"
        when: "执行校验脚本"
        then: "校验 SHALL 针对 workbuddy 安装点进行"
        and:
          - "校验判据 SHALL 与安装器共用同一 platforms.yaml 事实源"
      - id: SC-012
        confidence: high
        evidence: "proposal.yaml what_changes『保证装哪平台就校验哪平台』；proposal.yaml success_criteria[4]"
        given: "目标平台为 claude-code 或 trae 且已按该平台安装"
        when: "执行校验脚本并指定该平台"
        then: "校验 SHALL 针对该平台的安装点与其 front-matter 规则进行"
        and:
          - "校验结果 SHALL 能区分『已装且合规』与『未装/不合规』"