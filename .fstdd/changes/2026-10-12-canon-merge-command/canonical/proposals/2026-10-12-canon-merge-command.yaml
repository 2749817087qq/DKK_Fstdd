meta:
  change_id: 2026-10-12-canon-merge-command
  title: canonical 合并自动化 —— 新增 fstdd canon merge，消除 DELIVER 的手工拷贝
  created: '2026-10-12T13:45:45+00:00'
  status: draft
  version: '2.9'
why:
  problem: "DELIVER 的「canonical 合并」**没有 CLI 命令，全靠人工拷贝**：\n  · `fstdd canon` 只有 `init` / `generate` / `verify`（注册点 `upstream/fstdd/cli/__init__.py:301-310`），\n    `canon.py` 532 行内**无 merge**；\n  · 而 DELIVER\
    \ skill（`.workbuddy-ai/skills/fstdd-deliver/SKILL.md` L52-53）要求\n    「① proposal → `canonical/proposals/`；② 各 capability 的 agent_spec → `canonical/specs/agent/`」；\n  · `archive` 命令**只合并 Human View**（`.fstdd/specs/`），**不碰**根\
    \ `canonical/`。\n\n由此产生三类实际损耗（均在本仓已发生）：\n  ① **每次 DELIVER 固定手工动作**：根 canonical 已积 **71 个 YAML**、`.canon-index.yaml` 22 条；\n     累计 **207 个归档 canonical 文件**，每次都要人工判断该拷哪些、拷到哪、索引怎么改。\n  ② **命名口径不一致且无人裁决**：归档\
    \ change 内 3 个文件**全用 change 名**\n     （如 `specs/code/2026-10-11-share-hardening-audit-fixes.yaml`）；而根 canonical 的\n     `specs/code/` 用 **capability 名**（`repo-hygiene.yaml` / `yagni-ladder-gate.yaml`\
    \ …），\n     `specs/agent/` **两种混存**（既有 `inbox-deploy.yaml` 又有 change 名）。\n     ⇒ 手工合并时「该叫什么名」没有单一事实源。\n  ③ **易漏**：DELIVER skill 只提 proposal + agent_spec，**未提 code spec** ——\n     实测 2026-10-10 那次由主理人手工补了\
    \ code spec（capability 名），\n     而 2026-10-11 的 3 个 change 用了 change 名 ⇒ **同类文件两套命名并存**。\n"
  motivation: '这是**每次 DELIVER 都必然发生**的重复劳动 + 口径漂移源，且漂移会累积进根 canonical

    （不可逆的历史污染）。收口点明确、收益即时：一个幂等命令即可把「人工判断」变成「确定性动作」。

    同时，本 change 触碰 vendored 内核 ⇒ 正好**首次实跑** `docs/UPSTREAM_PATCHES.md` 的登记契约。

    '
  evidence:
    observed_at: '2026-10-12T13:45:46+00:00'
    observed_base_git_sha: 34f11b50a22725af2ad45f2b7663fa535f332b66
    details: "【观测 1｜命令面】`fstdd canon --help` → positional arguments: {init,generate,verify}；\n  `upstream/fstdd/cli/commands/canon.py` = 532 行，函数清单含\n  `cmd_canon_init` / `cmd_canon_generate` / `_generate_spec`\
      \ / `_generate_one` / `cmd_canon_verify`，\n  **无任何 merge/consolidate 函数**。\n\n【观测 2｜规模】根 `canonical/` 下 `*.yaml` = **71 个**；`.canon-index.yaml` 顶层 22 条\n  （proposals 20 / specs.agent 17 / specs.code\
      \ 33，合计 70 条目）；\n  `.fstdd/archive/*/canonical/` 累计 **207 个 YAML**。\n\n【观测 3｜命名口径分裂】归档 change 内：`proposals/<change>.yaml` + `specs/agent/<change>.yaml`\n  + `specs/code/<change>.yaml`（**三处同用 change\
      \ 名**）；\n  根 canonical：`specs/code/` 见 `quarantine-opt-in-safety.yaml` / `release-tooling-accuracy.yaml` /\n  `repo-hygiene.yaml` / `scan-coverage.yaml` / `test-suite-portability.yaml` / `version-nomenclature.yaml`\n\
      \  / `yagni-ladder-gate.yaml`（**capability 名**），**同时**也存在 `<change>.yaml` 形态；\n  `specs/agent/` 见 `inbox-api-only-write.yaml` / `inbox-deploy.yaml`（capability 名）\n  **与** `<change>.yaml`（change 名）并存。\n\
      \n【观测 4｜登记契约已就绪但从未实跑】`docs/UPSTREAM_PATCHES.md` 表体当前为空\n  （仅「待登记」区 2 条：experience.py:428 / CRLF）；本 change 将是**首个**正式登记项。\n\n【观测 5｜C2 的字段可行性实测（2026-10-12 追加，**修正了 C2 的原始假设**）】\n  · `specs/code/*.yaml`：**均含**\
      \ `meta.capability`\n    （`share-hardening-audit-fixes` / `experience-center-node-sync` / `experience-library-consolidation`\n    / `repo-hygiene` / `yagni-ladder-gate` / `quarantine-opt-in-safety`），且\
      \ `meta.change_id` 亦在\n    ⇒ 可作命名依据；\n  · `specs/agent/*.yaml`：**不含** `meta.capability`（3 个归档 change 实测**全为 None**），仅 `meta.change_id`\n    ⇒ agent spec 的命名**只能回退 change_id**；\n  · `proposals/*.yaml`：不含\
      \ capability，用 `meta.change_id` ⇒ 与既有文件名一致。\n  ⇒ **命名口径无法统一为「全部 capability 名」**：`code spec 用 capability + agent spec 用 change_id`\n    是当前数据模型下的唯一自洽解。若要真正统一，须改 agent spec 的 schema（列为 non_goals）。\n\
      \  ⇒ 另证：根 `canonical/specs/code/` 中 `repo-hygiene.yaml`（文件名=capability）与\n    `2026-10-11-share-hardening-audit-fixes.yaml`（文件名=change_id）**并存**，确认口径分裂属实。\n\n\n【观测 6｜两个根 canonical 目录，代码指向错的那个（Phase\
      \ 2 实拍，2026-10-13）】\n· 仓库根 `canonical/`：**74 个被 git 跟踪的文件**（proposals 21 / specs.code 34 / specs.agent 18）—— **这是真正的根 canonical**，DELIVER 手工合并一直写这里。\n· `.fstdd/canonical/`：`designs` / `proposals`\
      \ / `specs` 三个**空**子目录，**0 个被跟踪文件、无提交历史** —— 陈旧空骨架（`canon init --project-level` 的产物）。\n· \U0001F534 而 `canon.py:38` 的 `_get_canon_dir(project_root)`（无 change_name 时）**返回 `.fstdd/canonical`** ⇒ `canon\
      \ generate --all` 与 `_generate_one` 的「项目级回退」分支扫的是空目录。属既有缺陷，本 change 的 `merge` 必须以**仓库根 `canonical/`** 为唯一目标，并把「根 canonical 路径」收口为单一事实源。\n\n【观测 7｜命名惯例量化（Phase 2 实拍，① DELIVER 后刷新）】\n· `canonical/proposals/`：21\
      \ 个，**100% change_id 命名**。\n· `canonical/specs/agent/`：18 个，**16 个 change_id（89%）** + 2 个 capability（`inbox-api-only-write` / `inbox-deploy`）。\n· `canonical/specs/code/`：34 个，**23 个 capability（68%）**\
      \ vs 11 个 change_id（32%）—— capability 命名是主流且占比在升（① DELIVER 又新增 1 个 capability 名）。\n⇒ 印证 C2 的「三分法」：proposal / agent spec 用 `meta.change_id`，code spec 用 `meta.capability`。"
what_changes:
- id: C1
  description: '新增子命令 `fstdd canon merge <change>`（注册点 `upstream/fstdd/cli/__init__.py`，

    实现在 `upstream/fstdd/cli/commands/canon.py`）：把 `changes/<change>/canonical/` 下的

    `proposals/` + `specs/agent/` + `specs/code/` 合并进仓库根 `canonical/`。

    '
  type: new
- id: C2
  description: "**命名口径单一事实源（含实测修正）**：目标文件名取源文件内的元数据 ——\n  · proposal → `meta.change_id`；\n  · code spec → `meta.capability`（实测**均含**该字段）；\n  · agent spec → **回退 `meta.change_id`**（⚠️ 实测 `specs/agent/*.yaml`\
    \ **不含** `meta.capability`）。\n缺字段时按既有约定回退并在输出中告警，**不得静默改名**。\n⇒ 结论：命名口径**无法**统一为「全部 capability 名」；上述三分法是当前数据模型下的唯一自洽解，\n若要真正统一须改 agent spec 的 schema（列入 non_goals）。\n"
  type: new
- id: C3
  description: '自动维护根 `canonical/.canon-index.yaml`：登记/更新条目，**幂等**（重复执行不产生差异）。

    '
  type: new
- id: C4
  description: '支持 `--dry-run`（只预览将写哪些文件、索引如何变化）与归档 change（走 `finder` 的归档回退），

    并在合并后自动跑一次 `canon verify` 自证。

    '
  type: new
- id: C5
  description: '在 `docs/UPSTREAM_PATCHES.md` **正式登记**本 change 对 `upstream/fstdd/cli/` 的修改

    （本仓首个正式登记项，同时验证登记契约可用）。

    '
  type: new
capabilities:
  new:
  - name: canon-merge-automation
    description: 'canonical 合并的确定性自动化：`fstdd canon merge` 按源文件元数据决定目标命名与索引登记，

      幂等、可预览、可自证，消除 DELIVER 的手工拷贝与命名漂移。

      '
  modified: []
constraints:
- 本 change 修改 `upstream/fstdd/cli/`（vendored 内核）⇒ **动手前必须先在 `docs/UPSTREAM_PATCHES.md` 登记**
- 命令须**幂等**：连续执行两次，第二次 `git diff` 为空
- 命令须**可预览**：`--dry-run` 不得写盘
- 合并后须**自证**：`fstdd canon verify <change>` 通过
- 不得破坏既有 `canon init` / `canon generate` / `canon verify` 的行为与测试
- '**历史存量命名不一致不在本 change 修正**（仅保证新合并项口径统一）'
stakeholders:
- D哥（工程负责人）
- FSTDD 交付流程（DELIVER 每次都要执行此步）
- 后续所有 change 的执行者
risk_areas:
- capability: canon-merge-automation
  risk: 修改 vendored 内核 ⇒ **fork drift**（上游同步时被覆盖或冲突）
  mitigation: 先登记 `UPSTREAM_PATCHES.md`（含「预期回退版本」列）；评估是否走上游 PR 路线；保持改动最小且集中在新增函数
- capability: canon-merge-automation
  risk: 命名口径若选错，会把错误命名**自动化地**写入根 canonical（比手工更危险）
  mitigation: 以源文件 `meta.capability` / `meta.change_id` 为唯一依据；`--dry-run` 先预览；对缺字段者告警而非静默改名
- capability: canon-merge-automation
  risk: 改动 `cli/__init__.py` 影响 CLI 解析面（全部子命令）
  mitigation: 只在既有 `canon` 子解析器下加一个子命令；跑 CLI 冒烟 + 全量根级/框架侧测试
non_goals:
- 重命名或迁移**历史** canonical 文件（口径治理另立 change）
- '**统一 `specs/agent/` 的 schema**（使其含 `meta.capability`，从而可统一为 capability 命名）—— 属数据模型变更，另立 change'
- 改变 `archive` 命令的行为（仍只合并 Human View 到 `.fstdd/specs/`）
- 实现「从文件内容推断 capability 名」的启发式（只用显式 `meta.capability`）
- 处理 `canonical/designs/`（当前为空）
- 修 `experience.py:428` / CRLF 等既有 upstream 欠账（各为独立 change）
critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false
anchoring:
