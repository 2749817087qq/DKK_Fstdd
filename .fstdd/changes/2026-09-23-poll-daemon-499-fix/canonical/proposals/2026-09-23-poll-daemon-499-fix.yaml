  - "演示轮：本次 pull 实际以 background+await 执行，scp exit=0、文件落地、
    前台 turn 完好（无自动后台化 499）。"
  - "负向对照：历史前台模式（2m18s）曾触发 499；新模式下同耗时传输不再产生 499。"
  - "收/复 对账与回执闭环功能零回归（缺口仍能自愈、最长延迟 ≤60min）。"
