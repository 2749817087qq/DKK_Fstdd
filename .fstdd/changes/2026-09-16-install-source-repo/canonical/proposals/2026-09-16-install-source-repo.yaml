why:
  problem: |
    上一个 change（`contract-auto-share`）做 DELIVER 时，**三项提交前校验级联失败**
    （`verify_eol` → `verify_rename` → `verify_skill_standards`）。逐层排查后，
    根因**不是校验脚本写错，而是「谁是权威」这件事从来没定清楚**。

    ## 一、机器上并存三个位置，职责混乱

    | 位置 | 实际角色 | 状态 |
    |---|---|---|
    | `…/stdd-repo`（会话工作区） | 开发副本 | 最新，含全部提交 |
    | `~/.workbuddy-ai/Fstdd` | **法定源**（`docs/WORKBUDDY_INSTALL_NOTES.md` 已指定） | **无 `.git`** |
    | `D:/Programs/DKK_Fstdd` | 另一程序的调试副本 | 落后，且有未提交改动 |

    三者之间**靠手工 cp 同步** —— 这正是本日两轮漂移的共同根源：
    没有 hash、没有冲突检测，漂移可以静默发生。

    ## 二、误报的具体机制

    `verify_skill_standards.py::_installed_tools()` 把 `D:/Programs/DKK_Fstdd` **硬编码在首位**。
    于是从仓库运行时它跑去校验**调试副本**的 verify，而那份期望 skill 引用 D 盘路径；
    与实际安装不符 —— **两相对照必然 FAIL**。

    同一脚本的「备份完整性」检查**无条件要求存在 `--fix` 备份**；
    但 `--fix` 幂等，**树已合规时不留备份** → 合规环境里恒定 FAIL。

    调试副本里其实**已有一份修复**（自定位），仓库却没有 —— 又是一次**双向漂移**。

    ## 三、调试副本里还有一份仓库没有的实质工作

    | 文件 | 内容 |
    |---|---|---|
    | `upstream/fstdd/cli/commands/knowledge.py` | 移除硬编码的 `leonai42/stdd-experiences` 默认值；`repo` 为空时**提前返回**（否则空值会落到 `gh clone` 仍外联） |
    | `upstream/.fstdd/config.d/knowledge.yaml` | `repo: ""`（不拉取社区图谱） |
    | `upstream/.fstdd/config.d/experience.yaml` | `registries: []`（移除上游三方 registry） |

    **这是数据流策略变更**：既有策略是「可拉上游社区（只进）」；这份工作把**拉取源也去掉**，
    完全收敛到自有仓库。D哥 已决定**采纳**。

    且它与 `contract-auto-share` **冲突**：该 change 的 `ALLOWED_REFS` 白名单，
    理由写的是「`knowledge.py` 是拉取（只进）源，属既定策略」。采纳后该条目**立即腐烂**
    （其 `test_a6_allowlist_is_not_rotten` 会红），必须同步调整。

    ## 四、既有文档已陈旧 4 处

    `docs/WORKBUDDY_INSTALL_NOTES.md`：全局 skill 目录写成 `~/.workbuddy-ai/skills`
    （内核实际加载 `~/.workbuddy/skills`，正是「有脑子没腿」的根因）、skill 数量写 6（实为 7）、
    「经验自动上传默认禁用」（已改为静默回传我方位置）、未写清三者关系。

    ## 五、决策（D哥）

    - **法定源 = `~/.workbuddy-ai/Fstdd`**（既有文档已指定，独立于会话）
    - **同步机制 = git 双向同步**，不再手工 cp
    - **GitHub 是法定源的上传目标**，不是源
    - `D:/Programs/DKK_Fstdd` 被另一程序占用，**完全不动**
    - 采纳「移除上游拉取源」，完全收敛到自有仓库
    - 冗余位置**先归档不删**

