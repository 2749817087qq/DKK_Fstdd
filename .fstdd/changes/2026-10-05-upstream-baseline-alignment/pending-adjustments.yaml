# pending-adjustments.yaml — 设计偏离记录（Phase 3 BUILD）
# change: 2026-10-05-upstream-baseline-alignment
# 均为「小偏离」（不改变对外接口与行为语义），按 B4 记录后继续。
# 大的偏离会另记并汇总进 design-adjustments；本 change 暂无。

adjustments:
  - id: "ADJ-001"
    type: small
    origin: "design.md 决策 5（改动边界：只动活体声明面 + 新增 docs/UPSTREAM_BASELINE.md）"
    original: "改动边界未含 `tools/verify_eol.py`"
    actual: "在 `verify_eol.py: ALLOWED_DIFF_EXACT` 增补精确项 `NOTICE.md`（附原因注释）"
    reason: |
      `verify_eol` 的 TC-EOL-005（索引零内容变更）以 `ALLOWED_DIFF_PREFIX=("tools/","docs/","skills/")`
      + `ALLOWED_DIFF_EXACT={"README.md",".gitignore"}` 判定「行尾治理是否引入非预期变更」。
      根级 `NOTICE.md` 已在决策 1/5 的必改清单内，但既不在前缀内、也不在精确项内，
      其 diff 会被判为「非预期变更」→ TC-EOL-005 假失败。
    impact: |
      仅扩展该脚本自带的允许清单扩展位（脚本注释即为「精确文件项用于无法用前缀表达的散落文件，
      新增时必须注明原因」）；不影响其它文件的判定语义，不改任何 TC 的判据。
      影响面：`tools/verify_eol.py` 单文件。
    evidence: "tools/verify_eol.py:43（带原因注释）；改后 verify_eol 7/7"
    out_of_scope_note: |
      属门禁相容性必要改动（非本 change 需求）。已核全仓无任何测试钉住 `ALLOWED_DIFF_EXACT` 内容
      （grep 仅命中 verify_eol.py 自身 + 1 处归档 test-report 的引用），故不破坏既有门禁。

  - id: "ADJ-002"
    type: small
    origin: "design.md 约束「全量 pytest upstream/tests 须保持 0 failed」"
    original: "新增测试文件落盘后处于 untracked（`??`）状态"
    actual: "将 4 个新产物 `git add` 进暂存区（`A ` 状态）：docs/UPSTREAM_BASELINE.md + 3 个 tests/test_*.py"
    reason: |
      上游自带门禁 `upstream/tests/test_repo_home.py::test_a6_no_stray_untracked_files` 要求
      「除 `.fstdd/changes/` 下的在办 change 外不得有 untracked 项」。BUILD 阶段新文件尚未提交，
      若不暂存则被判为「遗留垃圾」而 FAIL（实测 1 failed）。
    impact: "仅索引状态；不改变文件内容、不改任何判据、不改工作区文件"
    evidence: "暂存前 test_repo_home 1 failed；暂存后 16 passed / 3 skipped"

  - id: "ADJ-003"
    type: small
    origin: "build.md C5（经验库自动记录/更新）与 design.md 约束「四自检全绿」的相容性"
    original: "改动边界未含 `tools/verify_eol.py: ALLOWED_DIFF_PREFIX`；C5 需在 BUILD 期更新既有经验条目"
    actual: "在 `verify_eol.py: ALLOWED_DIFF_PREFIX` 增补前缀 `.fstdd/experiences/`（附原因注释）"
    reason: |
      C5 要求把本次失败模式检查中复现的既有经验（EXP-2026-0016 / EXP-2026-0015）回填证据、
      递增 occurrences，而这些条目是**已跟踪文件**。`verify_eol` TC-EOL-005 的允许面为
      `("tools/","docs/","skills/")` + `{"README.md",".gitignore","NOTICE.md"}`，不含 `.fstdd/experiences/`
      → 经验更新被判为「非预期变更」→ TC-EOL-005 假失败（实测 6/7）。
    impact: |
      仅扩展允许前缀（与 tools/ 同类：正常开发活动产物）；不改任何 TC 判据、不影响其它文件判定语义。
      影响面：`tools/verify_eol.py` 单文件。
    evidence: "改后 verify_eol 7/7（原 6/7，唯一 FAIL 为 .fstdd/experiences/EXP-2026-0015.md / -0016.md）"
    out_of_scope_note: |
      属门禁相容性必要改动（非本 change 需求）。已 grep 全仓确认无任何测试钉住
      `ALLOWED_DIFF_PREFIX` / `ALLOWED_DIFF_EXACT` 内容（仅命中 verify_eol.py 自身），故不破坏既有门禁。