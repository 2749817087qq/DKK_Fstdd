meta:
  change_id: "2026-09-25-guard-phase-path-scope"
  title: "Guard 相位门增加路径作用域：消除 ACTIVE_CHANGE 只读相位导致的全项目冻结"
  created: "2026-09-25T02:25:35+00:00"
  status: draft
  version: "2.9"

why:
  problem: |
    STDD Guard 的相位门是全项目粒度：当 ACTIVE_CHANGE 指向处于 understand/spec
    相位的 change 时，该工作区内一切 Edit/Write（包括与该 change 无关的文件、
    agent 自身 memory 日志）全部被拦截（exit 2）。这导致「ACTIVE_CHANGE 漂移
    = 阶段劫持」：一个停在只读相位的 change 会冻结整个工作区的其它工作。
  evidence:
    observed_at: "2026-09-25T10:20:00+08:00"
    observed_base_git_sha: "df3b27c"
    details: |
      ① D哥 2026-09-25 实测：csrc-filing change 会话中，追加 memory 日志
      被 Edit 工具拦截，只能走 Bash 追加。
      ② 代码确认（upstream/fstdd/cli/commands/guard.py）：:717 找到 active
      change 后，:735 仅放行该 change 的 YAML-first 流程产物；:744-756 仅当
      phase ∈ EDITABLE_PHASES 放行；否则 :803-814 无条件 return 2 ——
      判定全程不看目标文件路径，相位门为全项目粒度。
      ③ 反例约束：.workbuddy-ai/ 豁免（:711）先于相位门，memory 日志本应
      放行；D哥 实测被拦疑因该工作区运行旧修订 guard.py（本机存在
      40,082 B、无 _AGENT_RUNTIME_DIRS 的旧副本），需在本 change 中一并排查。
      ④ 既有记录：skill fstdd-guard-cwd-fix「场景 E」（2026-09-25 新增）。

what_changes:
  - description: "相位门增加路径作用域：非可编辑相位时，只拦截 change 声明范围（scope）内的文件；范围外文件降级为警告（warn-only）或直接放行。"
  - description: "明确 change scope 的声明来源（proposal what_changes / tasks.md 文件清单 / change 目录本身），无声明时的默认行为需定义（建议维持现状全拦，避免静默放开）。"
  - description: "排查并消除本机旧修订 guard.py 副本（patchtest、FSTDD004 内嵌仓等 40,082 B 无豁免逻辑版本）导致的豁免面不一致。"
  - description: "补充回归测试：只读相位 + 范围外文件编辑 ⇒ 放行/警告；范围内文件 ⇒ 拦截；GATE token / .fstdd.yaml 硬阻断在两种情形下均不受影响。"

capabilities:
  new:
    - name: "phase-gate-path-scope"
      description: "相位门按 change 声明的文件作用域判定拦截范围，非全局"
  modified:
