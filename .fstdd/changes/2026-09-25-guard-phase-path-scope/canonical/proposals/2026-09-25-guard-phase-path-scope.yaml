      description: "cmd_guard_check 的相位判定从全项目粒度改为作用域粒度；两道硬阻断（GATE token / .fstdd.yaml 确认字段）保持全项目粒度不变"

success_criteria:
  - "只读相位下，编辑 change 作用域外的项目文件不再被拦截（或有明确 warn-only 输出）"
  - "只读相位下，编辑 change 作用域内的文件仍被拦截（exit 2）"
  - "GATE token 写入、.fstdd.yaml 确认字段篡改在任何相位、任何路径下仍被硬阻断（exit 2）"
  - "既有 pytest tests/commands/test_guard.py 与 tests/test_guard_silent_except.py 全绿，新增作用域用例覆盖上述三类情形"
  - "YAML-first 流程产物放行（:735）行为不变"

# 作用域声明（本 change 即自举样本）：只读相位下，仅这些路径的编辑被相位门拦截；
# 范围外文件 warn-only 放行。缺省无本块时维持既有全局冻结行为（fail-closed）。
scope:
  mode: strict
  paths:
    - "upstream/fstdd/cli/commands/guard.py"
    - "upstream/fstdd/cli/__init__.py"
    - "upstream/tests/commands/test_guard.py"
    - "upstream/tests/test_guard_silent_except.py"
    - "tools/audit_silent_except.py"
    - "CHANGELOG.md"
    - "README.md"

