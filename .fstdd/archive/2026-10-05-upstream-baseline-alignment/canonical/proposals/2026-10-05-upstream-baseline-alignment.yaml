why:
  problem: |
    本仓库自我定位为「上游 leonai42/stdd（MIT）的 WorkBuddy 适配层与金融扩展」，
    但「上游版本」这一口径在本仓**自相矛盾**，且缺少可核验的基线快照证据：
    1) 对外声明把两个不同对象混为一谈 —— ①外部上游项目的**最新发布**（= v3.0.5）；
       ②本仓 vendored 内核 `upstream/` 的**实际版本**（= 3.1.0，含本仓衍生改动）。
       NOTICE.md §1 表格写「版本 V3.0.5（master 分支）」，而同一节注记又写
       「上游版本号见 upstream/pyproject.toml（3.0.5）」—— 该文件现为 3.1.0，
       同一节内互相打架，读者无法判定哪个是真。
    2) 适配层脚本 tools/install_workbuddy_skills.py 把 `version: "3.0.5"` /
       `stdd_version: "3.0.5"` 与来源横幅「来自开源项目 FSTDD … V3.0.5」**硬编码**，
       而同一脚本已能读到本仓真实发行版号（REPO_VERSION = 3.3.4）——
       生成的 skill 因此同时携带两个互相矛盾的版本号。
    3) 缺少固化的上游基线快照：每次「有没有新版本」都要重新联网探针，且无从判断
       「基线是否已变」。唯一仍在活跃的上游资产 leonai42/stdd-experiences 也从未被
       纳入对标栅格。
    结果：任何外部读者或协作节点按 NOTICE / README / skill 判断「本仓处于哪个版本」，
    都会得到错误或矛盾答案。
  motivation: |
    D哥 2026-10-05 指令：对上游做一次基线对标（「上游早就有新版本了吧，我们和新版本
    做个对标比较」）。实测上游自 2026-08-17 起未再发布新版本（见 evidence），
    故本次价值不在「追版」，而在于三件事：
    ① 把「上游基线快照」固化为可核验证据，避免日后反复探针；
    ② 消除本仓版本口径漂移，让对外声明自洽；
    ③ 把唯一仍在活跃的上游资产 leonai42/stdd-experiences 纳入对标栅格，
       确认我方经验回传链路的边界（我方回传是否、以及应当流向何处）。
  evidence:
    observed_at: "2026-10-05T11:20:00+08:00"
    observed_base_git_sha: "1046f5eaffa4f4c80b533ca2d24700fd7b0a46f2"
    details: |
      1) 上游基线探针（本机不可直连 github.com:443，经服务器 ssh fstdd-hub 出网）：
         - leonai42/stdd 最新 tag = v3.0.5；master HEAD sha =
           b9a4af62b5f4fd2747884c0a61febbc341792ac2（与 v3.0.5 tag 同一提交）；
           pushed_at = 2026-08-17T15:25:43Z；Releases = 空数组；仅 master 一个分支；
           11★ / 3 fork；未归档。
         - 其他通道排除：Gitee leonai42/stdd = 404；PyPI `stdd` = 200 但为 LiiraGH
           的 PyQt6 模板包（同名无关）；PyPI `fstdd` = 404。
         - 唯一活跃上游资产：leonai42/stdd-experiences，pushed_at =
           2026-10-05T00:31:25Z（当天仍在推）。
      2) 本仓版本口径实测：
         - upstream/pyproject.toml version = 3.1.0；upstream/CHANGELOG.md 有
           V3.1.0（2026-09-26，change 隔离形态）条目。
         - .fstdd/version.yaml：fstdd_version = 3.3.4，upstream_version = 3.1.0；
           .fstdd/config.d/project.yaml stdd_version = 3.3.4。
         - 漂移点定位（实测行号）：NOTICE.md:15「V3.0.5（master 分支）」、
           NOTICE.md:33「upstream/pyproject.toml（3.0.5）」与实际 3.1.0 矛盾、
           README.md:5 徽章（改名前标识 + v3.0.5）、skills/fstdd-fin/SKILL.md:10
           `stdd_version: "3.0.5-fin.2"` 与 :17 sources 行、
           docs/WORKBUDDY_INSTALL_NOTES.md:5 与 :89、
           tools/install_workbuddy_skills.py:304-305（version / stdd_version）
           与 :377（来源横幅）。
      3) 经验库对标（本仓现状，需以本次实测固定）：
         - README.md §6 明确「上游 experience share 子命令在本仓库已永久移除」，
           回传目标锁定 2749817087qq/Fstdd-experiences
           （tools/share_experience.py DEFAULT_EXP_REPO）。
         - 故 leonai42/stdd-experiences 并非我方回传目标；需以只读清单核对
           「其中是否含我方 node 前缀条目（FSTDD003 / FSTDD-003 等）」。

