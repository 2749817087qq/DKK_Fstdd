meta:
  change_id: "2026-10-03-finance-failure-modes"
  title: "追加 8 类金融特有失败模式到 BUILD C4 检查清单"
  created: "2026-10-03T09:30:00+08:00"
  status: draft

why:
  problem: |
    FSTDD V3.0.10 BUILD Phase C4 失败模式检查清单有 14 类通用模式，但零金融特有条目。
    上一个 change (2026-10-03-finance-integration) 在 understand/build skill 里加了
    金融钩子（7 红线 + 10 维测试），但 BUILD 阶段全量失败模式检查仍只覆盖通用问题
    （幻觉/范围蔓延/凭证泄露等），不覆盖金融特有的"重复扣款""账实不符""精度丢失"
    等 8 类场景。金融项目到 BUILD 质量验证环节 = 金融失败模式裸奔。
  motivation: |
    fstdd-fin SKILL.md 已定义 8 类金融特有失败模式 + 4 主线自查（资金流/交易撮合/
    风险合规/技术底座），但这些知识封在独立 SKILL.md 里，不进入通用 BUILD C4
    检查清单。追加后，只要金融项目走到 BUILD 阶段，Agent 就必须逐项检查这 8 类，
    和 14 类通用模式一样是强制勾选项。
  evidence:
    observed_at: "2026-10-03T09:15:00+08:00"
    observed_base_git_sha: "HEAD（当前工作区，build.md L317-332）"
    details: |
      实测 .fstdd/skills/build.md C4 section L317-332 = 14 类通用模式（Markdown table）
      零金融条目。fstdd-fin SKILL.md L120-165 定义了 8 类金融失败模式。
      两者之间无引用关系。

what_changes:
  - id: C1
    description: ".fstdd/skills/build.md C4 section 14 类清单后面追加 8 类金融特有模式（同一 Markdown table）"
    type: modified
  - id: C2
    description: "每类金融模式标注覆盖方式（skill 引导 / 金融红线联动）+ BUILD 检查动作（具体可执行步骤）"
    type: modified

capabilities:
  new:
    - name: finance-failure-modes-c4
      description: "BUILD C4 失败模式检查清单新增 8 类金融特有模式，与 14 类通用模式同等强制勾选"
  modified:
    - name: build-quality-verification
      description: "BUILD Phase C4 检查清单从 14 类扩展到 22 类（14 通用 + 8 金融）"

constraints:
  - "追加不破坏现有 14 类条目，一字不改原有 table 行"
  - "8 类金融模式的覆盖方式列保持与通用模式一致的 3 种取值: skill 引导 / 三層 / Guard"
  - "BUILD 检查动作列必须具体可执行，不能只写审查代码"

stakeholders:
  - FSTDD003（实施者）
  - FinFSTDD 使用者（金融系统 BUILD 阶段受益）

risk_areas:
  - capability: finance-failure-modes-c4
    risk: "金融项目 BUILD 阶段 Agent 漏勾选 → 静默通过"
    mitigation: "每类金融模式的检查动作必须具体（如'审查所有扣款接口有幂等 key'），模糊条目容易被跳过"
  - capability: build-quality-verification
    risk: "Markdown table 追加时破坏对齐或列数不匹配 → 渲染错乱"
    mitigation: "保持 4 列（# | 失败模式 | 覆盖方式 | BUILD 检查动作），用 diff 验证 table 结构不变"

non_goals:
  - 不修改 upstream/ 内核（本地 .fstdd/skills/build.md 是项目侧运行时文件，不是 upstream 模板）
  - 不重写 fstdd-fin SKILL.md 里的 8 类金融模式描述（只是把它们追加到 C4 清单里）
  - 不改 CLI 任何逻辑（纯文档追加）
  - 不改 quality.yaml（已经在上一个 change 确认本仓无 failure_modes section）

critical:
  is_critical: false
  risk_assessment:
    safety_critical: true
    financial: true
    cross_system: false

anchoring:
  level: L2
  reference_changes: ["2026-10-03-finance-integration"]
  anchor_implementations: []

success_criteria:
  - ".fstdd/skills/build.md C4 section 包含 22 行 table（14 通用 + 8 金融）"
  - "8 类金融模式每类有：编号 15-22、中文失败模式名、覆盖方式、具体 BUILD 检查动作"
  - "原有 14 类条目一字不改（sha256 对比前 14 行一致）"
  - "Markdown table 渲染正确（4 列对齐）"
  - "fstdd validate 通过"
