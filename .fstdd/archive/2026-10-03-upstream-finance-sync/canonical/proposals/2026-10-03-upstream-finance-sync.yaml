    risk: "upstream 后续 upstream 升级覆盖本次改动"
    mitigation: "同步前 git branch/merge 显式记录；install_workbuddy_skills.py 重新生成本机 skill 时不会回退（从 upstream 读）"
  - capability: upstream-build-c4-checklist
    risk: "22 行 table 格式破坏 upstream 原有 Markdown 渲染"
    mitigation: "直接复用本地已验证格式；4 列对齐保持一致"

non_goals:
