meta:
  capability: audit-baseline
  change_id: 2026-10-10-p0-pre-audit-baseline
  created: '2026-10-10T12:14:43+00:00'
  confidence: high
requirements:
- id: REQ-001
  description: 只读量化经验库元数据失真，产出修复前基线
  scenarios:
  - id: SC-001
    given: 三段式真实 inbox 文件（注释+导出块+注释+真身块+正文）
    when: 提取 frontmatter 块
    then: SHALL 识别全部块；真身块 SHALL = 含 experience_id 键的最后一个块（C-1 锚定）
  - id: SC-002
    given: 任一经验条目文件
    when: 计算 missing_current
    then: SHALL 以「第一个 frontmatter 块」的键集合比对 experience_id/category/severity，与 experience.py:428 行为一致
  - id: SC-003
    given: 各类型文件
    when: 结构分类
    then: SHALL 分类为 single_block / dual_block_import / exported_block_only / multi_block_N / no_frontmatter
  - id: SC-004
    given: 真身块存在 experience_id
    when: 与文件名 stem 比对
    then: 不一致时 SHALL 计入 summary.eid_mismatch.files[]，该文件记录 eid_match=false
  - id: SC-005
    given: .experience-index.yaml 存在
    when: 以真身块 eid 对账（非文件名）
    then: SHALL 输出 indexed_true / indexed_false_files / eid 不在索引中的文件清单；无 eid 的文件 SHALL 归入 unreconciled_files（不得静默排除）
  - id: SC-006
    given: 审计完成
    when: 读取 summary
    then: SHALL 同时输出 category_distribution_current_parser 与 category_distribution_true 两组分布
  - id: SC-007
    given: 任意运行
    when: 审计执行
    then: SHALL 全程不写入仓库任何文件；退出码 0=完成 / 2=--repo 无效或 experiences 目录不存在
implementation_notes:
- SC-005 的 unreconciled_files 为 2026-10-10 落盘后修复（评审 F-002 残留子项）：原实现仅统计 in_index True/False 两桶，no_frontmatter 记录缺该键 ⇒ 被静默排除
- 'load_index_keys 已按真实索引形态（by_category 下裸列表项，含 FSTDD005- 前缀）修复，兼容旧的 experience_id: 形态'
