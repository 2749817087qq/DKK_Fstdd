  - "verify_workbuddy_skills.py exit code 0"
  - "installed fstdd-build SKILL.md 包含 22 行 C4 table（确认 upstream 变更同步）"
  - "installed fstdd-understand SKILL.md 包含 Step 0.5 金融钩子（确认 upstream 变更同步）"
