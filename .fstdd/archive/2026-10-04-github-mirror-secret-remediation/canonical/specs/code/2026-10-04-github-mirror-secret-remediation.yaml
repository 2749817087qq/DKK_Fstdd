# spec.yaml — 行为规格（Canonical YAML，AI 主读文档）
# change: 2026-10-04-github-mirror-secret-remediation
# capability: github-mirror-secret-remediation（REQ-001..006 / SC-001..008）
# 说明：仓库侧证据链。外部动作（unblock/rotate/私钥撤销/重推/Release 补发）不在此规格内，
#       见 design.md 决策 1 与 proposal.yaml non_goals。

meta:
  capability: "github-mirror-secret-remediation"
  change_id: "2026-10-04-github-mirror-secret-remediation"
  created: "2026-10-03T17:40:00+00:00"
  confidence: high

requirements:
  - id: "REQ-001"
    capability: "github-mirror-secret-remediation"
    description: |
      触发脚本 `tools/rotate_github_token.sh` SHALL 不含任何可被判为 PAT 形态的字面量；
      其 PAT 前缀校验语义 SHALL 保持不变。

    scenarios:
      - id: "SC-001"
        confidence: high
        evidence: "proposal.yaml what_changes C1；test_rotate_script_has_no_pat_literal"
        given: "脚本第 40 行原为「示例: $0 ghp_ + 34 个 x」形态占位"
        when: "以凭证形态正则扫描该脚本全文"
        then: "SHALL 使 ghp_ 前缀 + ≥20 连续字母数字 的字面量命中数为 0"
        and:
          - "示例行 SHALL 明确标注为占位（如 `ghp_<YOUR_PAT>`），不得形如真实 token"
          - "参数校验正则 `^ghp_[A-Za-z0-9]{36}$` SHALL 保持不变（正则字面量不构成 PAT 形态）"

  - id: "REQ-002"
    capability: "github-mirror-secret-remediation"
    description: |
      本仓 SHALL 设有一道可执行门禁，使「任何 tracked 文件含高置信凭证形态字面量」
      在发布门禁内不可通过，且该门禁 SHALL 被全量 `pytest upstream/tests` 自动收集。

    scenarios:
      - id: "SC-002"
        confidence: high
        evidence: "proposal.yaml what_changes C2；test_no_plaintext_credentials_in_tracked_files"
        given: "门禁测试置于 upstream/tests/test_no_plaintext_credentials.py"
        when: "执行全量 `python -m pytest upstream/tests -q`"
        then: "SHALL 收集并执行该门禁，且结果为通过（0 failed）"
        and:
          - "门禁 SHALL 以 `git grep -nIE` 扫描全部 tracked 文件"
          - "门禁 SHALL 只读，不写任何文件"

      - id: "SC-003"
        confidence: high
        evidence: "proposal.yaml success_criteria；git grep 实测"
        given: "fixture 去形态化（C3）与孤儿私钥撤销（C5）均已落地"
        when: "对全部 tracked 文件执行高置信凭证形态扫描"
        then: "SHALL 使 ghp_/github_pat_/sk-/AKIA/私钥头 五类形态命中数均为 0"
        and:
          - "SHALL 不依赖任何白名单/豁免清单"
          - "门禁 SHALL 覆盖 `.fstdd/`、`tools/`、`upstream/`、`tests/` 全域 tracked 文件"

      - id: "SC-004"
        confidence: high
        evidence: "proposal.yaml what_changes C2；test_scan_detects_injected_pat / test_scan_ignores_regex_literals"
        given: "构造两段样本文本：一段含 ghp_ 前缀 + 30 位、一段只含正则字面量 `ghp_[A-Za-z0-9]{20,}`"
        when: "分别送入纯函数 scan_text_for_credentials()"
        then: "SHALL 对前者报出命中，对后者不报命中"
        and:
          - "SHALL 使门禁具备可判定的正/负样本，避免「恒真」假门禁"
          - "命中结果 SHALL 含行号，便于定位"

  - id: "REQ-003"
    capability: "github-mirror-secret-remediation"
    description: |
      为使门禁保持零白名单，既有合法测试夹具 SHALL 去形态化，且其运行值与断言语义
      SHALL 保持不变。

    scenarios:
      - id: "SC-005"
        confidence: high
        evidence: "proposal.yaml what_changes C3；tests/test_share_publish_sanitize.py 与 upstream/tests/test_inbox_endpoint.py"
        given: "两处 fixture 原以连续字面量嵌入 ghp_/github_pat_/sk- 与 PEM 私钥头"
        when: "改为运行时字符串拼接构造后执行原用例"
        then: "SHALL 使原断言全部通过（脱敏替换 / 端点 422 拒收语义不变）"
        and:
          - "拼接后的运行值 SHALL 与去形态化前逐字节相同"
          - "SHALL 不新增/删除任何用例，只改字面量构造方式"

  - id: "REQ-004"
    capability: "github-mirror-secret-remediation"
    description: |
      镜像故障处置手册 SHALL 覆盖「GitHub push protection / secret scanning 拦截」这一类
      非网络类失败，并给出可执行的解除路径。

    scenarios:
      - id: "SC-006"
        confidence: high
        evidence: "proposal.yaml what_changes C4；test_mirror_runbook_present"
        given: "docs/DISTRIBUTED_ACCESS.md §五「故障处置」原表未覆盖 secret scanning 类"
        when: "检索该文件的 §五 处置表"
        then: "SHALL 含一行同时指向 push protection 诊断、一次性 unblock 链接与凭证轮换命令"
        and:
          - "SHALL 区别于「GitHub 不可达」行，明确其非网络性质"
          - "SHALL 指明恢复验证手段（tools/check_mirror.sh）与 Release 补发"

  - id: "REQ-005"
    capability: "github-mirror-secret-remediation"
    description: |
      孤儿私钥文件 SHALL 从版本库撤销跟踪，且 SHALL 被 .gitignore 覆盖，使同类私钥
      无法再被误提交。

    scenarios:
      - id: "SC-007"
        confidence: high
        evidence: "proposal.yaml what_changes C5；git ls-files + grep .gitignore"
        given: ".fstdd/_fstdd003_key_new.txt 为 tracked 的 OPENSSH 私钥且全仓零引用"
        when: "执行 `git rm --cached` 并在 .gitignore 补入该路径后检查"
        then: "SHALL 使 `git ls-files` 不再包含该文件"
        and:
          - ".gitignore SHALL 在「SSH 私钥绝不入库」段含该路径"
          - "磁盘文件 SHALL 保留（不删除数据）"

  - id: "REQ-006"
    capability: "github-mirror-secret-remediation"
    description: |
      本变更 SHALL 不破坏既有基线：全量测试 0 failed，四个自检脚本全绿。

    scenarios:
      - id: "SC-008"
        confidence: high
        evidence: "proposal.yaml success_criteria；《发布与文档规程》§三"
        given: "C1..C5 全部落地"
        when: "执行全量 pytest 与四个自检脚本"
        then: "SHALL 得到 `pytest upstream/tests -q` 0 failed 与四个自检脚本全绿"
        and:
          - "SHALL 不新增 skip 以掩盖失败"
          - "基线失败数 SHALL 保持为 0"