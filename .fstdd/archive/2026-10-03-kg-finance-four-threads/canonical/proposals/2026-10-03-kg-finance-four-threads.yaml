meta:
  change_id: "2026-10-03-kg-finance-four-threads"
  title: "knowledge-graph 注册金融四条主线 + 8 类金融失败模式节点"
  created: "2026-10-03T10:20:00+08:00"
  status: draft

why:
  problem: |
    知识图谱 knowledge-graph.yaml 有 2912 行，目前只有 process_deviation 等少数
    failure_pattern 节点，零金融领域节点。fstdd-fin SKILL.md 定义了四条主线
    （资金流/交易撮合/风险合规/技术底座）+ 8 类金融特有失败模式，
    这些知识没有进入跨项目知识图谱。金融项目 Agent 跨 Session / 跨项目
    调用 fstdd knowledge merge 时，拿不到金融领域的历史经验。
  motivation: |
    注册后：
    (1) 四条主线成为 KG 的 category 节点（type: domain_thread）
    (2) 8 类金融失败模式成为 failure_pattern 节点（type: failure_pattern, severity: high）
    (3) 金融项目跑 knowledge predict 时能拿到金融领域风险预警
  evidence:
    observed_at: "2026-10-03T10:15:00+08:00"
    observed_base_git_sha: "HEAD"
    details: |
      knowledge-graph.yaml 位置: .fstdd/knowledge/knowledge-graph.yaml (L2912)
      现有 failure_pattern: 约 10 个 (process_deviation 等, severity medium)
      零 finance 节点

what_changes:
  - id: C1
    description: "knowledge-graph.yaml nodes section 追加 4 条金融主线 domain_thread 节点"
    type: modified
  - id: C2
    description: "knowledge-graph.yaml nodes section 追加 8 类金融失败模式 failure_pattern 节点 (severity: high)"
    type: modified
  - id: C3
    description: "更新 last_merged 时间戳 + graph_version (从 1.0 升到 1.1)"
    type: modified

capabilities:
  new:
    - name: kg-finance-domain-nodes
      description: "知识图谱包含金融领域 domain_thread + 8 类金融 failure_pattern 节点"

constraints:
  - "只追加节点，不修改现有节点"
  - "节点 schema 与现有节点对齐 (id/type/category/severity/tags/projects/root_cause)"
  - "8 类金融失败模式 severity=high (金融失败后果严重)"
  - "四条主线 category=domain_thread, type=domain"

stakeholders:
  - FSTDD003（实施者）
  - FinFSTDD 使用者（知识图谱金融节点可预测风险）

risk_areas:
  - capability: kg-finance-domain-nodes
    risk: "knowledge merge 覆盖手工追加的节点"
    mitigation: "节点追加放在文件末尾；knowledge merge 使用 merge_strategy=append 不覆盖"

non_goals:
  - 不改经验库 .fstdd/experiences/（与 knowledge-graph 是两套机制）
  - 不加 edges（四条主线和失败模式的关联留给后续迭代，先用 tags 关联）
  - 不改 upstream

critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: true
    cross_system: false

anchoring:
  level: L1

success_criteria:
  - "knowledge-graph.yaml nodes section 追加 4 个 domain_thread 节点 (threads_001-004)"
  - "knowledge-graph.yaml nodes section 追加 8 个 failure_pattern 节点 (fin_fail_001-008)"
  - "graph_version 1.0 → 1.1, last_merged 更新"
  - "YAML 合法（yaml.safe_load 不报错）"
  - "原有节点一字不变"
