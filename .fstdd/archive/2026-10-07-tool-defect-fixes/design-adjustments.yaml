carried_as_debt:
  - id: ADJ-002
    title: "`upstream/fstdd/` 下 70 处 `write_text` 未传 `newline=` ⇒ Windows 上写 CRLF"
    capability: experience-io-contract
    why_carried: "D2 经 D哥 确认只覆盖经验库索引；70 处属同族但独立的治理项，需逐处评估该文件是否允许 CRLF。"
    impact: "每次 `canon generate` 都会产出 CRLF 的 proposal.md / caveman_summary.txt（BUILD 期间已活体复现并手工归一）。"
    follow_up: "另立 change；可复用 `tests/test_experience_io_contract.py` 的「写盘后断言无 CRLF」模式。"

  - id: ADJ-003
    title: "`fstdd experience list`（读命令）会重写索引文件"
    capability: "dry-run-fidelity + experience-io-contract"
    why_carried: "「dry-run 不被尊重」与「读命令有写副作用」是两个缺陷；按 dry-run 屏蔽 list 会连只读功能一起屏蔽（更糟）。"
    impact: "跑一次 `experience list` 即把仓库内索引从 LF 改成 CRLF（本 change 期间已复现并 `git checkout` 还原）。"
    follow_up: "另立 change：让 `list` 走只读索引路径，或仅在索引陈旧时才重建。"

  - id: ADJ-005
    title: "渲染器仍不输出 `## Constraints` / `## Stakeholders` / `## Risk Areas` / `## NonGoals` / `## Critical` / `## Risk Assessment` / `## Anchoring`"
    capability: proposal-extraction-fidelity
    why_carried: "冻结的 SC-008/009/010 只要求 Capabilities 与 Impact 两条轴；其余 7 段属 `docs/RUN_ISSUES_2026-09-17_reits-writer.md` 早已记录、范围更大的「生成器 vs 模板」欠账。"
    impact: |
      实测本 change 自身：`capabilities.modified=5`、`impact.code=6` ✅，但
      `constraints=0 / stakeholders=0 / risk_areas=0 / non_goals=0` ❌。
      **连带**：`ci check-failures` 的 (b) 范围蔓延检查因此恒被 SKIP
      （它靠 proposal.md 里的 `- capability: <name>` 行取数据，而该行只出现在 Risk Areas 段）。
    follow_up: "另立 change；可直接复用本 change 建立的 `_proposal_anchors` 单一事实源收口模式。"

  - id: ADJ-001
    title: "dry-run 实现范围从 1 个模块扩大为 15 个模块 / 78 个写点"
    capability: dry-run-fidelity
    why_carried: "范围扩大本身**已经 D哥 在 BUILD 期间明确裁定（选项 B：全量补齐）**，故不算未决偏离；此处保留为「执行面记录」。"
    impact: "新增 `_dryrun.py` 统一守卫 + 修改 15 个命令模块；接口不变。"
    follow_up: "无需跟进（已授权）。"

