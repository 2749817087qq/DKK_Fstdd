  - id: ADJ-001
    original_design_ref: "design.md → D1 / specs/code/dry-run-fidelity.yaml → SC-001（原文把违规面描述为「`phase.py` 是唯一违规者」）"
    actual_change: |
      **实现范围大幅扩大**：`--dry-run` 被静默忽略的模块**不是 1 个而是 15 个**
      （收紧正则后 78 个写点）：`baseline` `batch` `bootcamp` `canon` `caveman` `curate`
      `experience` `gate` `hooks` `index` `knowledge` `phase` `skill` `state` `work`。
      处置：新建统一守卫 `upstream/fstdd/cli/commands/_dryrun.py`
      （`dry_run_guard` 装饰器 + `dry_run_preview` 早返回），为 15 个模块的写命令逐一接入；
      `phase` 因需给出更具体的预览（`from → to`）而在模块内自行实现。
    reason: |
      **实测证据**（`observed_at=2026-10-06T18:4x+00:00`, `source=@0710d54`）：
      Phase 1 的「`phase` 是唯一违规者」结论**只对当时抽查的 9 个模块成立**，不是全量。
      按 D1 的契约扫描器全量扫描后：有写操作且处理 dry_run 的 10 个 / 未处理的 **15 个**。
      ⚠️ **D哥 在 BUILD 期间明确裁定「B：本 change 全量补齐 16 模块」** ⇒ 本偏离为**经用户授权**的范围扩大。
      （裁定当时按 16 个模块报数；收紧正则后 `extract_proposal.py` 被排除，实为 15 个，见 ADJ-004。）
    impact_scope: "capability dry-run-fidelity；新增 1 个模块 `_dryrun.py` + 修改 15 个命令模块；接口不变"
    severity: major
    affected_capabilities:
      - "dry-run-fidelity"
    exp_id: "EXP-2026-0020"
    resolved: false

  - id: ADJ-002
    original_design_ref: "design.md → D2（`_save_index()` 补 `newline=\"\"`）/ specs/code/experience-io-contract.yaml → SC-004"
    actual_change: |
      **发现同族但范围大得多的问题，本 change 不修、记为已知欠账**：
      `upstream/fstdd/` 下 `write_text` 调用共 **72 处，其中 70 处未传 `newline=`**
      ⇒ 在 Windows 上都会写出 CRLF，与 `.gitattributes` 的 `eol=lf` 冲突
      （`phase.py` 写 `.fstdd.yaml` 时实测产出 CRLF，见 TC-DRY-001 的 RED 断言）。
    reason: |
      D2 的范围经 D哥 确认只覆盖「经验库索引」（缺陷 2 的原义）。
      70 处 `write_text` 的 EOL 归一属于**同族但独立**的治理项，涉及面广、需逐处评估
      「该文件是否本就允许 CRLF」（如某些外部工具消费的文件），不宜在本次顺带改。
      ⇒ 建议另立 change 处理（可复用本 change 在 `tests/test_experience_io_contract.py`
      中建立的「写盘后断言无 CRLF」测试模式）。
    reason_extra: |
      **BUILD 期间活体复现（2026-10-07）**：执行 `fstdd canon generate 2026-10-07-tool-defect-fixes`
      重渲染本 change 的 `proposal.md`（Task 3.6）后实测 —— `proposal.md` CRLF=100 / `caveman_summary.txt`
      CRLF=9（源 `canon.py` 的 `output_file.write_text(..., encoding="utf-8")` 即上述 70 处之一）。
      已手工归一为 LF。⇒ 本欠账在**每一次** `canon generate` 上都会复现，不是理论问题。
      同一 BUILD 的 C5 阶段再复现一次：`fstdd experience add` 新建的
      `EXP-2026-0023/0024/0025.md` 三个条目**均为 CRLF=30**（源为 `experience.py::_cmd_add` 的
      `exp_file.write_text(...)`，同属 70 处之一）⇒ **每一次 `experience add` 都会产出 CRLF 条目**，
      而已提交的历史条目都是 LF（`.gitattributes` 的 `text=auto eol=lf` 在 add 时归一），
      故工作树与索引之间会反复出现 CRLF 告警。已手工归一。
    impact_scope: "无代码影响；仅记录欠账。已在 test-report 已知问题中登记"
    severity: minor
    affected_capabilities:
