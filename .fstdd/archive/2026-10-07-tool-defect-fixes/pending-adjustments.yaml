  - id: ADJ-003
    original_design_ref: "specs/code/dry-run-fidelity.yaml → SC-003（有写操作的命令必须处理 dry_run）"
    actual_change: |
      **发现「读命令带写副作用」，本 change 不修、记为已知问题**：
      `fstdd experience list`（读命令）会**重写索引文件**
      `.fstdd/experiences/.experience-index.yaml`。
      实测：Phase 2 期间跑一次 `experience list` 即把仓库内该文件从 LF 改成 CRLF=322
      （已 `git checkout` 还原；本 change 的测试全部改用**临时项目**隔离，仓库零污染）。
    reason: |
      「`--dry-run` 不被尊重」与「读命令有写副作用」是**两个不同缺陷**。
      后者若按 dry-run 语义屏蔽，会连「列出经验」这一只读功能一起屏蔽掉（更糟）。
      正确修法是让 `list` 走**只读索引路径**（或仅在索引陈旧时才重建），属独立改动。
      ⇒ 记为已知问题，建议另立 change。
    impact_scope: "无代码影响；测试已用临时项目隔离，仓库不被污染"
    severity: minor
    affected_capabilities:
      - "dry-run-fidelity"
      - "experience-io-contract"
    exp_id: ""
    resolved: false

  - id: ADJ-004
    original_design_ref: "design.md → D1 的契约扫描器（「凡含写操作者必须处理 dry_run」）"
    actual_change: |
      **扫描口径收紧**：初版用 `yaml\.dump\(` 作为「写操作」特征，把
      `extract_proposal.py` 的 `print(yaml.dump(result, ...))`（输出到 **stdout**）误判为文件写，
      使违规模块数虚高为 16、写点虚高为 110。收紧后（去掉 `yaml.dump(`、保留
      `write_text` / `open(...,"w")` / `shutil.move` / `os.replace` / `mkdir` 等真写点）
      为 **15 个模块 / 78 个写点**。
    reason: |
      EXP-2026-0020（机械匹配按「方法名」而非「接收者语义」选目标）+ EXP-2026-0016
      （纯文本扫描假阳性）的同族问题：`yaml.dump` 既可写文件也可写 stdout，按名字匹配必误判。
      ⇒ 扫描器改用「接收者语义」口径，并在 `tests/test_dry_run_fidelity.py::test_tc_dry_004`
      固化「三种 dry_run 写法都要认」的自检（EXP-2026-0021）。
    impact_scope: "capability dry-run-fidelity；扫描口径与测试断言；无代码行为影响"
    severity: minor
    affected_capabilities:
      - "dry-run-fidelity"
    exp_id: "EXP-2026-0016"
