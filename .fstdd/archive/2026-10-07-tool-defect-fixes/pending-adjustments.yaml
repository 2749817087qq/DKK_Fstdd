  - id: ADJ-007
    original_design_ref: "design.md → D1（契约扫描器「凡含写操作者必须处理 dry_run」）/ D5（`ci` (d) 判据改定义点）/ specs/code/dry-run-fidelity.yaml → SC-003"
    actual_change: |
      **C1 多路并行技术评审（3 代理）报出 3 处真实缺陷，均在冻结基线范围内修复**：

      1. 🔴 **`canon verify --dry-run` 仍会落盘**（`cmd_canon_verify` 内的
         `_generate_one(...)` 在「Human View 缺 source_hash」分支无条件执行）。
         ⇒ 修：该分支加 `dry_run_requested(args)` 守卫，dry-run 下照常完成校验、
         只跳过自动重生成；并新增行为断言 `TC-DRY-003c`。
         ⚠️ **契约扫描器为何漏判**：`canon.py` 已含 `dry_run`（装饰器），静态判据是
         「模块级」的，无法识别「同模块内某一处写路径未守住」⇒ 属**扫描口径的已知上限**。
      2. 🟡 **`ci` (d) 的形态 B（TC-ID 作首列）会把「TC↔测试函数映射表」误计为定义点**
         —— 实测 `2026-09-25-guard-phase-path-scope/test-plan.md` 因此假红（1/42）。
         ⇒ 修：形态 B **只在形态 A 一个都没抽到时**才启用（不做并集），
         并新增回归自检 `TC-CCA-002d2`。
      3. 🟡 **`batch child status`（纯读）被 dry-run 误伤屏蔽** —— 初版只放行
         `action in ("list","status")`。⇒ 修：读路径白名单补 `child` + 默认子动作 `status`。
    reason: |
      三处都在**冻结的 capability 范围内**（dry-run 契约 / (d) 判据语义），不是范围扩大，
      而是「同一契约在未被抽查到的路径上仍不成立」—— 正是本 change 要修的病
      （EXP-2026-0013 / KG-093）。故按 BUILD 的「小偏离」处置：记录 + 继续，
      不暂停长程流程。
      另：评审同时报出「`TC-[A-Z]+-\d{3}` 硬编码 3 位数字」—— 项目约定
      （`.fstdd/config.d/quality.yaml` → `pattern: "TC-{CAPABILITY}-{NNN}"`）即 3 位，
      现有 43 份 test-plan 全为 3 位，**不改**（放宽会改变既有解析语义），记为已知边界。
    impact_scope: |
      capability dry-run-fidelity（+1 处写路径守卫 + 1 条行为断言）；
      capability ci-check-accuracy（形态优先级 + 1 条回归自检）；
      命令模块 batch.py（读路径白名单）；无接口变更
    severity: major
    affected_capabilities:
      - "dry-run-fidelity"
      - "ci-check-accuracy"
    exp_id: "EXP-2026-0013"
    resolved: true

