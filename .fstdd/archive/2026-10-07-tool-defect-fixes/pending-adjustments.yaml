      且避免「同一段有时在、有时不在」给下游解析器 / 人类读者带来结构不确定性
      （EXP-2026-0013：声明形态 ≠ 实际形态即为契约断层）。
      行为影响：仅多出空标题行；`_parse_capabilities` 对空段返回 `[]`，语义不变
      （`tests/test_proposal_extraction_fidelity.py::test_tc_pxf_001` 锚定）。
    impact_scope: "capability proposal-extraction-fidelity；仅渲染器输出结构；接口不变"
    severity: minor
    affected_capabilities:
