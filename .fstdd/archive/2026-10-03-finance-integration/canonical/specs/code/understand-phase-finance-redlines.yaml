        then: "understand.md SHALL 包含关键词白名单判定：支付/银行/交易/撮合/风控/KYC/AML/DeFi/结算/对账/资金/金额/Decimal/幂等/账户/余额/汇率/杠杆/保证金/清算/行情/托管/票据/债券/股票/期货/期权/私募/公募/资管/净值/回撤/夏普/贝塔/阿尔法/波动率/流动性风险/信用风险/市场风险"
