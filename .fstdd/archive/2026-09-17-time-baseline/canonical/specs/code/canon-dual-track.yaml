# spec.yaml - 行为规格（Canonical YAML）
# 修改型 capability：canon 双轨校验（DC-HASH 解耦行尾治理）
meta:
  capability: "canon-dual-track"
  change_id: "2026-09-17-time-baseline"
  created: "2026-09-17T15:28:00+00:00"
  confidence: high

requirements:
  - id: REQ-019
    description: "DC-HASH 必须基于归一后的内容计算，解除与行尾治理的耦合"
    scenarios:
      - id: SC-042
        confidence: high
        evidence: "proposal.yaml → why.evidence (7)：`canon verify` 的 `DC-HASH` 对 YAML **原始字节**做哈希（`canon.py:299`）—— 任何时间字段改动都会触发 DC-HASH 失配。且 `.gitattributes` 声明 `* text=auto eol=lf` → git 里存的是 LF"
        given: "同一份 canonical YAML 的两种行尾表示（CRLF 与 LF）"
        when: "分别计算其 DC-HASH"
        then: "两个哈希 SHALL 相同"
        and:
          - "归一函数 SHALL 与 `tools/verify_eol.py` 的 `normalize()` 同口径"
          - "归一 SHALL NOT 改变 YAML 的语义内容"
      - id: SC-043
        confidence: high
        evidence: "实测：归档 change `server-bare-repo-mirror` 记录的 DC-HASH 为 `87af3c03…`，而 LF blob 实算为 `c041bff1…` —— 差异仅来自行尾，内容一致"
        given: "canonical YAML 在 CRLF 工作区中被写入并记录 DC-HASH"
        when: "在 LF 工作区中执行 `canon verify`"
        then: "校验 SHALL 通过"
        and:
          - "SHALL NOT 报告 DC-HASH 失配"
          - "校验 SHALL 不依赖工作区的行尾状态"

  - id: REQ-020
    description: "干净克隆必须能通过双轨校验"
    scenarios:
      - id: SC-044
        confidence: high
        evidence: "success_criteria：『`canon verify` 在**干净克隆**（LF 工作区）上通过 2/2 —— 消除「只有生成它的机器能校验通过」』"
        given: "一个干净克隆（全部文件为 LF）"
        when: "在克隆中执行 `canon verify`"
        then: "结果 SHALL 为 2/2 通过（DC-HASH 源哈希一致 + DC-FIELD 字段引用完整）"
        and:
          - "该结论 SHALL 在非生成机器上同样成立"
          - "SHALL NOT 需要先执行任何归一命令"
      - id: SC-045
        confidence: high
        evidence: "risk_areas: canon 双轨校验 → 『改哈希算法会让所有既有 source_hash 一次性失效』；缓解措施为『提供一次性重新生成路径』"
        given: "存量活跃 change 的 Human View 头部记录的是旧算法哈希"
        when: "执行一次性重生成"
        then: "系统 SHALL 用新算法重写 Human View 头部的 `source_hash`"
        and:
          - "重生成 SHALL 只改动 `source_hash` 一行，SHALL NOT 改动正文"
          - "重生成后 `canon verify` SHALL 通过"
          - "归档 change SHALL NOT 被回溯修改"

  - id: REQ-021
    description: "DC-HASH 的比对必须能真正发现不同步，不得退化为恒真"
    scenarios:
      - id: SC-046
        confidence: high
        evidence: "备选方案 B（verify 时两种算法都试、任一通过即算通过）被排除，理由为『等于不解决：旧记录永远能通过，问题被掩盖而非消除』—— 即校验不得退化为恒真"
        given: "canonical YAML 被修改，但 Human View 未重新生成"
        when: "执行 `canon verify`"
        then: "校验 SHALL 报告 DC-HASH 失配"
        and:
          - "校验 SHALL 以非 0 退出码结束"
          - "该行为 SHALL 有对应测试覆盖（含变异测试）"
      - id: SC-047
        confidence: high
        evidence: "EXP-20260917-A2：断言必须能捕获真实缺陷，而不是被检测规则自身满足。校验逻辑若只用「归一前后是否相同」自证，会形成空断言"
        given: "在归一函数中注入一个已知缺陷（如只处理 `\\r\\n` 而忽略孤立 `\\r`）"
        when: "运行归一相关测试"
        then: "至少 1 个测试 SHALL 失败"
        and:
          - "变异 SHALL 以纯内存方式注入，SHALL NOT 留下文件残留"
          - "注入后 SHALL 恢复原状并复验"
