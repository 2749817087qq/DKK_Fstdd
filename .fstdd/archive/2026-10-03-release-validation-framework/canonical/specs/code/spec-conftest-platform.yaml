# spec: conftest.py + pytest platform marker 规范化
# change_id: 2026-10-03-release-validation-framework

meta:
  capability: "conftest-platform"
  change_id: "2026-10-03-release-validation-framework"
  created: "2026-10-03T12:45:00+08:00"
  confidence: high

requirements:
  - id: REQ-CONF-001
    description: "conftest.py 提供 --platform CLI option，允许指定当前运行平台"
    scenarios:
      - id: SC-CONF-001-1
        confidence: high
        given: "pytest 命令行，conftest.py 存在并注册 addoption"
        when: "pytest tests/ --platform workbuddy"
        then: "pytest 正常收集测试，无 UnknownOption 错误"
        and:
          - "--platform 参数值写入 pytest.config.option.platform"

  - id: REQ-CONF-002
    description: "平台 marker 注册 — 四平台标记 workbuddy/trae/claude_code/linux"
    scenarios:
      - id: SC-CONF-002-1
        confidence: high
        given: "conftest.py 有 pytest_configure hook"
        when: "pytest 启动收集测试"
        then: "四个 marker (platform_workbuddy/platform_trae/platform_claude_code/platform_linux) 注册成功"
        and:
          - "无 UnknownMarkWarning 或 UnknownMarkError"

  - id: REQ-CONF-003
    description: "平台不匹配的测试自动 skip — 不硬 fail"
    scenarios:
      - id: SC-CONF-003-1
        confidence: high
        given: "当前 --platform=trae，测试用 @pytest.mark.platform_workbuddy 标记"
        when: "pytest 收集并执行该测试"
        then: "该测试被 skip，skip reason 包含 current_platform=trae, required=workbuddy"
        and:
          - "skip 不计入 FAIL，不影响 exit code 判定"

  - id: REQ-CONF-004
    description: "env 双 key 兼容 — FSTDD_TOKEN 或 HUB_TOKEN 都能读"
    scenarios:
      - id: SC-CONF-004-1
        confidence: high
        given: ".heartbeat.env 只有 FSTDD_TOKEN=xxx（无 HUB_TOKEN）"
        when: "runner 读取 multihub token"
        then: "读到 FSTDD_TOKEN 的值，fallback 机制正常工作"
      - id: SC-CONF-004-2
        confidence: high
        given: ".heartbeat.env 只有 HUB_TOKEN=yyy（无 FSTDD_TOKEN）"
        when: "runner 读取 multihub token"
        then: "读到 HUB_TOKEN 的值"
      - id: SC-CONF-004-3
        confidence: high
        given: ".heartbeat.env 两者都有"
        when: "runner 读取 multihub token"
        then: "优先用 FSTDD_TOKEN（显式优先级）"
