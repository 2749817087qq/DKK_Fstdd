# 2026-10-03-build-yagni-ladder.yaml — Canonical Proposal (YAML-first, V2.9)

meta:
  change_id: "2026-10-03-build-yagni-ladder"
  title: "BUILD C4 #23 过度工程检查（YAGNI-7 决策梯子）+ 模板"
  created: "2026-10-03T21:40:00+08:00"
  status: draft
  version: "2.9"
  inspiration_source: |
    DietrichGebert/ponytail (⭐95k+, MIT) — 懒人工程师 7 级决策梯子（The Ladder），
    强制 Agent 在写任何代码前逐级自问，首个成立级别即为答案；实测砍 54%–80% 代码、降 20%–47% token。

why:
  problem: |
    BUILD 阶段 C4 现有 22 类失败模式（14 通用 + 8 金融）全部属于「做错了什么」：
    幻觉调用 / 注入 / 精度丢失 / 合规遗漏…。缺「做多了什么」这一整类。

    AI Agent（含 FSTDD 自身执行编码时）系统性偏向过度工程：用户要一个小功能，
    Agent 默认新增文件 + 抽象层 + 第三方依赖，而不是先问「真的需要写吗」。
    FSTDD 四阶段目前只有隐式「别过度工程化」这类软要求，BUILD C4 无显式检查项
    → 无法逐项打勾、无法在 test-report.md 留证、无客观通过/不通过判据。
  motivation: |
    ponytail 的价值在于把 YAGNI 从「人类开发者的自我约束」变成「Agent 的强制思维流程」：
    7 级阶梯 + 首个成立即停。FSTDD 做同构落点最省：C4 加一行检查 #23（零代码路径），
    配一份填表模板，即可让每个 change 的新增功能点都被强制过一遍阶梯，并留证。
    编排纪律：本 change（A）必须先于 formalize-finance-redlines（C）合入，二者同争 build.md C4，
    预留编号 #23(YAGNI) / #24(formal)。
  evidence:
    observed_at: "2026-10-03T21:30:00+08:00"
    observed_base_git_sha: "e869dc8dab892db3a97d9de627dbc799773d8815"
    details: |
      1. `.fstdd/skills/build.md` 与 `upstream/.fstdd/skills/build.md` C4 section 当前均为 22 行 data row
         （本地 L317-340，upstream 同步）；小节标题仍写「14 类」，与 22 行不符（既有不一致）。
      2. 回归面：`tests/test_finance_content.py` 的 L1-05 / L1-06 断言 C4 精确 22 行
         （`test_L1_05_build_local_c4_exact_22` / `test_L1_06_build_upstream_c4_exact_22`），
         本 change 改动 C4 表行数 MUST 同步更新这两个断言，否则 release validation L1 FAIL。
      3. 外部参照：ponytail 原始 7 级阶梯（rung1 YAGNI → rung2 repo 已有 → rung3 标准库 →
         rung4 平台原生 → rung5 已装依赖 → rung6 一行 → rung7 最小实现），carve-out 明确
         安全 / 信任边界校验 / 防数据丢失错误处理 / 无障碍 永不在砍除范围。

