# agent_spec.yaml — Agent 验证规格
# capability: installation-identity
# 修订 2026-10-22（C1 评审）：CP-2 原无实质断言、CP-4 用 upgrade --dry-run 走不到写口，
# 均为「看起来验了、实际没验」。改为可机械判定的断言。
# 追加 2026-10-22（2026-10-22-installation-id-backfill）：CP-8..CP-15 覆盖回填路径、
# 文本形态保留、幂等、registry 不写、两路径 PREFIX 一致、真实经验库 last_id 回归。

meta:
  task_id: "2026-10-21-installation-id-prefix/installation-identity"
  change_id: "2026-10-21-installation-id-prefix"
  revised_by: "2026-10-22-installation-id-backfill"
  task_type: code
  system: "upstream/fstdd/cli/commands/init.py + upstream/fstdd/cli/utils.py + upstream/fstdd/cli/commands/upgrade.py"
  preconditions:
    - "Phase 2 Gate 2 已确认"
    - "upstream/tests/ 既有测试全量作为回归基线"

steps:
  - id: CP-1
    description: "init 后 version.yaml 含合法 installation_id"
    action: "在 tmp_path 执行 fstdd init，读 .fstdd/version.yaml"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_matches
        expected: "installation_id: ✅ [A-Z0-9]{2,8}-[0-9A-F]{8}"
  - id: CP-2
    description: "installation_id 形状匹配 INSTALLATION_ID_RE（两段式，HEX 8 位大写）"
    action: "读 version.yaml → 用 fstdd.cli.utils.INSTALLATION_ID_RE 校验"
    assertions:
      - type: python_assert
        expected: "INSTALLATION_ID_RE.match(iid) and iid.count('-') == 1"
  - id: CP-3
    description: "--prefix 参数覆盖，且非法值降级不中止"
    action: "fstdd init --prefix MYPROJ / fstdd init --prefix 'my proj!'"
    assertions:
      - type: stdout_contains
        expected: "MYPROJ-"
      # 告警走 stderr（2026-10-22 DELIVER 修正：此前写 stdout，与实现不符）
      - type: stderr_contains
        expected: "--prefix 'my proj!' 不合法"
      - type: exit_code
        expected: 0
  - id: CP-4
    description: "upgrade 写口保留 installation_id 与未登记的既有字段"
    action: "构造 version.yaml（含 installation_id + future_field），调用 upgrade._write_version_yaml 传部分字段"
    assertions:
      - type: python_assert
        expected: "data['installation_id'] 不变 and data['future_field'] == 'keep-me'"
  - id: CP-5
    description: "self_check 打印实际生效值；未生效时不得打 ✅"
    action: "正常 init / version.yaml 损坏后 init，各看一次 stdout"
    assertions:
      - type: stdout_matches
        expected: "installation_id: ✅ <落盘值>"
      - type: stdout_not_contains
        expected: "installation_id: ✅"
        condition: "version.yaml 不可解析时"
  - id: CP-6
    description: "写入侧坏值被修复且下游立刻生效"
    action: "version.yaml 写 installation_id: ../etc/passwd → init → experience add"
    assertions:
      - type: python_assert
        expected: "新 installation_id 合法 and 新经验文件名以该 ID 开头"
  - id: CP-7
    description: "损坏 version.yaml 不被覆写"
    action: "写入非法 YAML → init → 比对文件字节"
    assertions:
      - type: python_assert
        expected: "文件内容与写入前完全一致 and stderr 含 '无法解析'"
  - id: CP-8
    description: "回填命令在无 .fstdd/ 的目录下拒绝执行"
    action: "在空 tmp 目录执行 `fstdd installation-id`"
    assertions:
      - type: exit_code
        expected: 2
      - type: stderr_contains
        expected: "fstdd init"
  - id: CP-9
    description: "回填只新增 1 行，且插在首个顶层键之前"
    action: "复制真实 336 行 version.yaml → `fstdd installation-id` → 比行数与插入位置"
    assertions:
      - type: python_assert
        expected: "行数 == 337 and 首个顶层键行 == 'installation_id: <IID>' and 前 4 行仍是注释"
  - id: CP-10
    description: "文本形态保留：注释 / 块标量 / 键值深比较 / 行尾"
    action: "同上，写入后逐项断言"
    assertions:
      - type: python_assert
        expected: "所有原 '#' 行仍在 and 'changelog: |' 仍在 and safe_load(旧)==safe_load(新) 除 installation_id"
  - id: CP-11
    description: "重复执行幂等"
    action: "连续执行两次 → 比字节与 mtime"
    assertions:
      - type: python_assert
        expected: "第二次执行后文件 bytes 与 mtime 均不变 and exit 0"
  - id: CP-12
    description: "回填不写全局 registry"
    action: "记录 ~/.fstdd/projects.yaml 字节 → 回填 → 再比"
    assertions:
      - type: python_assert
        expected: "projects.yaml 字节不变"
  - id: CP-13
    description: "upgrade 写口保留注释与块标量"
    action: "带注释 version.yaml → upgrade._write_version_yaml 传新字段 → 断言"
    assertions:
      - type: python_assert
        expected: "注释行全在 and 'changelog: |' 仍在 and installation_id 不变 and 新字段已写入"
  - id: CP-14
    description: "两条路径 PREFIX 一致（契约）"
    action: "同目录名/同 --prefix 分别走 init 与 installation-id，比较 PREFIX"
    assertions:
      - type: python_assert
        expected: "init 与 installation-id 产出的 PREFIX 完全相同（含 'BAD!' 回落场景）"
  - id: CP-15
    description: "真实 109 条经验库 last_id 不变"
    action: "回填前后各调一次 _rebuild_index(本仓 .fstdd/experiences)"
    assertions:
      - type: python_assert
        expected: "last_id == 40 两次相同"
