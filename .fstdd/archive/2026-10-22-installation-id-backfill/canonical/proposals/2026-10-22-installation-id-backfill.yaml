    - ".fstdd/experiences/.experience-index.yaml：**不改**（last_id 保持 40，作为回归断言）"
  infrastructure:
    - "无新增依赖、无服务变更、无部署动作"
    - "全局 `~/.fstdd/projects.yaml`：本 change 的 `installation-id` 命令**不写**该表（与 init 的差异点）"

constraints:
  - "不修改既有 109 个经验文件的 ID 与文件名；4 种命名族保持原样"
  - "不改 `.fstdd/experiences/.experience-index.yaml` 的 last_id（当前 40）"
  - "不引入新依赖（不使用 ruamel.yaml 等 round-trip 库）"
  - "重复执行 `fstdd installation-id` SHALL 使 version.yaml 字节级不变（可重复执行不产生副作用）"
  - "version.yaml 不可解析时 SHALL NOT 写入任何内容（沿用 SC-IID-007）"
  - "插入位置 SHALL 为首个顶层键行之前；SHALL NOT 在文件末尾追加（若文件以块标量结尾会被吸进块内）"
  - "`--prefix` 校验与降级语义 SHALL 与 `fstdd init --prefix` 完全一致（共用同一实现）"

stakeholders:
  - "所有在 v3.1.1 之前初始化的 FSTDD 项目（需要回填 installation_id）"
  - "本框架仓 stdd-repo 自身（新经验终于带前缀）"
  - "经验回传中心节点（可按前缀归属）"

risk_areas:
  - capability: "installation-identity"
    risk: >-
      文本插入若位置或缩进处理不当，可能产出非法 YAML 或把键插进上一个块标量内部。
    mitigation: >-
      插入点选「首个顶层键行之前」（正则 `^[A-Za-z_][\\w]*:` 的首个命中行），
      而非末尾追加；写后强制 `yaml.safe_load` + 键值逐键比对 + 注释头/字面块标记断言，
      任一失败则不落盘。测试用真实 336 行 version.yaml 副本作夹具，不用空文件。
  - capability: "installation-identity"
    risk: >-
      新命令与 `init` 的 prefix 派生逻辑各写一份，日后漂移成「两条路径给不同前缀」。
    mitigation: >-
      新命令直接调用 `init._get_prefix()`，正则共用 `utils.INSTALLATION_ID_RE`；
      新增契约测试断言两路径在同一目录名/同一 `--prefix` 下产出的 PREFIX 一致。
  - capability: "installation-identity"
    risk: >-
      回填后既有 4 种命名族与新的 `STDD-XXXXXXXX-EXP-YYYY-NNNN` 共存，`_rebuild_index`
      可能把 8 位 hex 段当序号（`last_id` 跳到百万级）。
    mitigation: >-
      上一 change 的 SC-EID-006 已定义 `_rebuild_index` 契约并有
      `test_rebuild_index_ignores_hex_tail` 覆盖；本 change 增加「以真实 109 条经验库
      为夹具」的回归断言，确保回填前后 `last_id` 恒为 40。

