why:
  problem: |
    排查「原版 stdd 是否静默上传经验」时，暴露出本项目**契约面与实际行为双向不一致**，
    横跨 5 处「AI 会当指令读」的文件；更关键的是：**回传这件事在契约与代码上都不成立**。

    ## 一、契约面漂移（5 处）

    | 文件 | 陈旧内容 | AI 当指令读 |
    |---|---|---|
    | FSTDD_CONSTITUTION.md:35 | Phase 4 自动上传经验到**社区** | 是（强制契约） |
    | init.py:254-259 | 「经验数据不外发」+「需要回传时**显式执行**」 | 是（生成的宪法） |
    | upgrade.py:285 | "Phase 4 DELIVER 自动同步知识图谱"（rules 条目） | 是（SessionStart 注入） |
    | upgrade.py:254/261/286 | 裸 STDD、stdd init、stdd knowledge merge | 是（同上） |
    | onboarding/AI_OPERATING_MANUAL.yaml:113 | stdd archive（自动合并 specs + **上传经验** + 同步知识图谱） | 是（AI 操作手册） |

    本仓库根宪法陈旧的原因：init.py 有 `if const_path.exists(): return`（不覆盖已存在文件），
    所以它**永远不会被重新生成**；`.fstdd/memory/FSTDD_CONSTITUTION.md` 更是直接缺失。
    升级说明（UPGRADE_NOTES.yaml）的注释写明是 "for AI self-learning on SessionStart"，
    即每次会话启动就注入，里面的 rules 会被当**现行规则**读 —— 所以这三处合起来才是完整契约面。

    ## 二、回传的语义错了两次

    1. **旧文本错**：宪法写「上传到**社区**」。社区指上游 `leonai42/stdd-experiences`，属第三方；
       我们的两条外发通道已永久移除，这句是上游行为描述的残留。
    2. **上一轮改的也错**：把它改成了「需要回传时**显式执行**」。
       D哥 明确：**回传必须静默、自动，不是显式执行** —— 错的只是**目标**，不是「静默」这个性质。

    正确语义（站在开发者与后续发展角度）：**Phase 4 (Deliver) 静默回传经验到本项目指定位置** ——
    有 GitHub 凭证时直传 `Fstdd-experiences`，无凭证时降级到自建接收端点进待审核池。
    两条都是我方位置，**都不指向第三方**。

    **为什么必须静默**：经验蒸馏的整个价值，建立在「汇聚足够多使用者的踩坑记录」上。
    一旦要求逐次确认，绝大多数使用者不会贡献，数据池永远是空的，后续发展无从谈起。
    所以静默不是「顺便」，而是这条策略能否成立的**前提**。

    **静默模式的工程前提**：静默意味着**没有人工逐条把关**，安全性与可控性只能靠机制兜底。

    | 要求 | 理由 |
    |---|---|
    | 强制脱敏 + 服务端二次校验 | 无人工把关，脱敏是唯一防线（已有，须保持） |
    | 零阻塞 | 回传失败/超时**绝不**影响使用者的 DELIVER 流程 |
    | 可审计 | 本地留回传日志（条目 / 目标 / 结果），使用者可查、我们可排障 |
    | 可关闭 | 提供关闭开关并在文档说明，避免「无法退出」的指责 |
    | 目标锁死 | 代码层面不可能指向第三方，防日后误改回社区 |

    ## 三、而且「静默回传」目前根本没实现

    已核实：`skills/` 全目录对 `share_experience` / `--publish` **零引用**，无任何 hooks。
    使用者机器上能触发回传的只有显式命令；我们机器上另有一个周任务。
    所以若只把契约改成「静默」，契约就又跑到代码前面 —— **正是本次要修的那个毛病**。
    故本次**同时实现**静默回传，让契约与代码同步成立。

    本问题属已知教训「强制契约必须与代码一致」的**同类复发**。

