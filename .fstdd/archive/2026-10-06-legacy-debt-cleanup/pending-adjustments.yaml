adjustments:
  - id: ADJ-001
    original_design_ref: "specs/code/test-suite-portability.yaml → REQ-001 / SC-001（原文限定「以文本模式调用子进程的测试与工具代码」）"
    actual_change: |
      实现范围由「subprocess 文本调用」**扩大**到「所有隐式依赖 locale 的文本 I/O」：
      除原定的 36 处 subprocess(text=True) 外，另补 19 处
      `Path.read_text()` / `Path.write_text()` / `Path.open()` / 内置 `open()` 的 `encoding="utf-8"`
      （7 文件：upstream/tests/commands/test_experience.py 8、tests/test_multi_platform.py 5、
       upstream/tests/commands/test_bootcamp.py 2、upstream/tests/commands/test_curate.py 1、
       upstream/tests/test_install_source.py 1、tests/test_upstream_baseline.py 1、
       tools/fstdd003_daily_share.py 1）。
    reason: |
      **实测证据**：仅修 subprocess 后，在真非 UTF-8 环境（unset PYTHONUTF8）下
      `pytest tests/test_multi_platform.py` 仍 **7 failed**（原为 2 failed）。
      根因是同一族但不同 API —— `Path.read_text()` 不带 encoding 时同样按 locale 解码，
      在 GBK 主机上读 UTF-8 源码即 `UnicodeDecodeError: 'gbk' codec can't decode byte 0x8a`
      （实测 tests/test_multi_platform.py:163 `sf.read_text()`）。
      补齐 19 处后，非 UTF-8 环境下失败数由 7 降至 2，且**两个环境结果完全一致**
      —— 即 REQ-001 的**意图**（门禁结果不依赖 locale）只有在覆盖全部隐式 locale 文本 I/O 后才达成。
      ⇒ 这是为满足 REQ-001 意图所**必需**的范围扩大，非可选项。
    impact_scope: "capability test-suite-portability 的实现范围与 TC-TSP-001 的扫描口径；接口与行为语义不变"
    severity: major
    affected_capabilities:
      - "test-suite-portability"
    exp_id: ""
    resolved: false

  - id: ADJ-002
    original_design_ref: "specs/code/test-suite-portability.yaml → SC-002（承诺 tests/test_multi_platform.py 结果 11 passed, 1 skipped）"
    actual_change: |
      为 `tests/test_multi_platform.py::TestEntryScripts` 两例补**宿主隔离参数**（断言不变）：
      · `test_install_sh_passes_platform`：调用 install.sh 时补 `--py <sys.executable>`
      · `test_install_ps1_passes_platform`：调用 install.ps1 时补
        `-NoProfile -ExecutionPolicy Bypass -Python <sys.executable>`
    reason: |
      消除 `UnicodeDecodeError` 后，两例暴露**宿主能力缺口**（与 locale 无关，两环境同样失败）：
      · PowerShell：本机 ExecutionPolicy 全作用域 Undefined ⇒ 生效策略 Restricted ⇒ 禁止运行任何 .ps1
        （实测 `Get-ExecutionPolicy -List` + 直接执行 install.ps1 报 SecurityError/UnauthorizedAccess）。
      · install.sh：脚本自动探测 `python3`，本机 PATH 上的 python3 可执行但**缺 PyYAML**，
        报 `ModuleNotFoundError: No module named 'yaml'`。
      两例的**被测目标**是「`--platform` 透传」（TC-MPA-009/010），不是「宿主能否跑脚本」。
      同文件的 `_run` / `_verify` 助手本就统一使用 `PY = sys.executable` —— 本次补参与该文件既有约定一致。
      补参后两例在**两个环境**下均通过（实测 11 passed, 1 skipped），断言强度未削弱（仍 `returncode == 0`）。
    impact_scope: "仅 tests/test_multi_platform.py 的两个集成用例的调用参数；断言与用例集合不变"
    severity: minor
    affected_capabilities:
      - "test-suite-portability"
      - "release-tooling-accuracy"
    exp_id: "EXP-2026-0015"
    resolved: false

