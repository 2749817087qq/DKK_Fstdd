  - id: ADJ-007
    original_design_ref: "specs/code/test-suite-portability.yaml → REQ-001（原文落点：以文本模式调用子进程的测试与工具代码 SHALL 声明 encoding=）/ SC-001（AST 判据：缺 encoding= 的数量为 0）"
    actual_change: |
      **build 阶段新发现第三类编码缺陷**，Slice 1 实现面扩大一个文件：
      `upstream/tests/test_install_scripts.py` 的 `_run()` **已**声明
      `encoding="utf-8", errors="replace"`，但**生产者**（Windows PowerShell 5.1）
      在 stdout 被重定向时按 `[Console]::OutputEncoding` 编码 —— 本机实测
      `gb2312 / CP=936` ⇒ 中文输出被按 UTF-8 解成 U+FFFD，断言失败。
      处置：新增 `_force_utf8_output()` / `_ps_arg()` / `_ps_quote()`，
      把 `-File <script> <args>` 改写为
      `-Command "[Console]::OutputEncoding=[System.Text.Encoding]::UTF8; & '<script>' <args>"`；
      `pwsh`（PowerShell 7+，默认 UTF-8）不加包装。规格侧补 `SC-006`（挂既有 REQ-001 下）。
    reason: |
      **实测证据**（`observed_at=2026-10-06T15:00Z`, `source=@4c6402e`）：
      全量 `pytest upstream/tests` = `2 failed, 953 passed, 5 skipped`，其中
      `test_install_scripts.py::TestInstallPs1ArgParse::test_install_ps1_explicit_python`
      报 `AssertionError: 未采纳 -Python 指定的解释器`，stdout 呈现 `FSTDD for WorkBuddy ���� ��װ`。
      ⚠️ **该失败与本 change 的既有改动无关**（`git diff --name-only HEAD` 对
      install.ps1 / test_install_scripts.py / install_workbuddy_skills.py /
      verify_workbuddy_skills.py **0 命中**）⇒ 属**预存缺陷**。
      但它恰好是 REQ-001 明文意图「使解码结果**不依赖运行环境的 locale / 控制台代码页**」
      的反例：SC-001 的 AST 判据只查「是否声明 encoding=」，**结构上抓不到
      「声明值与生产者不符」这一类** —— 正是 test-plan §1.2 第 3 条
      「验证跑坏掉的分支」所指的缺口。
      ⇒ 修它是为兑现 REQ-001 的意图，非范围外新增。
    impact_scope: "capability test-suite-portability；1 个既有测试文件（新增 3 个私有 helper，用例集合不变）；spec 增 SC-006（REQ 数不变）"
    severity: major
    affected_capabilities:
      - "test-suite-portability"
    exp_id: ""
    resolved: false

  - id: ADJ-008
    original_design_ref: "specs/code/test-suite-portability.yaml → SC-001（AST 判据：「text-mode 调用中未指定 encoding= 的数量 SHALL 为 0」）与 ADJ-001（文本 I/O 扩展）"
    actual_change: |
      **C1 多路并行技术评审（3 代理）暴露三处实现/工具缺陷，Slice 1 实现面再扩大一个文件**：
      ① **审计工具漏检（假绿）**：扫描器只匹配 `subprocess.X`，漏掉
         `upstream/tests/commands/test_new_isolate.py` 的 `import subprocess as _sp` 两处
         （L96 / L144）⇒ 已补 `encoding="utf-8", errors="replace"`，并把扫描器改为
         `_collect_subprocess_bindings()` 解析 `import subprocess [as X]` 与
         `from subprocess import Y [as Z]`，另加 `test_scanner_binding_selfcheck` 自检。
      ② **补丁脚本误插（真 bug）**：`tools/fstdd003_daily_share.py:110` 被补上
         `_OPENER.open(req, timeout=60, encoding="utf-8")`，而
         `urllib.request.OpenerDirector.open()` **不接受** `encoding=` ⇒ 运行时 `TypeError`。
         **已回退该处**（该文件因此恢复零 diff，同时解掉与 `tools/test_verify_notices.py`
         的 `test_TC_NEP_001`「daily_share.py 零 diff」断言的冲突）。
         根因：原扫描器把**任意** `.open()` 都当文件 I/O；已改为按接收者形态收窄
         （`_is_pathish_receiver()`），并保留 `tarfile.open(encoding=)` 这类合法例外。
      ③ **审计测试自身的假绿/假红**：`test_release_manifest_accuracy.py` 的失真表述检测
         用固定子串清单，被评审用反例证伪（漏判 `仓库根目录下没有 tests 目录`；
         误报「引述并更正」的语境）⇒ 改为正则 + 更正语境豁免，并加
         `test_tc_rta_001e` 把两个反例固化为断言。
    reason: |
      **实测证据**（`observed_at=2026-10-06T15:2x–15:3xZ`, `source=@4c6402e`）：
      · 别名扫描复扫：修复前缺 `encoding=` 的 text-mode subprocess = **2**（均在 test_new_isolate.py）；
        修复后 = **0**。
      · 属性式 `.open(encoding=)` 全仓复扫：修复前含 `_OPENER`（**不支持**该参数）；
        修复后仅剩 `tarfile`×2（**支持**）与 `AUDIT_PATH`（Path）。
      · `tools/fstdd003_daily_share.py` 回退后 `git diff --stat` 为空。
      ⇒ 三条均为「审计工具/补丁脚本本身有洞」导致，**不是规格变更**；
      但 ① 使实现面新增 1 文件，② 是必须修的运行时缺陷，③ 影响审计测试的可信度。
      ⚠️ 教训已固化：**审计工具的漏检 = 假绿**，故审计器自身必须有自检测试。
    impact_scope: "capability test-suite-portability（+1 文件、+1 自检用例）；release-tooling-accuracy（+1 自检用例）；tools/ 回退 1 处；无接口变更"
    severity: major
    affected_capabilities:
      - "test-suite-portability"
      - "release-tooling-accuracy"
    exp_id: ""
    resolved: false
