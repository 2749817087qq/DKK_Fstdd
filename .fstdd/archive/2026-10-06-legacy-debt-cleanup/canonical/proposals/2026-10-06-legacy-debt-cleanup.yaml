why:
  problem: |
    四项经实测确认的遗留债务长期挂账，共同后果是「门禁不可信」—— 红灯可能是环境噪声，
    绿灯可能漏测：
    1) 测试套件对环境编码敏感：用例普遍用 subprocess(text=True) 而不指定 encoding=，
       解码因此走 locale。同一份代码在「控制台 UTF-8 + PYTHONUTF8=1」下 906 passed /
       0 failed，一旦换环境即红 —— 不设 PYTHONUTF8 时 9 例因用 gbk 解本仓 CLI 的 UTF-8
       输出而炸；只设 PYTHONUTF8 而控制台非 UTF-8 时，PowerShell 的 GBK 输出被按 UTF-8
       解而炸（tests/test_multi_platform.py 2 例）。
    2) 发布清单与实际仓库结构不符，且根 tests/ 带预存失败：
       .fstdd/standards/release-and-docs.md 明文写「仓库根**没有** `tests/`」，
       而根 tests/ 实际存在（9 个测试文件）；tests/test_finance_content.py::test_L1_11
       硬编码 fstdd_version == "3.3.0"，自 3.3.1 起已过期；tests/test_multi_platform.py
       2 例失败与 (1) 同源。
    3) 一条归档 change 的 canonical 哈希欠账：
       canon verify 2026-09-18-inbox-api-only-write 仅 1/2，DC-HASH 源哈希不一致
       （YAML 29c0012fe4d0b612 vs 归档 proposal.md 16fa0e448d063e2a）。
    4) _scratch/ 误入库 20MB：git ls-files 显示 27 条目已跟踪（25 普通文件 +
       2 个 gitlink/内嵌 git 仓库），含 13.4MB red_pytest.log；.gitignore 从未包含
       _scratch/。2026-09-18 change 的 test-report 曾声称「_scratch/ 已 gitignored」，
       该断言为假。
  motivation: |
    D哥 2026-10-06 指令：把四项遗留问题合并清理（「新开change」）。四项同属「门禁可信度」
    一条主线，单项体量都小，合并处理可一次性恢复「绿灯可信」的状态。
  evidence:
    observed_at: "2026-10-06T21:28:59+08:00"
    observed_base_git_sha: "4c6402e366eb3e4e75efafc3f50341b77b0f8fd4"
    details: |
      1) 编码敏感量化（AST 扫描 upstream/tests + tests + tools 的 *.py）：
         subprocess 调用 108 处，text-mode 87，带 encoding= 51，缺 encoding= 36（16 文件）。
         热点：upstream/tests/commands/test_experience_glob_consistency.py(6)、
         tests/run_release_validation.py(5)、
         upstream/tests/commands/test_changes_dir_consistency.py(4)、
         tests/test_multi_platform.py(4)、tools/test_verify_notices.py(3)。
         复现：pytest tests/test_multi_platform.py -> 2 failed
         (test_install_sh_passes_platform / test_install_ps1_passes_platform)，
         均报 UnicodeDecodeError: 'utf-8' codec can't decode byte 0xce。
      2) 发布清单与预存失败：
         .fstdd/standards/release-and-docs.md:29 原文「注意测试在 `upstream/tests/`，
         仓库根**没有** `tests/`」；实际 tests/ 有 9 个 *.py。
         tests/test_finance_content.py:147 assert m.group(1) == "3.3.0"；
         复现：pytest tests/test_finance_content.py::test_L1_11_version_yaml_fstdd_version
         -> 1 failed（当前 fstdd_version = 3.3.5）。
      3) canon verify 实测：
         canon verify 2026-09-18-inbox-api-only-write ->
         [FAIL] DC-HASH 源哈希不一致 (YAML: 29c0012fe4d0b612, MD: 16fa0e448d063e2a)；
         [OK] DC-FIELD 字段引用完整；结论 1/2 通过。
         归档 proposal.md:3 = <!-- source_hash: 16fa0e448d063e2a -->。
      4) _scratch 实测：
         git ls-files _scratch/ = 27 条目（模式统计：25 x 100644 + 2 x 160000）；
         git ls-files -s 显示 _scratch/stdd-dev/stdd-repo（5e3f9a3）与
         _scratch/upstream-cli-sync（c383be7）为 gitlink；du -sh _scratch/ = 20M；
         最大 _scratch/red_pytest.log = 13,380,420 B；.gitignore 不含 _scratch。
         注：_scratch/ 是 2026-10-03-finance-integration 变更明文保留的
         fstdd-fin/SKILL.md 备份源（「源文件在 _scratch/ 保留（作为备份）」）。

