resolved:
  - id: ADJ-008
    title: "🔴【blocker 修复】删除入口由 3 个扩为 **6 个**：+ `os.rmdir` / `pathlib.Path.unlink` / `pathlib.Path.rmdir`"
    capability: test-teardown-resilience
    severity: major
    disposition: |
      接受并扩容。原设计的包装面**漏掉根因①**：shim（sitecustomize.py:1281）把
      `pathlib.Path.unlink` 直接换成 `_safe_path_unlink`，而后者在**非 bypass 分支**
      直接 `_try_trash()`（:1237），**不经过 `os.unlink`**。
      而 design.md:29 点名的失败点 `test_verify_notices_default_safe.py:90` 的 `target.unlink()`
      目标位于 `REPO/tools/_quarantine`（**仓库内**）—— 正是未覆盖路径。
      ⇒ 若不修，本 change 的核心主张（「在不改 `upstream/` 的前提下兜住根因①」）**不成立**。
      同时把端到端判据改为**具判别性**的形式（用非 bypass 的仓库内路径 + 包装面结构核对），
      因为 `tmp_path` 走 shim 的 bypass 分支，即使漏包 `Path.unlink` 也会通过（假绿）。
    evidence: |
      shim `:1224-1237` / `:1281` 源码核对；
      环境探针 `pathlib.Path.unlink.__name__` = `_safe_path_unlink`；
      修复后 `test_ttr_001_all_delete_surfaces_are_wrapped` 与
      `test_ttr_001_e2e_path_unlink_repo_internal` 通过，且会话汇总行出现
      `E:\FSTDD\stdd-repo\tests\.ttr-probe-never-created.tmp`（仓库内路径）；
      全量 **225 passed / 6 skipped**。
    residual_state: |
      已闭合。**新增经验 EXP-2026-0034**（shim 替换 Path.unlink）与 **EXP-2026-0036**（取样偏差）。

  - id: ADJ-001
    title: "D1a 中立根取**系统临时根本身**（原设计的因果方向被实证推翻）"
    capability: test-teardown-resilience
    severity: major
    disposition: |
      接受修正。原设计 D1a 的表述是「让 pytest 的临时路径**不落在**被守卫管控/放行的目录里」——
      **方向反了**。shim 的 bypass 判据是「路径位于 `_os_tmp_dirs` **之下**」（:1096 / :1027-1040），
      而 `_os_tmp_dirs` 于 shim import 期由 `tempfile.gettempdir()` 固化（:805-825）。
      ⇒ **落在系统临时根之下 = 被放行（安全）**；**迁出 = 反而撞守卫**。
      另有第二重风险：若另建**子目录**，子进程会继承 `TMP=<子目录>` 并在其 import 期把
      `_os_tmp_dirs` 固化为 `[子目录]` ⇒ `--basetemp`（在系统临时根下）脱离 bypass，
      子进程内删除由「原生删除」变为「移入回收站」——属**新引入的行为变化**。
      最终实现：归一为 `tempfile.gettempdir()` 本身 + `tempfile.tempdir = None` 清缓存。
    evidence: |
      shim `:805-825` / `:1027-1040` / `:1096-1099` 源码核对；
      `test_ttr_006_stays_inside_shim_bypass_root`（核心不变式）通过；
      全量 225 passed / 6 skipped（含依赖 TMP 的既有用例）。
    residual_state: |
      已闭合。净效果 = 补齐 `TMPDIR`（Windows 默认缺失）+ 归一三变量 + 固化不变式；**不迁移目录**。
      **新增经验 EXP-2026-0035**（bypass 判据与 `_os_tmp_dirs` 固化）。

