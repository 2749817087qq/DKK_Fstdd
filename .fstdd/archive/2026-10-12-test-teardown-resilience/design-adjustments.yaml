  ### C1 三路评审的发现与处置（共 1 blocker + 4 major + 6 minor/nit）

  | # | 来源 | 级别 | 发现 | 处置 |
  |---|---|---|---|---|
  | 1 | 代码 | **blocker** | 包装面漏 `pathlib.Path.unlink`（shim 直接替换，非 bypass 分支不经 `os.unlink`） | ✅ 已修（ADJ-008，扩为 6 入口 + 判别性判据） |
  | 2 | 代码 | major | 端到端判据用 `tmp_path` ⇒ 走 bypass 分支 ⇒ 假绿 | ✅ 已修（改仓库内探针 + 包装面结构核对） |
  | 3 | 代码 | major | `pytest_sessionfinish` 不改 `exitstatus` ⇒ 「绿而残留」 | ❌ **明确不采纳**（见下） |
  | 4 | 代码 | major | `_pick_neutral_base()` 回退到 `~/.cache` 会脱离 bypass 集 | ✅ 已修（改为归一到系统临时根，并加不变式判据，ADJ-001） |
  | 5 | 测试 | major | `test_ttr_006_tmp_dir_is_writable` 非判别性（系统临时区同样可写） | ✅ 已修（加「必须等于中立根」断言） |
  | 6 | 文档 | major | design.md 映射表 C4↔SC-007 错位、遗漏 C3 行 | ✅ 已修（ADJ-009） |
  | 7 | 文档 | major | 数字/状态列/矩阵/元数据滞后 | ✅ 已修（ADJ-009） |
  | 8–13 | 三路 | minor/nit | `os.remove is os.unlink` 不变式被打破、无 `functools.wraps`、汇总无省略提示、`_DELETE_GUARD_ORIGINALS` 兼作哨兵、`#` 剥注释法、TC-007 断言表述 | ✅ 已修 5 项 / ⚪ 记录 1 项（`os.remove is os.unlink`：已 grep 确认仓库内无依赖；保持两个独立包装体以便 monkeypatch 分别驱动，属**有意取舍**） |

  **不采纳项的理由（#3）**：让「捕获次数 > 0」把 `exitstatus` 置 1，会使失败数重新依赖
  「守卫是否恰好触发」⇒ **正是本 change 要消除的非确定性**，与 SC-006（可判性）直接冲突。
  design 决策 3 的契约是「**可见**」（告警 + 黄色汇总行），而非「判红」；
  且决策 1 已明确「删除失败 = 目标已不存在或未删掉，对测试语义无害」。
  故本项按设计意图驳回，并已在 `conftest.pytest_sessionfinish` 的 docstring 中写明理由。
