  2 条 Major（ADJ-001 / ADJ-008）+ 9 条 Minor 在本 change 内闭合；1 条结转欠账（ADJ-010）。
  · **ADJ-008 是 blocker 级修复**：原包装面漏掉根因①，不修则核心主张不成立。**建议 Gate 3 重点过目**。
