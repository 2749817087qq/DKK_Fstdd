  - id: ADJ-010
    title: "框架级欠账登记（**不在本 change 修**，须先 `UPSTREAM_PATCHES` 登记后另立 change）"
    severity: minor
    stage: "Phase 3 / Part C"
    design_ref: "design.md 决策 5（D5）"
    original: "D5 要求把「② 的 `except OSError` 不覆盖 `SystemExit`」登记为独立欠账。"
    actual: |
      共登记 3 条（全部位于 `upstream/`，Gate 1 non_goal ⇒ 本 change 不修）：
      ① `upstream/fstdd/cli/commands/experience.py:241` —— `os.remove(lock_path)` 的
         `except OSError` **抓不到 `SystemExit`** ⇒ 锁释放点会让进程被杀（EXP-2026-0029 根因）。
         本 change 的 D2 包装在**行为上**兜住了它（框架调用也经包装），但**语义欠账未清**。
      ② `upstream/fstdd/cli/commands/ci.py:397-413` —— `check_and_count` 的 docstring 写
         「per scenario」，实现却是**全文件累计** `**AND**` 计数 ⇒ 只要 spec 的 Scenario 多于 5 个
         就误报「AND 超限」。本 change 实测：7 个 Scenario 各 1 条 ⇒ 累计 6 > 5 ⇒ **假警告**
         （`ci check-failures` 的 2 条警告之一）。
      ③ `fstdd structure delta` 只输出 change 目录内的 `caveman_summary.txt` 一行
         ⇒ `code-structure-delta.md` 必须人工补全（上一 change 同形）。
    reason: "三者均为框架缺陷，修法涉及 vendored 内核语义决策，应由独立 change 承载。"
    evidence: "`ci check-failures` 输出；`code-structure-delta.md` 的 CLI 原始段；shim/源码行号核对。"
    impact: "本 change 交付后**抖动应消失**（D2 在行为上兜住 ①），但 ①②③ 的语义修复仍欠账。"
    affected_tc: [TC-TTR-009]
    decided_by: "long-range auto-record（预授权 A①；D5 要求）"
    user_known: false

  - id: ADJ-011
    title: "新增「自测隔离」夹具：本 change 自测用例刻意触发的捕获**不得**污染会话汇总"
    severity: minor
    stage: "Phase 3 / Part C（实跑发现）"
    design_ref: "design.md 决策 3（D3：可见性契约）"
    original: "D3 只要求「捕获必须可见（告警 + 计数 + 汇总）」，未区分捕获的来源。"
    actual: |
      新增 autouse 夹具 `_isolate_delete_guard_selftest`：仅对 `test_teardown_resilience_*`
      用例，在**用后还原** `DELETE_GUARD_STATS`（计数 + 目标列表）。
    reason: |
      🔴 **实跑发现的失真**：本 change 的 16 个自测用例**刻意注入** SystemExit 桩
      （monkeypatch 原实现），并非沙箱守卫真的拦了删除。原实现下，每次全量运行的
      `pytest_sessionfinish` 都会把约 10 次自测注入报成「会话共捕获 N 次删除守卫中断」——
      **汇总行失真**，真信号被噪声淹没（与 KG-092「失败静默腐烂」相对的另一端：
      **告警疲劳**）。
      这不是「多打几行日志」，而是**如实性问题**：汇总的语义是「守卫触发」，自测注入不属于该语义。
    evidence: |
      修复前：全量运行汇总行出现 **1 次**（列出 ~10 条自测注入路径）；
      修复后：单跑 5 个相关文件 **28 passed 且汇总行出现 0 次**（无真实守卫触发 ⇒ 汇总不打印）。
      另加判据 `test_ttr_004b_selftest_isolation_is_wired`（守护夹具接线：移除 autouse 即失败）。
    impact: |
      `tests/conftest.py` 新增 1 个 autouse 夹具；`tests/test_teardown_resilience_visibility.py`
      由 2 → 3 个用例；本 change 新增测试函数 21 → **22**（全量 226）。
    affected_tc: [TC-TTR-004]
    decided_by: "long-range auto-record（预授权 A①）"
    user_known: false

  - id: ADJ-012
    title: "补 `pytest_sessionfinish`（会话汇总）判据 —— 该函数因 ADJ-011 变为**零覆盖**"
    severity: minor
    stage: "Phase 3 / Part C（覆盖率诊断发现）"
    design_ref: "design.md 决策 3（D3：可见性契约）"
    original: "D3 的「会话汇总」只有行为描述，无判据（TC-004 原只覆盖计数与告警文本）。"
    actual: |
      新增 4 个用例直接驱动 `pytest_sessionfinish`（以最小 session 替身注入 `terminalreporter`）：
      ① 无捕获时**不得**输出；② 有捕获时输出「前缀 + 计数 + 逐条目标路径」；
      ③ 超 20 条时输出「其余 N 条省略」；④ 取不到 `terminalreporter` 时**退化为 warning**（不得静默丢弃）。
    reason: |
      🔴 **覆盖率诊断实测**：`pytest_sessionfinish` 的函数体**完全未被覆盖** —— 因为 ADJ-011 的
      自测隔离让会话结束时 `captured == 0`，该函数**提前返回、永不执行**。
      ⇒ D3 的「汇总必须可见」这一**核心交付物当时无任何测试保护**，属本 change 主题
      （「不得静默」）自身的反讽缺口。
    evidence: |
      `--cov=conftest` 实测：新增判据前 **66%**（`240-255` 全缺）→ 加 004c 系列后 **75%**（`240-255` 覆盖）
      → 加 ④ 后退化分支亦覆盖，最终 **76%**（余缺项均为既有 helper 或幂等/防御分支）。
      单跑 5 文件 **32 passed**。
    impact: |
      `tests/test_teardown_resilience_visibility.py` 由 3 → **7** 个用例；
      本 change 新增测试函数 22 → **26**（全量 230）。
    affected_tc: [TC-TTR-004]
    decided_by: "long-range auto-record（预授权 A①）"
    user_known: false

note: |
  ⚠️ **读法说明**：各 ADJ 的 `evidence` 中的测试数/行数是**该次实测时的快照**。
  后续调整会改变这些数字（ADJ-012 之后：**230 passed / 6 skipped**；`tests/conftest.py` **372 行**；
  本 change 新增 **26** 个测试函数）。以 `test-report.md` 的最终值为准。

  **2 条 Major（ADJ-001 / ADJ-008）+ 10 条 Minor**。
  · ADJ-008 是 **blocker 级修复**：原包装面**漏掉根因①**，若不修则本 change 的核心主张不成立
    （仓库内路径的 `Path.unlink()` 仍会抛 SystemExit）。已补判别性判据。
  · ADJ-001 推翻了 design 决策 1 的**因果方向**（「不落在被放行的目录里」→ 实为「必须留在系统临时根之下」），
    依据是 shim 源码 + 实测；属**设计假设被实证纠正**，建议 Gate 3 时一并过目。
  · ADJ-006 保留初版错误结论并显式更正，作为「取样偏差」的教训留档。
  · C1 三路评审（代码/测试/文档）共报 1 blocker + 4 major + 6 minor/nit；
    处置：blocker 已修（ADJ-008）、major 中 3 项已修（ADJ-001 / ADJ-007 / 判据强化）、
    1 项 **明确不采纳**（见 `test-report.md` §六「评审发现与处置」—— 「捕获即置 exitstatus=1」
    会重新引入非确定性，与 SC-006 冲突）。
