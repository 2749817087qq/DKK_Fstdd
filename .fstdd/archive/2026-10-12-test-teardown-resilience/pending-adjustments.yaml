  - id: ADJ-006
    title: "【已修正】「`Path.unlink` 经由 `os.unlink`」的结论只在**无 shim 环境**成立"
    severity: minor
    stage: "Phase 3 / Slice 1（侦察）"
    design_ref: "design.md 风险表「shim 的拦截层比 os.remove 更底层」"
    original: |
      初版记录称：实测（Python 3.13.12）`os.remove is os.unlink` 为 True，
      `Path.unlink()` 与 `shutil.rmtree()` 内部删除均经由 `os.unlink`，
      ⇒ 包装 `os.unlink` 一处即覆盖根因①与 rmtree 内部删除。
    actual: |
      ⚠️ **该结论在 shim 生效环境下不成立**（本机 PYTHONPATH 已含 shim）：
      shim `:1281` **直接替换** `pathlib.Path.unlink` 为 `_safe_path_unlink`，
      其非 bypass 分支直接 `_try_trash()`（:1237），**不经过 `os.unlink`**。
      初版结论来自**未经 shim 的裸 python 进程**，属取样偏差。
    reason: |
      这正是 C1 代码评审报出的 **blocker**（见 ADJ-008）。此处保留原记录并显式更正，
      以免后人据错误结论再次缩小包装面。
    evidence: "`python -c \"import pathlib; print(pathlib.Path.unlink.__name__)\"` → `_safe_path_unlink`（shim 生效）"
    impact: "直接导致 ADJ-008 的包装面扩容。"
    affected_tc: [TC-TTR-001]
    decided_by: "long-range auto-record（C1 评审发现后更正）"
    user_known: false

