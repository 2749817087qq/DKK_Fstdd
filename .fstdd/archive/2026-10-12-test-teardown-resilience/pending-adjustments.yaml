adjustments:
  - id: ADJ-001
    title: "D1a 中立根取**系统临时根本身**（原设计隐含「另建中立目录」，被实证推翻）"
    severity: major
    stage: "Phase 3 / Slice 2"
    design_ref: "design.md 决策 1（D1a）"
    original: |
      「把 TMP/TEMP/TMPDIR 指向仓库外的中立目录（规避 ①：让 pytest 的临时路径
      **不落在被守卫管控/放行的目录里**）」—— 初版实现取专用子目录 `<系统临时根>/fstdd-pytest-tmp`。
    actual: "归一为 `tempfile.gettempdir()` 即**系统临时根本身**，不另建子目录；并保留 `tempfile.tempdir = None` 清缓存。"
    reason: |
      🔴 **实证推翻了原设计的因果方向**（读 shim 源码 + 实测）：
      · `_should_bypass_safe_delete`（shim sitecustomize.py:1096）的判据是
        「路径是否位于 `_os_tmp_dirs` **之下**」（`_is_under_root`，:1027-1040）；
      · `_os_tmp_dirs` 于 **shim import 期**由 `tempfile.gettempdir()` 固化（:805-825）。
      ⇒ **落在系统临时根之下 = 被守卫放行（安全）**；**迁出系统临时根 = 反而撞守卫**。
      即：原设计「不落在被放行的目录里」是**反向**的。
      另外，专用子目录还有第二个风险：**子进程**会继承 `TMP=<子目录>` 并在其 shim import 期
      把 `_os_tmp_dirs` 固化为 `[子目录]` ⇒ `--basetemp`（在系统临时根下）**脱离 bypass**，
      使子进程内的删除由「原生删除」变成「移入回收站」，属**新引入的行为变化**。
    impact: |
      TC-TTR-006 的核心判据由「专用目录名」改为「**中立根 == 系统临时根**」（见 ADJ-005 同族）。
      净效果 = 补齐 `TMPDIR`（Windows 默认缺失）+ 归一三变量 + 明确不变式；**不迁移目录**。
    evidence: |
      shim:1096-1099 / 1027-1040 / 805-825 源码核对；
      `test_ttr_006_stays_inside_shim_bypass_root` 通过；
      全量 225 passed / 6 skipped（含依赖 TMP 的既有用例）。
    affected_tc: [TC-TTR-006]
    decided_by: "long-range auto-record（预授权 A①：小设计偏离自动记录并继续）"
    user_known: false

  - id: ADJ-002
    title: "D2 包装体改为**调用时查表**取原实现（而非闭包捕获）"
    severity: minor
    stage: "Phase 3 / Slice 1"
    design_ref: "design.md 决策 2（D2）"
    original: "包装 `os.remove`/`os.unlink`/`shutil.rmtree`，捕获 SystemExit（未指定原实现的引用方式）"
    actual: "包装体在**调用时**从 `_DELETE_GUARD_ORIGINALS[key]` 取原实现，而非在包装时用闭包捕获。"
    reason: |
      闭包捕获会让**端到端判据无法驱动** —— 测试无法把「被包装的原实现」替换为抛 SystemExit 的桩，
      于是只能退化为「只测纯函数」，无法证明真实 `Path.unlink()` / `os.remove` 确实经由包装层。
    impact: "TC-TTR-001 由「纯函数语义」升级为「纯函数 + 端到端接线」判据。"
    affected_tc: [TC-TTR-001, TC-TTR-002]
    decided_by: "long-range auto-record（预授权 A①）"
    user_known: false

