  - id: ADJ-008
    title: "🔴【blocker 修复】删除入口由 3 个**扩为 6 个**：+ `os.rmdir` / `pathlib.Path.unlink` / `pathlib.Path.rmdir`"
    severity: major
    stage: "Phase 3 / Part C（C1 代码评审发现）"
    design_ref: "design.md 决策 2（D2）"
    original: "只包装 `os.remove` / `os.unlink` / `shutil.rmtree`"
    actual: "扩为 6 个入口，并新增**包装面结构核对**判据（`test_ttr_001_all_delete_surfaces_are_wrapped`）。"
    reason: |
      🔴 **原包装面漏掉根因①**：shim `:1281` 把 `pathlib.Path.unlink` 直接换成 `_safe_path_unlink`，
      而后者在**非 bypass 分支**（仓库内路径走的正是这一支）直接 `_try_trash()`（:1237），
      **不经过 `os.unlink`** ⇒ 只包装 `os.*` 无法捕获该路径上的 SystemExit。
      design.md:29 点名的失败点 `test_verify_notices_default_safe.py:90` 的 `target.unlink()`
      目标位于 `REPO/tools/_quarantine`（**仓库内**）⇒ 正是未覆盖路径。
    evidence: |
      shim:1224-1237 / 1281 源码核对；
      `pathlib.Path.unlink.__name__` = `_safe_path_unlink`（shim 生效环境实测）；
      修复后 `test_ttr_001_all_delete_surfaces_are_wrapped` 与
      `test_ttr_001_e2e_path_unlink_repo_internal`（非 bypass 路径）通过，
      且汇总行出现仓库内路径 `E:\FSTDD\stdd-repo\tests\.ttr-probe-never-created.tmp`。
    impact: "TC-TTR-001 判据由 3 入口扩为 6 入口；端到端判据改用具判别性的**非 bypass 路径**。"
    affected_tc: [TC-TTR-001]
    decided_by: "long-range auto-record（预授权 A①；评审发现项）"
    user_known: false

