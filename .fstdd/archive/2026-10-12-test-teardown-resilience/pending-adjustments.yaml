  - id: ADJ-004
    title: "TC-TTR-005 增加**源码级结构断言**（剥注释后扫描宽捕获）"
    severity: minor
    stage: "Phase 3 / Slice 1"
    design_ref: "test-plan.md 案例 1.5"
    original: "「断言 conftest 源码不含 `except Exception` / `except BaseException`」"
    actual: "实现为 `test_ttr_005_no_broad_catch_in_source`：**逐行剥离 `#` 注释后**再正则扫描，并把裸 `except:` 一并纳入。"
    reason: |
      不剥注释会**误报**（说明性注释里会出现这些字样）；裸 `except:` 是比 `except Exception` 更宽的形态，原判据遗漏。
    impact: "TC-TTR-005 判据更严；行为判据（PermissionError / KeyboardInterrupt 照抛）不变。"
    affected_tc: [TC-TTR-005]
    decided_by: "long-range auto-record（预授权 A①）"
    user_known: false

