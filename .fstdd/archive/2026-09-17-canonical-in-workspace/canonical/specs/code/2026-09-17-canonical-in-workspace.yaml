# spec.yaml — 行为规格（Canonical YAML）

meta:
  capability: "canonical-in-workspace"
  change_id: "2026-09-17-canonical-in-workspace"
  created: "2026-09-17T08:26:31.913039"
  confidence: high

requirements:
  - id: REQ-001
    description: "法定源必须位于工作区内，全部 FSTDD 开发产物集中在工作区文件夹"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "D哥 2026-09-17 裁定：所有 FSTDD 开发产物包括真源全部归档到工作区"
        given: "工作区 `C:\\Users\\Administrator\\WorkBuddy AI\\2026-09-14-18-36-54\\`"
        when: "检查法定源位置"
        then: "法定源 SHALL 为工作区内的 `stdd-repo`"
        and:
          - "SHALL 持有完整 git 历史与 tag `fstdd-v1.0.0`"
          - "SHALL NOT 存在任何**仅**位于区外副本中的内容"

      - id: SC-002
        confidence: high
        evidence: "实测：820 文件中 797 与 stdd-repo 逐字节相同，独有 10 份中 5 份已归并"
        given: "区外副本 `~/.workbuddy-ai/Fstdd`"
        when: "按 git blob 哈希逐个比对它与 `stdd-repo`"
        then: "每个文件的内容 SHALL 能在 `stdd-repo`（含其对象库）中找到"
        and:
          - "若发现仅存于区外的内容，SHALL 先归并再继续，SHALL NOT 直接归档"

  - id: REQ-002
    description: "skill 内固化路径必须指向工作区内的法定源"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "当前 skill 路径指向 ~/.workbuddy-ai/Fstdd（上一轮的决定）"
        given: "从 `stdd-repo` 重装后的 `~/.workbuddy/skills/fstdd*/SKILL.md`"
        when: "检查其中的绝对路径"
        then: "SHALL 指向工作区内的 `stdd-repo`"
        and:
          - "SHALL NOT 含 `~/.workbuddy-ai/Fstdd`"
          - "`verify_workbuddy_skills.py` SHALL 全绿"

      - id: SC-004
        confidence: high
        evidence: "install 脚本的 SRC 默认取脚本自身所在仓库的 upstream"
        given: "安装脚本 `stdd-repo/tools/install_workbuddy_skills.py`"
        when: "执行安装"
        then: "SRC SHALL 解析为 `stdd-repo/upstream`"
        and:
          - "SHALL NOT 需要额外设置 `FSTDD_SRC`"

  - id: REQ-003
    description: "校验脚本的安装位置解析必须与「安装源 = 工作区仓库」这一事实一致"
    scenarios:
      - id: SC-005
        confidence: high
        evidence: "原则不变（用安装源自己的 verify），变的是安装源是谁"
        given: "`tools/verify_skill_standards.py`"
        when: "读取 `_installed_tools()` 的候选顺序"
        then: "顺序 SHALL 为：`FSTDD_INST_DIR` → 脚本自身 `tools/` → 工作区仓库 → 历史兜底"
        and:
          - "SHALL NOT 把区外副本 `~/.workbuddy-ai/Fstdd` 置于首位"
          - "SHALL NOT 把 `D:/Programs/DKK_Fstdd` 置于首位"

      - id: SC-006
        confidence: high
        evidence: "同一处硬编码在 verify_rename.py 中重复"
        given: "`tools/verify_rename.py`"
        when: "读取其安装位置解析"
        then: "SHALL 与 SC-005 采用同一顺序"

      - id: SC-007
        confidence: high
        evidence: "本 change 的直接目标之一"
        given: "工作区（存在区外副本与 D 盘调试副本）"
        when: "从工作区运行三项校验"
        then: "`verify_eol` SHALL 7/7、`verify_skill_standards` SHALL 7/7、`verify_rename` SHALL 8/8"
        and:
          - "结果 SHALL NOT 受区外副本是否存在影响"

  - id: REQ-004
    description: "区外副本必须完整归档，不得丢失内容"
    scenarios:
      - id: SC-008
        confidence: high
        evidence: "D哥 决定「归档不删」"
        given: "`~/.workbuddy-ai/Fstdd`"
        when: "归档到 `backups/`"
        then: "归档副本 SHALL 与原目录文件数一致"
        and:
          - "逐文件哈希 SHALL 一致"
          - "原目录 SHALL NOT 被删除"

  - id: REQ-005
    description: "文档与记忆必须反映新架构"
    scenarios:
      - id: SC-009
        confidence: high
        evidence: "文档是判断「法定源在哪」的依据来源，它陈旧会持续误导"
        given: "`docs/WORKBUDDY_INSTALL_NOTES.md`"
        when: "阅读第 0 节的位置与权威关系"
        then: "法定源 SHALL 写为工作区内的 `stdd-repo`"
        and:
          - "SHALL 说明 `~/.workbuddy-ai/Fstdd` 已归档、不再是法定源"
          - "SHALL 保留「GitHub 是上传目标」的表述"

      - id: SC-010
        confidence: high
        evidence: "项目 MEMORY.md 的法定源条目是后续判断的依据"
        given: "项目 `MEMORY.md`"
        when: "读取法定源条目"
        then: "SHALL 反映新架构（法定源 = 工作区内 `stdd-repo`）"
        and:
          - "SHALL 保留 `D:/Programs/DKK_Fstdd` 不要动 的告警"
