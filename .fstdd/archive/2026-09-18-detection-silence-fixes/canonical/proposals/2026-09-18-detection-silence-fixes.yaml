meta:
  change_id: 2026-09-18-detection-silence-fixes
  title: 检测静默失效修复包（审计 15 处吞错 + F-1/F-2 + 审计勘误）
  type: code
  status: proposed
  created_at: '2026-09-18T02:26:09+00:00'
  version: '2.9'

why:
  problem: |
    silent-failure-audit 产出审计表：29 处裸 except 吞异常点中 15 处判
    「意外吞错」（其中 7 处 P1 响应=升级 change），另有两个 BUILD 期发现
    F-1（僵尸检测豁免活跃 change）与 F-2（滞后检测零接线）。这些检测路径
    静默失效期间无人知晓（EXP-20260917-B3 同族教训）。本 change 按审计
    分级一次性修复，并把其中一处审计误判（guard.py:315 实为 fail-closed）
    以实证勘误。
  evidence:
    observed_at: '2026-09-18T02:26:09+00:00'
    observed_base_git_sha: '602383d'
    method: |
      依据 audit/except-points.yaml（2026-09-18-silent-failure-audit 产出，
      HEAD 602383d 时点 29 点扫描 + 逐点人工分类）。修复目标逐条来自表中
      response 字段（加警告 8 处 + 升级 change 7 处）与 test-report F-1/F-2。
    source: .fstdd/archive/2026-09-18-silent-failure-audit/audit/except-points.yaml

what_changes:
  - description: guard.py git 计数失败（EA-001/002）→ stderr 警告，不再静默返回 0
  - description: guard.py 僵尸检测（EA-003）naive last_mod 按 UTC 归一，解析失败告警
  - description: F-2：_check_phase_integrity_guard 接入 guard status 输出（滞后警告真正可见）
  - description: F-2 同族：build/spec completed_at naive 归一（EA-005/006）
  - description: F-1：status 僵尸扫描取消活跃豁免，活跃停滞 change 标注「当前活跃」
  - description: status.py 僵尸 naive last_mod 归一 + 解析失败告警（EA-010）
  - description: check_timestamps 三个扫描循环：文件级失败记 scan_errors，覆盖可观测（EA-011/012/013）
  - description: validate 基线状态不可读 → 警告而非静默丢失（EA-014）
  - description: baseline.py 基线文件损坏 → 警告而非视同未建立（EA-015）
  - description: batch close Gate 3 确认失败 → 警告，证据链缺口可见（EA-017）
  - description: fix.py 批量重写跳过计数并报告（EA-018）
  - description: gate.py 单条 spec Human View 生成失败收集警告（EA-019）
  - description: 审计勘误：guard.py:315（EA-004）改判合理容错——实证 except 路径 return False =
      不放行 = fail-closed，最坏情况是合法产出物被拦（安全方向），原 P1 误判撤销，
      勘误记录进 test-report

capabilities:
  new: []
  modified:
    - name: cli-guard
      description: 检测路径失败全部有声（警告或 fail-closed），零静默跳过
    - name: cli-status
      description: 僵尸检测覆盖活跃 change；naive 时间戳归一不再漏检
    - name: timestamp-guard-l2
      description: 扫描错误计入报告，「零违规」不再掩盖覆盖缺口
    - name: experience-audit
      description: 审计勘误机制落地（误判以实证纠正并留痕）

out_of_scope:
  - 合理容错 14 处不动（审计已放行）
  - 检测标准松紧调整（只改静默→有声，不改判定阈值）
  - 哨兵/扫描器改动（audit_silent_except.py 本 change 不动，但修复会改变
    部分吞异常点的形态，需同步刷新审计表——见 success_criteria）

success_criteria:
  - 15 处意外吞错点全部修复或勘误，修复点有新测试锁定（每点 ≥1 断言其「有声」行为）
  - F-1：单 change 项目活跃停滞 8 天，`fstdd status` 必报僵尸（端到端）
  - F-2：`fstdd guard status` 输出包含滞后警告段（端到端）
  - 修复后审计表刷新（tools/audit_silent_except.py --check 仍通过，
    表条目与实际代码同步更新）
  - 全量测试绿，新增测试函数 ≥12；verify_eol 7/7
  - 无检测语义收紧：全部修复为「失败有声」，不改检测阈值
