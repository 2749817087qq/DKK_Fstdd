# spec.yaml - 行为规格（Canonical YAML）
meta:
  capability: "except-audit"
  change_id: "2026-09-18-silent-failure-audit"
  created: "2026-09-18T00:50:00+00:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "29 处吞异常点位 100% 有审计结论，逐条记录理由"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "observed_at=2026-09-18T08:34:00+08:00 @6c5d390 只读盘点：29 处 / 16 文件；含检测语义 11 处 / 4 文件"
        given: "Gate 1 盘点清单（29 处）与豁免清单 audit-exceptions.yaml"
        when: "逐点审计并写入结论"
        then: "每处条目含 file / line / anchor / category / reason / audited_at / audited_by 七字段"
        and:
          - "category ∈ {intentional, bug-fixed, narrowed}，无空值"
          - "reason 非空且非套话（少于 10 字视为无效）"
          - "29 处覆盖率 100%，审计清单本身有测试断言"
  - id: REQ-002
    description: "审计分类不得改变既有检测的判定语义"
    scenarios:
      - id: SC-002
        confidence: high
        evidence: "proposal constraints：改动不得改变既有检测的判定语义——只修异常被吞与检测写错，不改检测标准松紧"
        given: "审计完成后的代码"
        when: "运行全量工程测试"
        then: "无回归（基线 692 passed / 694 collected；允许因修复 bug 类点位而新增通过）"
        and:
          - "narrow 类点位的旧行为变化必须有对应测试用例说明新行为"
  - id: REQ-003
    description: "bug 类点位修复遵循 TDD 且真跑代码路径"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "EXP-20260917-B3：B3 类缺陷静态检测抓不到，必须行为级验证"
        given: "审计判定为 bug 的点位"
        when: "修复"
        then: "先有失败测试暴露该缺陷（RED），修复后 GREEN"
        and:
          - "测试真实执行该代码路径（非打桩绕过）"
          - "修复后的 except 块留 logger.debug 痕迹（留痕规范）"
