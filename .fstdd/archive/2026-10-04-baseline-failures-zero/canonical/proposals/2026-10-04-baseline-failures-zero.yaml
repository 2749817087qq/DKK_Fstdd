constraints:
  - 不改被扫描源码的 except 语义（只治理表与实况的对齐），避免为过测试而删点。
  - 不改 `.fstdd/archive/**` 归档表（活表置于 active change 下，归档表不动）。
  - naive 值层补时区按仓库既有 UTC 约定（`+00:00`），不引入本地偏移造成口径分裂。
  - 显式 --publish 的失败语义（失败→非零、静默路径→零阻塞）不得被改动，只修测试隔离性。
  - 不 push GitHub（origin）；tag 仅推 server + local 双端。

risk_areas:
  - capability: except-points-audit-table
    risk: |
      若把「行号位移」误判为「新增吞异常点」，会重复计数导致表与实况指纹集合不等（TC-AUD-002 红）。
    mitigation: |
      逐点核对指纹 (file, stmt, handler) 后再刷新行号；新点仅限实况扫描中确无对应表项的 6 处。
  - capability: timestamp-naive-zero
    risk: |
      把标识符日期片段误当时间字段修复，会改变文件名/ID 形态；反之豁免过宽会掩盖真 naive 产出。
    mitigation: |
      仅对「源码行含 timezone 标记」的 2 处真时间戳做 aware 改造；3 处标识符逐条附理由入豁免清单，
      且由 TC-TSN-006 保证每条豁免可在源码定位。

non_goals:
  - 不新增/修改任何面向用户的 CLI 能力（纯基线治理，semver=PATCH）。
  - 不清理归档目录、不重写历史 tag。
  - 不处理 3.3.0 CHANGELOG 中的 GitHub Release 缺失项（另立流程）。

