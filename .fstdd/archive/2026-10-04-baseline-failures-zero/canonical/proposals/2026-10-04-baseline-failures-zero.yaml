meta:
  change_id: "2026-10-04-baseline-failures-zero"
  title: "清零 6 项预存基线 pytest 失败：模板双源 / 审计表漂移 / 显式 publish 非零 / naive 时间戳"
  created: "2026-10-03T16:16:43+00:00"
  status: draft
  version: "2.9"

why:
  problem: |
    发布规程《release-and-docs.md》§三 要求「全量测试 0 failed」方可打 tag，但本仓
    基线长期带 6 项 pytest 失败，分属 4 类根因（模板双源不一致 / 吞异常审计表与实况
    漂移 / 显式 --publish 失败退出码测试非 hermetic / naive 时间戳未清零）。后果有二：
    (1) 3.3.0 发布时检查清单只能在 CHANGELOG 里带「6 项预存基线偏离」发布，「缺件不得
    tag」的纪律被软化；(2) 6 项常红构成固定噪声，真实回归被淹没。必须一次性把基线清零，
    使「0 failed」重新成为可判定的硬门禁。
  evidence:
    observed_at: "2026-10-04T00:20:00+00:00"
    observed_base_git_sha: "e7bfb45755f48387225a8ecb4da0a2dd38ec4603"
    details: |
      在 HEAD=e7bfb45、工作树干净的前提下执行
      `python -m pytest upstream/tests -q` → `6 failed, 867 passed, 54 skipped`。
      6 项失败与根因（逐条已实测定位）：
      1) test_constitution_ops.py::test_tmpl_001_dual_source_templates_identical
         与 2) test_evidence_ops.py::test_epr_003_templates_consistent_with_examples：
         `.fstdd/templates/` 已含 finance 段，`upstream/.fstdd/templates/` 未同步，
         三文件（canonical/proposal.yaml、canonical/spec.yaml、test-plan.md）字节不等。
      3) test_except_audit.py::test_aud_002_table_matches_live_scan
         与 4) test_guard_silent_except.py::test_grd_001_check_passes_on_current_repo：
         生效审计表回退到归档表（19 点），而实况扫描 25 点；guard.py 5 处行号位移超
         ±5 容差（310→317 / 374→381 / 447→454 / 466→473 / 1203→1265），另有 6 点未入册。
      5) test_silent_share.py::TestZeroBlocking::test_tc_cas_008b_explicit_publish_still_nonzero：
         该用例只隔离 inbox 死端口，未隔离 scp 优先通道；在具备 SSH 别名 fstdd-hub 的
         环境（本机 F 侧）scp 真跑成功 → main() 返回 0，断言 `== 1` 失败。属测试非 hermetic。
      6) test_timestamp_ops.py::test_tsn_007_full_scan_zero_naive_and_readonly：
         full_scan 报 13 个 naive：L1 值 8 处（notices-authenticity-gate 的 .fstdd.yaml 3 +
         canonical proposal/spec ×4 + proposal.md 头部 1）、L2 源 3 处（heartbeat.py /
         fstdd003_daily_share.py 产出的真时间戳 2 + 标识符日期片段 3 未豁免）。

what_changes:
  - id: C1
    description: |
      模板双源对齐：把 `.fstdd/templates/canonical/proposal.yaml`、`canonical/spec.yaml`、
      `test-plan.md` 三文件同步到 `upstream/.fstdd/templates/` 同相对路径，使两处模板
      逐文件字节一致（finance 段随之下发到可分发镜像）。纯缺失补齐，不改模板语义。
    type: modified
  - id: C2
    description: |
      吞异常审计活表刷新：在 `.fstdd/changes/2026-10-04-baseline-failures-zero/audit/
      except-points.yaml` 新建活表（changes 优先于 archive），承接归档表 19 点并刷新
      guard.py 5 处行号位移（指纹不变），另将此前未入册的 6 处吞异常点分类入册
      （guard.py:535 + tools/fstdd003_daily_share.py 65/90/119 + tools/heartbeat.py:66 +
      tools/v2_revocation_test.py:58），合计 25 点，与实况扫描零漂移。
    type: modified
  - id: C3
    description: |
      显式 --publish 退出码用例 hermetic 化：在 test_tc_cas_008b 中把 scp 优先通道
      （publish_via_scp）显式 monkeypatch 为失败，强制降级到 inbox 死端口，从而真正
      验证「显式命令失败 → 返回非零」这一属性本身，不再受运行环境是否具备该 SSH 别名影响。
    type: modified
  - id: C4
    description: |
      naive 时间戳清零：L1 值层为 notices-authenticity-gate 的 8 处时间字段补 `+00:00`
      时区后缀（仓库既有 UTC 约定）；L2 源层把 tools/heartbeat.py 与
      tools/fstdd003_daily_share.py 产出的真时间戳改为 aware（.astimezone()，保留本地墙钟）；
      并为 tools/hub_client.py / tools/share_experience.py / tools/verify_notices.py 的
      3 处标识符日期片段补 EXEMPTIONS 豁免（category=identifier）。
    type: modified

