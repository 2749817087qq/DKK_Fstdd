      SSH 私钥路径（`~/.ssh/id_rsa` 等）；`OUTBOUND_RESIDUAL_RE` 出站自检同步对齐
      （**必须用 `re.compile(..., re.IGNORECASE)`，不得用内联 `(?i)`** —— 这正是交付件的 critical）。
