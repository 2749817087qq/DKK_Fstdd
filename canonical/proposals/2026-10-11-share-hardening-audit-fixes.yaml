why:
  problem: |
    外部交付件 `DKK_Fstdd_audited_fixed.tar.gz` 提出了一组针对经验回传链路与安装脚本的
    安全/健壮性加固，但**交付的字节本身有 critical 缺陷、且零测试**：
    ① `tools/share_experience.py` 的 `OUTBOUND_RESIDUAL_RE` 把内联 `(?i)` 写在多段拼接的**中间**
       ⇒ Python 3.11+ 抛 `re.PatternError: global flags not at the start of the expression`
       ⇒ 模块级常量编译失败 ⇒ **`import share_experience` 即崩**，整条回传链路（含 DELIVER 静默回传）不可用；
    ② 新增调用 `publish(..., pre_staged=True)` 未同步测试桩（`def fake_publish(out_dir, repo, tok)`）
       ⇒ `upstream/tests/test_silent_share.py` 3 个用例红（TC-CAS-002 / 002b / 010c），而本仓基线 23 passed；
    ③ 6 个新符号（`SCP_SYNTAX_RE` / `_validate_remote_path` / `_check_token_file_permissions` /
       `pre_staged` / `_render_template` / `max_depth`）在测试文件中命中数均为 0。
  motivation: |
    加固的**意图是真实有价值的**（脱敏规则补漏、scp 目标注入防护、token 文件权限告警、模板外置、
    CLI 冒烟超时），且与本仓在办 change 无文件冲突。故按意图在本仓 HEAD 上**重做**，
    同时修掉 ①② 两处缺陷并补齐测试，避免引入一个「import 即崩」的模块。
  evidence:
    observed_at: "2026-10-11T09:25:00+08:00"
    observed_base_git_sha: "a4673cc"
    details: |
      实测（解包至 `E:/FSTDD/_incoming/DKK_Fstdd/`，未污染 stdd-repo）：
      - `importlib` 加载交付件 `tools/share_experience.py` →
        `PatternError: global flags not at the start of the expression at position 200`；
        本仓同名文件 → `IMPORT OK`。
      - 在解包副本跑其自带 `tests/`：`151 passed / 1 failed / 6 skipped`
        （唯一失败 `test_tc_rh_003c_scratch_is_gitignored` 系解包无 `.git/` 所致，非缺陷）。
      - 聚焦上游 5 文件：`80 passed / 3 failed`（全部为 `pre_staged` 未同步测试桩）。
      - 文件集比对：仅 7 个文件内容不同 + 3 个新模板；`upstream/fstdd/cli/{__init__.py,
        commands/experience.py}` 与交付件**逐字节一致** ⇒ 与本仓在办 change 无冲突。
      分析报告：`E:/FSTDD/_incoming/ANALYSIS-DKK_Fstdd_audited_fixed-2026-10-11.md`

what_changes:
  - id: C1
    description: |
      `tools/share_experience.py` 脱敏规则新增 3 类：AWS Secret Access Key（40 字符 base64，
