# 2026-10-07-change-dir-resolution-unify.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `fstdd canon generate` 生成。

meta:
  change_id: "2026-10-07-change-dir-resolution-unify"
  title: "归档生命周期收口：change 目录解析统一 + 归档/恢复状态自洽"
  created: "2026-10-07T14:17:38+00:00"
  status: draft
  version: "2.9"

why:
  problem: |
    2026-09-26 的 change（`2026-09-26-finder-archive-fallback`）建立了 change 目录的
    **统一解析入口** `finder.find_change_dir(name, root, *, include_archive=...)`，并让 4 条命令
    在归档 change 上可用（validate / status / canon verify / structure merge）—— 但**只覆盖了一部分**。
    实测（@f7bf8ec，对已归档的 `2026-10-07-tool-defect-fixes`）：

    1) 仍有 **5 个模块**各留一套自建解析器，只扫 `.fstdd/changes/`，**无 `archive/` 回退**：
       `phase.py::_find_change`(20-31) / `gate.py::_find_change_dir`(23-30) /
       `state.py::_find_change_dir`(17-26) / `work.py::_find_change`(16-30) /
       `baseline.py::_resolve_change`(65-80)。而 `canon` / `ci` / `diff` / `dependency_graph` /
       `extract_proposal` / `status` / `structure` / `validate` 已走统一入口 ⇒ **口径分裂**。

    2) 实测失败：`fstdd phase status <archived>` / `fstdd state <archived>` /
       `fstdd work list <archived>` 均以非 0 退出（`gate` / `baseline` 为代码确认）。

    3) **错误信息误导**：报 `.fstdd.yaml not found in <name>`（`state` 甚至把
       `.fstdd\changes\<name>` 这个**它去错地方找**的路径打印出来）—— 读起来像「这个 change 不存在」，
       而实际是「本命令不支持归档区」。使用者会去翻找一个并不缺失的 change。

    4) 最刺眼的一条：**`gate amend-audit` 的设计用途就是给历史/归档 Gate 追加追认审计**
       （`--gate` + `--confirmed-by` + `--evidence` 三参必填），却因解析器不支持归档而用不了。

    连带发现同一族（归档生命周期）的两处状态机不自洽：

    5) `archive` **不闭合相位** ⇒ 归档态悬空。实测 3 个历史 change 的归档态：
       `2026-10-04-baseline-failures-zero` → `deliver: in_progress`；
       `2026-10-06-legacy-debt-cleanup` → `current_phase: build` + `deliver: pending`；
       `2026-10-05-upstream-baseline-alignment` → 唯一正确闭合者（`deliver: completed`）。

    6) `rollback` **无条件**把 `current_phase` 重置为 `understand`（`--dry-run` 实测输出
       `更新状态: status=active, current_phase=understand`），而 `phases.*.status` 全部保留 ⇒
       恢复后 `current_phase=understand` 与 `phases.understand.status=completed` 自相矛盾，
       继续推进会回到 `spec` 而非原相位（`rollback` 的语义是「恢复」，不是「重做」）。

    共同主线：**同一件事（解析 change 目录 / 迁移归档状态）存在多份实现或多处写入，彼此口径不一致**
    —— 与 EXP-2026-0013「契约断层」、EXP-2026-0024「判据粒度错配」同族。
  motivation: |
    归档是 change 的终态，而「终态之后仍要能查询、能审计」是 FSTDD 流程的刚需：
    上一版（3.3.7）DELIVER 时就实测撞上 `phase advance <已归档 change>` 不可用，导致归档态停在
    `deliver: in_progress` 无法用 CLI 闭合。同时 `gate amend-audit` 是**唯一**为「事后追认历史 Gate」
    设计的通道，它不可用等于审计链缺一环。趁 2026-09-26 建立的统一入口还在，把剩下的 5 个模块
    一次性收口，并把归档/恢复两端的相位状态写自洽 —— 使「归档后仍可读、写操作有明确出口」
    成为可验证的契约，而不是靠人记住哪条命令能用。
  evidence:
    observed_at: "2026-10-07T13:55:34+00:00"
    observed_base_git_sha: "f7bf8ec39a9784c7a8812d8b4b4e6238d6fe1b46"
    details: |
      命令与输出摘要（均为 @f7bf8ec 实测）：
      - `fstdd phase status 2026-10-07-tool-defect-fixes` → `.fstdd.yaml not found in 2026-10-07-tool-defect-fixes`
      - `fstdd state 2026-10-07-tool-defect-fixes` → `.fstdd.yaml not found in E:\FSTDD\stdd-repo\.fstdd\changes\2026-10-07-tool-defect-fixes`
      - `fstdd work list 2026-10-07-tool-defect-fixes` → `.fstdd.yaml not found in 2026-10-07-tool-defect-fixes`
      - 对照组（已走统一入口，均 rc=0）：`validate` / `status` / `diff` / `canon verify` /
        `ci check-failures` / `extract-proposal` / `structure merge`
      - `fstdd rollback 2026-10-07-tool-defect-fixes --dry-run` → 输出含
        `更新状态: status=active, current_phase=understand`
      - 代码定位：`grep -rn "find_change_dir" upstream/fstdd/` = 10 个模块已用统一入口；5 个模块自建
      - 归档态悬空实测：见 why.problem 第 5) 点列出的 3 个历史 change 的 `.fstdd.yaml`

what_changes:
  - id: C1
    description: "把 5 个模块（`phase` / `gate` / `state` / `work` / `baseline`）的自建 change 目录解析器全部替换为统一入口 `finder.find_change_dir(..., include_archive=True)`，删除重复实现 —— **读路径**（`phase status` / `state` 查看 / `work list` / `gate` 查询 / `baseline` 读）统一支持归档 change"
    type: modified
  - id: C2
    description: "**写路径**在归档 change 上默认拒绝，并给出准确、可操作的提示（`已归档：<name>（.fstdd/archive/…）；如需修改请先 fstdd rollback <name>`），彻底消除「.fstdd.yaml not found」这类误导文案；**`gate amend-audit` 例外** —— 按设计用途允许对归档 change 追加追认审计"
    type: modified
  - id: C3
    description: "`archive` 归档时闭合相位：写 `phases.deliver.status = completed`，消除「已归档但 deliver 仍 in_progress / pending」的悬空态"
    type: modified
  - id: C4
    description: "`rollback` 恢复时保留原 `current_phase`（仅把 `status` 置回 `active`），不再无条件重置为 `understand` —— 使「恢复后可继续原相位」成立"
    type: modified
  - id: C5
    description: "防复发契约测试：凡「接受 change 名」的命令模块必须走统一入口（AST 扫描 + 双向自检）；并对归档 change 做逐命令行为断言（读必成功 / 写必给准确拒绝 / `amend-audit` 必放行）"
    type: new

capabilities:
  new:
    - name: "archive-state-consistency"
      description: "归档与恢复两端的相位状态自洽：归档即闭合相位；恢复保留原相位，不产生 current_phase 与 phases.*.status 互相矛盾的中间态"
  modified:
    - name: "change-dir-resolution"
      description: "change 目录解析的唯一入口覆盖全部命令：读路径统一支持归档 change，写路径在归档 change 上有明确且准确的出口，不再出现口径分裂或误导性报错"

constraints:
  - "不改 `finder.find_change_dir` 的既有语义（`include_archive` 默认 False；`name=None` 恒只查 changes/）—— 该函数已有 spec SC-001..006 与测试锚定"
  - "不改 `archive` / `abort` / `rollback` 三处既有 `include_archive=False` 的调用语义（避免 archive 把自己再移动一次）"
  - "写路径的拒绝**不得**改变在办（active）change 上的既有行为 —— 逐命令回归"
  - "`gate amend-audit` 的放行仅限「对已归档 change 追加审计」，不改变其在办 change 上的行为"
  - "C3 的相位闭合只写 `phases.deliver.status`，**不得**改写任何 `confirmed_at` / `confirmed_by` / `confirmed_evidence` 字段"
  - "C4 只改 `current_phase` 的写入策略，**不得**触碰 `phases.*` 的状态与闸门字段"
  - "不新增 CLI 参数（YAGNI：C3 已消除 `--allow-archived` 的唯一动机）"
  - "所有改动须在 Windows（本机）与既有测试面（test_phase / test_gate / test_state / test_work / test_baseline* / test_finder / test_changes_dir_consistency / test_canon_dchash_ops）零回归"

stakeholders:
  - "D哥（使用者 / 门禁裁决）"
  - "后续所有 change 的执行者（归档后仍需查询 / 审计 / 收口相位）"

risk_areas:
  - capability: "change-dir-resolution"
    risk: "把 5 个自建解析器换成统一入口时，若误把 `include_archive` 用到 `archive` / `abort` 语义上，可能造成「归档的 change 被再次移动」"
    mitigation: "沿用既有反例守卫（SC-011：对已归档 change 执行 archive 必须非 0 退出）；契约扫描 + 逐命令行为断言同时覆盖读/写两侧"
  - capability: "archive-state-consistency"
    risk: "C3/C4 直接写 change 状态文件，若写错会破坏相位状态与闸门审计（后果比「显示不对」严重）"
    mitigation: "只写白名单字段（C3 仅 `phases.deliver.status`、C4 仅 `current_phase` 与 `status`）；加「闸门字段零改动」的字节级断言；对 3 个历史归档 change 做只读回归"

non_goals:
  - "不统一 `batch` / `bootcamp` / `guard` 等**只枚举在办 change**的扫描点（其语义就是「在办」，不涉及归档回退）"
  - "不为归档 change 开放写操作（归档即终态；需要改先 `rollback`）"
  - "不改 `finder.py` 的算法本身，也不新增第二个解析入口"
  - "不清理历史归档 change 已悬空的相位状态（只保证此后归档的正确性；历史数据是否回填另议）"

critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false

anchoring:
  level: L1
  reference_changes: []
  anchor_implementations: []

success_criteria:
  - "对已归档 change：`phase status` / `state` / `work list` 均 rc=0 且输出该 change 的真实信息（修复前 rc≠0 且报「.fstdd.yaml not found」）"
  - "对已归档 change：`phase advance` / `phase set` / `phase record-slice` / `state --set` / `work add` / `baseline establish` 均**拒绝执行**，且输出同时含「已归档」与「rollback」字样"
  - "对已归档 change：`gate amend-audit` 可正常执行（rc=0），且行为与在办 change 上一致"
  - "`archive` 完成后，归档 change 的 `phases.deliver.status == completed`；且 `phases.*` 的 `confirmed_at` / `confirmed_by` / `confirmed_evidence` 与归档前逐字节一致"
  - "`rollback` 完成后，`current_phase` 与归档前一致、`status == active`，且 `phases.*` 状态与闸门字段零改动"
  - "契约扫描：全仓「接受 change 名」的命令模块 100% 走 `finder.find_change_dir`（违规数 = 0），且扫描器自带「能抓到违例」的反向自检"
  - "在办 change 上的既有行为零回归：`test_phase` / `test_gate` / `test_state` / `test_work` / `test_baseline*` / `test_finder` / `test_changes_dir_consistency` 全绿；全量 `pytest upstream/tests` 与仓库根 `tests/` 零新增失败；四自检全绿"

impact:
  code:
