# 2026-10-12-test-teardown-resilience.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-10-12-test-teardown-resilience"
  title: "测试收尾韧性 —— 让 fixture teardown 不被沙箱删除守卫的 SystemExit 打断"
  created: "2026-10-12T13:32:39+00:00"
  status: draft
  version: "2.9"

why:
  problem: |
    门禁数**不可判**：同一 HEAD、同一命令，不同执行者拿到不同的失败数。
    实测（2026-10-12 闭合度验证）：主理人跑 `pytest tests upstream/tests/test_repo_home.py`
    得 **5 failed / 1 error**，质量门神跑同一命令得 **4 failed / 17 errors** —— 差异全因沙箱
    的 `safe-delete` 守卫是否触发。

    根因链（已逐环坐实）：
      ① 沙箱 shim（**仓外**）在删除失败时 `raise SystemExit(1)`
         —— `D:/Program Files/WorkBuddyAI/resources/app.asar.unpacked/cli/vendor/shim/sitecustomize.py:848`；
      ② 该异常若落在 pytest **fixture teardown** 的 `Path.unlink()` / `shutil.rmtree()` 里；
      ③ pytest 的 `TEST_OUTCOME` 元组**不含 `BaseException`** ⇒ `SystemExit` 不被捕获
         ⇒ **fixture 收尾中断**（后续 teardown 步骤被跳过）；
      ④ 后果：临时目录未被清理 / 测试间状态被污染 ⇒ 后续测试在
         `d.mkdir()`（无 `exist_ok`）上抛 `FileExistsError`
         （实测点：`tests/test_verify_notices_default_safe.py:95` 与 `:263`）。

    危害不是「多几个红」，而是**判据失效**：抖动会把**真红**淹在噪声里，也会把**假红**当真问题
    消耗排查；且 DELIVER 的放行判据（「全量 0 failed」）在抖动下**无法被客观回答**。
  motivation: |
    本仓规程要求「全量 0 failed 才可 tag」，而门禁数抖动使该判据**不可执行** ——
    2026-10-12 的发布放行就卡在这个不确定性上（需靠「隔离复跑 + 全新 basetemp」人工排除噪声）。
    治本必须**在仓内**做（shim 属外部程序，不改），使测试对「守卫触发」具备韧性。
  evidence:
    observed_at: "2026-10-12T13:32:56+00:00"
    observed_base_git_sha: "34f11b50a22725af2ad45f2b7663fa535f332b66"
    details: |
      【观测 1｜同命令不同结果】`pytest tests upstream/tests/test_repo_home.py`
        · 主理人（21:0x）：5 failed / 215 passed / 9 skipped / 1 error
        · 门神（21:1x）：4 failed / 199 passed / 9 skipped / 17 errors
        差异项随守卫触发而变，**非代码差异**。

      【观测 2｜守卫未触发时是确定的】连跑 `pytest tests -q --basetemp=<每次全新>`
        · 第 1 次：204 passed, 6 skipped, 6 warnings in 292.06s
        · 第 2 次：204 passed, 6 skipped, 6 warnings in 215.49s
        ⇒ 守卫不触发时结果稳定；**抖动的唯一来源是守卫**。

      【观测 3｜受影响测试的隔离特征】`tests/test_verify_notices_default_safe.py`
        · 单跑 4 次全绿；守卫触发时才 `1 failed + 1 error`
        · 失败点固定为 `_mk_hit_dir()` 的 `d.mkdir()`（L95）与 L263 同形写法
        · 同因另致 `tests/test_share_publish_sanitize.py`（非本 change 文件）13 errors

      【观测 4｜根因在仓外，不可直接修】
        shim `sitecustomize.py:848` `raise SystemExit(1)`；同文件 L858/L872/L877 为
        `[SAFE_DELETE_BULK_GUARD_ERROR]` 的三种上报形态（helper-unavailable / state lock timeout / exit N）。

what_changes:
  - id: C1
    description: |
      `tests/conftest.py` 增加 **teardown 韧性层**：在 pytest 的收尾阶段捕获
      `BaseException`（含 `SystemExit`），使其**不中断 fixture teardown**，
      同时以**可见方式**（warning / 报告项）暴露 —— 不得静默吞掉。
      实现形态在 Phase 2 定（候选：`pytest_runtest_makereport` hook 包裹 / 自定义
      `pytest_exception_interact` / 对 `shutil.rmtree`+`Path.unlink` 的受控包装）。
    type: modified
  - id: C2
    description: |
      `tests/test_verify_notices_default_safe.py` 的 2 处 `d.mkdir()`（L95 / L263）
      改为对「目录已存在」鲁棒（`exist_ok=True`）—— 使测试不因上一测试的残留而失败。
    type: modified
  - id: C3
    description: |
      新增回归测试：**以 monkeypatch 模拟 shim 抛 `SystemExit`**，断言
      「① fixture teardown 不被中断；② 该异常可见（非静默）；③ 后续测试不受污染」。
      使本 change 的判据**不依赖环境是否恰好触发守卫**（可在任意环境稳定复现）。
    type: new
  - id: C4
    description: |
      在 change 的 `test-report.md` 中记录**确定性判定法**（连跑 N 次全量的 failed/errors
      是否一致），作为门禁可判性的证据留痕。
    type: new

capabilities:
