constraints:
  - "根因在**仓外**（WorkBuddyAI 的 shim）⇒ 本 change 只做**仓内韧性**，**不得**声称已修复 shim"
  - "**不得**为绕过守卫而关闭/削弱 safe-delete 语义（不得全局 monkeypatch 掉安全删除）"
  - "改动限 `tests/` 与 change 文档；**不得触碰 `upstream/`**（vendored 内核）"
  - "韧性层**不得静默**：捕获的异常必须以 warning 或报告项可见，否则会掩盖真实 teardown 缺陷"
  - "判定法不得依赖环境是否触发守卫（须能用 monkeypatch 稳定复现）"

stakeholders:
  - "D哥（工程负责人）—— 门禁可判性是发布放行的前提"
  - "FSTDD 交付流程（DELIVER 的「全量 0 failed 才可 tag」判据）"
  - "后续所有 change 的执行者 —— 门禁数抖动会持续消耗排查成本"

risk_areas:
  - capability: "test-teardown-resilience"
    risk: "把 teardown 异常一律吞掉 ⇒ 掩盖**真实**的 fixture 收尾缺陷（如资源泄漏、文件未清理）"
    mitigation: |
      ① 只针对 `SystemExit`（不吞 `Exception` 子类）；
      ② 只在**收尾阶段**生效；
      ③ 必须**可见**（warning + 测试报告中列出被吞的次数与位置）；
      ④ 补一条反向测试：真实的 teardown 异常仍须导致失败。
  - capability: "test-teardown-resilience"
    risk: "`tests/conftest.py` 影响**全部根级测试**，改错会面状污染"
    mitigation: "改动保持最小且集中；跑全量根级测试 + 与改动前逐项对比 failed/errors 数"
  - capability: "test-teardown-resilience"
    risk: "本 change 治的是**症状链**（③④），shim（①②）仍在 ⇒ 守卫仍会失败并告警"
    mitigation: "在 proposal 与 test-report 明确**能力边界**；shim 侧问题另行上报 WorkBuddyAI"

