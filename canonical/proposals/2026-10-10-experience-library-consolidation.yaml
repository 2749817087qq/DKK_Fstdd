# 2026-10-10-experience-library-consolidation.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-10-10-experience-library-consolidation"
  title: "经验库跨副本收敛与去重（4→1 权威库）"
  created: "2026-10-10T14:53:56+00:00"
  status: draft
  version: "2.9"

why:
  problem: |
    本机存在 4 个 FSTDD 经验库副本，共 179 个经验文件，但唯一 experience_id 仅 90 个。
    大量重复（47 个 eid 多份内容完全一致）、21 个 eid 同 id多份内容不一致（漂移）、
    以及 FSTDD002 含 12 条其他副本完全没有的独有经验。上游 P0-pre change 已修单库
    解析器（experience.py:428 双块解析），但跨副本物理收敛尚未做。
    现状导致：经验回传 / Phase 3 自动加载会从多个冲突源取数，门禁可信度数据面未闭合。
  motivation: |
    上一轮「FSTDD 进化方向」评审将「经验库可信化」列为 P0-pre 前置批次。单库解析器已修
    （commit 1555de9），本 change 补上跨副本物理收敛这一剩余子项，使经验库「先可信、再可见」。
  evidence:
    observed_at: "2026-10-10T14:40:00+00:00"
    observed_base_git_sha: "1555de9"
    details: |
      只读扫描（analyze_experiences.py + analyze_drift.py，未改任何文件）：
      - 4 副本文件数：stdd-repo 79 / FSTDD003 69 / home-FSTDD 19 / FSTDD002 12 = 179
      - 唯一内容哈希 112；唯一 experience_id 90
      - 纯重复 47 eid（134 冗余文件，67 组）
      - 内容漂移 21 eid（stdd-repo vs FSTDD003 2 个 + home-FSTDD 漂移 19 个）
      - FSTDD002 独有 12 eid（stdd-repo 完全没有，删副本会丢）
      - FSTDD003 / home-FSTDD 相对 stdd-repo 0 条独有
      - 旧解析器丢 eid 文件 90/179（stdd-repo 子样本 46/79 约 58%，与 P0-pre 基线一致）

