    type: modified
  - id: C3
    description: "逐条裁决 21 个漂移 eid，默认以 stdd-repo 为准，必要时合并 home 版增量字段；裁决依据留痕"
    type: modified
  - id: C4
    description: "删除 134 个纯重复文件（留 stdd-repo 那份，其余移回收站非 rm），逐批不超过 10"
    type: removed
  - id: C5
    description: "修复 upstream/fstdd/experience.py 的 _load_experience 双块解析（解析全部 frontmatter 块并合并取真身），加 RED to GREEN 契约测试（用 46 受影响样本）；这是 P1 本体，本 change 实测 list 仍丢真身，P0-pre 未修"
    type: modified
  - id: C6
    description: "重建 .experience-index.yaml（依赖本 change C5 修复后的解析器），确保 list/stats 不写脏工作树"
    type: modified
  - id: C7
    description: "将 FSTDD003 / home-FSTDD / FSTDD002 三副本降级为只读参考（放置 README 标注），不再作为写源"
    type: modified
  - id: C8
    description: "新增可复现迁移脚本 tools/consolidate_experiences.py（幂等、可重跑、带 --dry-run），执行 C2 回灌 + C3 裁决 + C4 去重 + C6 降级"
    type: new

capabilities:
  new:
    - name: "experience-library-consolidation"
      description: "将分散在 4 副本的 179 经验文件收敛为 1 个权威、去重、可信库（stdd-repo/.fstdd/experiences），并提供幂等迁移脚本"
  modified: []

