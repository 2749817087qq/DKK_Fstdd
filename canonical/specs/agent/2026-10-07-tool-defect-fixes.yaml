  - action: "新增契约扫描测试：遍历 `upstream/fstdd/cli/commands/*.py`，凡含写操作者须出现 dry_run 处理"
    verify: "对当前仓库违规数 == 0；对构造的「未处理」样本判 FAIL、「已处理」样本判 PASS；扫描器同时识别 `getattr(args,\"dry_run\",…)` 与 `args.dry_run`"

