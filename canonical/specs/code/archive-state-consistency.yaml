# spec.yaml — 行为规格（Canonical YAML，AI 主读文档）
# change: 2026-10-07-change-dir-resolution-unify
# capability: archive-state-consistency（NEW —— 归档/恢复两端的相位状态自洽）

meta:
  capability: "archive-state-consistency"
  change_id: "2026-10-07-change-dir-resolution-unify"
  created: "2026-10-07T14:30:00+00:00"
  confidence: high

requirements:
  - id: "REQ-001"
    capability: "archive-state-consistency"
    description: |
      **归档即闭合**：`archive` 命令在成功移动 change 到 `.fstdd/archive/<name>/` 后 SHALL 把
      `phases.deliver.status` 置为 `completed`，使归档态不再悬空（`status: archived` 却
      `deliver: in_progress|pending`）。该写操作 SHALL 只触及这一个字段 ——
      所有闸门审计字段（`phases.*.confirmed_at` / `confirmed_by` / `confirmed_evidence`）
      SHALL 逐字段保持不变。

    scenarios:
      - id: "SC-201"
        confidence: high
        evidence: "proposal.yaml why.problem 第 5) 点；observed_at=2026-10-07T13:55:34+00:00 source=@f7bf8ec 只读实测三个历史归档 change：2026-10-04-baseline-failures-zero → deliver=in_progress；2026-10-06-legacy-debt-cleanup → current_phase=build + deliver=pending；2026-10-05-upstream-baseline-alignment → deliver=completed（唯一正确者）"
        given: "一个处于 `deliver` 相位且 Gate 3 已确认的在办 change（`phases.deliver.status == in_progress`）"
        when: "执行 `fstdd archive <name>` 并成功完成"
        then: "归档目录内 `.fstdd.yaml` 的 `phases.deliver.status` SHALL 等于 `completed`"
        and:
          - "`status` SHALL 等于 `archived`"
          - "归档目录 SHALL 位于 `.fstdd/archive/<name>/`"

      - id: "SC-202"
        confidence: high
        evidence: "proposal.yaml constraints 第 5 条 + what_changes C3；EXP-2026-0015（破坏性操作的安全网）；KG-094（断言须覆盖全部字段，不得抽检）"
        given: "一个 Gate 1/2/3 均已确认的在办 change（`phases.*.confirmed_at/by/evidence` 全部有值）"
        when: "执行 `fstdd archive <name>`，并在归档前后读取 `.fstdd.yaml`"
        then: "归档后 SHALL 仅 `phases.deliver.status` 与 `status` 两个字段发生变化"
        and:
          - "`phases.understand|spec|build|deliver` 的 `confirmed_at` / `confirmed_by` / `confirmed_evidence` SHALL 与归档前逐字段相等"
          - "其余字段（`change_id` / `mode` / `complexity_score` / `traceability` 等）SHALL 逐字段相等"

  - id: "REQ-002"
    capability: "archive-state-consistency"
    description: |
      **恢复保留原相位**：`rollback` 把 change 从归档区恢复到 `.fstdd/changes/<name>/` 时，
      SHALL 保留其原有 `current_phase`（只把 `status` 置回 `active`），SHALL NOT 无条件重置为
      `understand`。由此保证「归档 → 恢复 → 继续推进」的相位接续正确，且不产生
      `current_phase` 与 `phases.*.status` 互相矛盾的中间态。`phases.*` 的状态与闸门字段
      SHALL 零改动。老数据（无 `current_phase`）SHALL 有确定的兜底取值。

    scenarios:
      - id: "SC-203"
        confidence: high
        evidence: "proposal.yaml why.problem 第 6) 点；observed_at=2026-10-07T13:55:34+00:00 source=@f7bf8ec 实测 `fstdd rollback 2026-10-07-tool-defect-fixes --dry-run` → 输出含 `更新状态: status=active, current_phase=understand`（而该 change 归档时 current_phase 为 deliver）"
        given: "一个归档时 `current_phase` 为 `deliver` 的已归档 change，且 `changes/<name>/` 不存在"
        when: "执行 `fstdd rollback <name>`"
        then: "恢复后 `.fstdd.yaml` 的 `current_phase` SHALL 仍为 `deliver`（= 归档前的值）"
        and:
          - "`status` SHALL 等于 `active`"
          - "恢复后的目录 SHALL 位于 `.fstdd/changes/<name>/`"
          - "输出 SHALL NOT 宣称「current_phase=understand」（除非原值本就是 understand）"

      - id: "SC-204"
        confidence: high
        evidence: "proposal.yaml constraints 第 6 条 + what_changes C4；KG-094（不得抽检）"
        given: "一个 Gate 已确认的已归档 change"
        when: "执行 `fstdd rollback <name>`，并在恢复前后读取 `.fstdd.yaml`"
        then: "恢复后 `phases.*` 的 `status` 与全部闸门字段 SHALL 与恢复前逐字段相等"
        and:
          - "仅 `status` 与（必要时）`current_phase` 允许变化"

      - id: "SC-205"
        confidence: medium
        evidence: "proposal.yaml what_changes C3+C4 的往返一致性；本 SC 为端到端往返断言（无单点实测，属规格推演）"
        given: "一个在办 change，其 `current_phase` 为 `deliver`"
        when: "依次执行 `archive <name>` → `rollback <name>` → 再次 `archive <name>`"
        then: "第二次归档后 SHALL 与第一次归档后状态一致（`deliver: completed`、`current_phase` 不变）"
        and:
          - "往返过程中 SHALL NOT 出现「changes/ 与 archive/ 同名并存」的中间态残留"
          - "第二次 rollback 后 `current_phase` SHALL 仍为 `deliver`"

