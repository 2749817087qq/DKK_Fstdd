meta:
  capability: "experience-center-node-sync"
  change_id: "2026-10-11-experience-center-node-sync"
  created: "2026-10-11T03:36:00+00:00"
  confidence: high

requirements:
  # ───────────────────────── C1：抽取源扩展 ─────────────────────────
  - id: REQ-001
    description: "扩展 experience extract 抽取源：在 test-report.md 之外新增 design-adjustments.md 与 adjudication-log.tsv，保持现有 test-report 抽取路径不变"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "observed_at=2026-10-11T03:36:00+08:00 base=d67c9b1 只读实测：consolidation 已落地 _cmd_extract 仅从 test-report.md 抽 draft（grep 确认 extract 仅 test-report 路径）"
        given: "存在一个含 draft 条目（GIVEN/WHEN/THEN + SHALL）的 test-report.md"
        when: "调用 `fstdd experience extract`（默认 test-report 源）"
        then: "SHALL 产出 discovered 草稿，条数大于 0（既有路径不退化）"
      - id: SC-002
        confidence: high
        evidence: "设计决策 C1：design-adjustments.md 为 DELIVER 设计偏离留痕（consolidation change 已生成 design-adjustments.md 可作为夹具）"
        given: "存在一个含偏差记录的 design-adjustments.md"
        when: "调用 `fstdd experience extract --source design-adjustments`"
        then: "SHALL 从设计偏离记录产出 discovered 草稿，条数大于 0"
      - id: SC-003
        confidence: high
        evidence: "设计决策 C1：adjudication-log.tsv 为裁定留痕（consolidation change 已生成 adjudication-log.tsv 可作为夹具）"
        given: "存在一个含同 eid 多版本裁决的 adjudication-log.tsv"
        when: "调用 `fstdd experience extract --source adjudication`"
        then: "SHALL 从裁定日志产出 discovered 草稿，条数大于 0"
      - id: SC-004
        confidence: medium
        evidence: "设计决策 C1：三类源合并抽取"
        given: "同一 change 同时含 test-report + design-adjustments + adjudication-log 三类源"
        when: "调用 `fstdd experience extract --all`"
        then: "SHALL 三类源均被纳入且按 experience_id 去重合并"
      - id: SC-005
        confidence: high
        evidence: "SC1 回归约束：现有 test-report 路径不得破坏"
        given: "一个在扩展前可被正常抽取的 test-report 夹具"
        when: "扩展后再次运行 extract（仅 test-report）"
        then: "SHALL 抽取结果与扩展前逐条一致（无回归）"

  # ───────────────────────── C2：非交互自动沉淀 ─────────────────────────
  - id: REQ-002
    description: "新增非交互自动沉淀入口（auto-deposit），接进 DELIVER 阶段；尊重 FSTDD_NO_SHARE=1 总开关；产物一律 lifecycle=discovered"
    scenarios:
      - id: SC-006
        confidence: high
        evidence: "设计决策 C3：现有 _cmd_extract 经 review(input()) 入库，自动化不可用；DELIVER 需非交互路径"
        given: "DELIVER 阶段激活，且当前 change 含 test-report + design-adjustments + adjudication-log 三类源"
        when: "fstdd-deliver 流程触发 `fstdd experience auto-deposit`（非交互）"
        then: "SHALL 自动抽取三类源并将 discovered 草稿入库，不调用任何交互式 input()"
      - id: SC-007
        confidence: high
        evidence: "约束：必须 honor FSTDD_NO_SHARE=1（延续 share_experience.share_disabled 政策）"
        given: "环境变量 FSTDD_NO_SHARE=1"
        when: "触发 `fstdd experience auto-deposit`"
        then: "SHALL 跳过抽取与入库（本地 0 新增，且无任意出站/外发）"
      - id: SC-008
        confidence: high
        evidence: "约束：自动沉淀产物一律 lifecycle=discovered，绝不自动 shared/外发"
        given: "auto-deposit 已产出若干草稿条目"
        when: "检查入库条目的 frontmatter"
        then: "SHALL 每条 lifecycle=discovered，且 STATUS 字段不为 shared"
      - id: SC-009
        confidence: medium
        evidence: "设计决策 C3：非交互是 DELIVER 接线的硬前提"
        given: "以非 TTY / 管道方式运行 auto-deposit"
        when: "流程执行"
        then: "SHALL 不阻塞于任何标准输入读取，退出码 0 或受控非零（FSTDD_NO_SHARE 时静默跳过）"

  # ───────────────────────── C3：中心节点同步（第一方 hub） ─────────────────────────
  - id: REQ-003
    description: "新增中心节点同步能力：复用 tools/share_experience.py 的 scp(fstdd-hub)/inbox 第一方传输推到 hub；pull/merge 经 kg_sync 式增量合并回本地；幂等、可重入、honor share_disabled"
    scenarios:
      - id: SC-010
        confidence: high
        evidence: "设计决策 1：复用 share_experience.publish_via_scp(ssh_alias='fstdd-hub') / publish_via_inbox；出站强制脱敏 + 审计"
        given: "节点 A 本地 .fstdd/experiences 含若干条目且 FSTDD_NO_SHARE 未置位"
        when: "执行 `fstdd experience sync --push`"
        then: "SHALL 经第一方 share_experience 传输把本地经验推到 fstdd-hub（fstdd-inbox），不新建独立 git 仓"
      - id: SC-011
        confidence: high
        evidence: "设计决策 2：pull 腿 = inbox GET 优先 + scp 兜底；复用 kg_sync.sync 的 ADD/UPDATE/DEPRECATE 合并"
        given: "fstdd-hub 已聚合节点 A 的经验"
        when: "节点 B 执行 `fstdd experience sync --pull`"
        then: "SHALL 以增量合并方式把远端经验并入 B 的本地库（复用 _index_lock/_rebuild_index 并发安全）"
      - id: SC-012
        confidence: high
        evidence: "SC3：两节点经 hub 收敛"
        given: "A 已 push 全部经验；B 初始为空或子集"
        when: "B 执行 --pull"
        then: "SHALL 使 B 的 eid 集合与内容逐条等于 A（收敛），不丢条目"
      - id: SC-013
        confidence: high
        evidence: "kg_sync 幂等范式：dry_run 安全、重跑无副作用"
        given: "B 已与 A 收敛（无新变更）"
        when: "B 再次执行 `fstdd experience sync --pull`"
        then: "SHALL 幂等：无新增条目、无错误、索引不变"
      - id: SC-014
        confidence: medium
        evidence: "kg_sync.sync(dry_run=True) 安全范式"
        given: "任意本地库状态"
        when: "执行 `fstdd experience sync --pull --dry-run`"
        then: "SHALL 仅打印将执行的合并计划，不写本地库、不推/拉 hub"

  # ───────────────────────── C4：opt-in 安全档（cred-relay RSA 混合加密） ─────────────────────────
  - id: REQ-004
    description: "新增 opt-in 安全档：安全模式用 cred-relay RSA-3072 OAEP-SHA256/MGF1-SHA256 混合加密（RSA 包裹随机 AES-256 密钥，AES-GCM 加密正文，因 318B OAEP 载荷上限）后再 push；pull 时解密；默认开放档零密钥可用"
    scenarios:
      - id: SC-015
        confidence: high
        evidence: "设计决策 4 + cred-relay/selftest.sh：出站前先脱敏再混合加密；318B 上限强制混合"
        given: "安全档启用且 cred-relay k_pub.pem/k_priv.pem 存在"
        when: "执行 `fstdd experience sync --push --secure`"
        then: "SHALL 先对载荷脱敏，再以混合加密（RSA-OAEP 包裹随机 AES-256 密钥 + AES-GCM 加密正文）后出站"
      - id: SC-016
        confidence: high
        evidence: "SC4：安全档 round-trip 字节一致（仿 cred-relay selftest T1）"
        given: "一段已脱敏明文经验载荷"
        when: "用 cred-relay 混合加密后再用 cred-relay 私钥解密"
        then: "SHALL 解密内容与原明文逐字节一致"
      - id: SC-017
        confidence: high
        evidence: "cred-relay/selftest.sh T3b：OAEP 必须显式 rsa_oaep_md:sha256 且 rsa_mgf1_md:sha256，否则 MGF1 默认 sha1 解密失败"
        given: "加密使用 rsa_oaep_md=sha256 且 rsa_mgf1_md=sha256"
        when: "加密后用同一私钥解密"
        then: "SHALL 解密成功（对照：若 MGF1 误用 sha1 则解密失败，契约测试须锁定）"
      - id: SC-018
        confidence: medium
        evidence: "cred-relay 实测：RSA-OAEP 明文载荷上限 318 字节"
        given: "一条经验正文超过 318 字节"
        when: "安全档加密该载荷"
        then: "SHALL 走混合加密（RSA 仅包裹 AES 密钥，AES-GCM 加密超长正文），不尝试 RSA 直加密文"
      - id: SC-019
        confidence: high
        evidence: "SC5：默认开放模式零密钥可用（能用就好）"
        given: "未启用 --secure 且本地无密钥"
        when: "执行 `fstdd experience sync --push` / `--pull`"
        then: "SHALL 成功完成明文（已脱敏）同步，无需任何密钥"

  # ───────────────────────── C5：冲突策略 ─────────────────────────
  - id: REQ-005
    description: "新增同步冲突策略：同 eid 多节点编辑 → 以 updated_at 末写胜 + 显式冲突日志，绝不静默覆盖"
    scenarios:
      - id: SC-020
        confidence: high
        evidence: "设计决策 5：合并以 updated_at（缺则 exported_at/first_seen_at）为序，较新者胜"
        given: "同一 experience_id 在 A、B 两节点有不同内容，且 B 的 updated_at 较新"
        when: "B 执行合并"
        then: "SHALL 以 B（updated_at 较新）版本为胜出版本"
      - id: SC-021
        confidence: high
        evidence: "设计决策 5：旧版本写入冲突日志，不静默丢弃（避免重演 _load_experience 双块静默丢字段）"
        given: "检测到同 eid 内容冲突（A 旧 / B 新）"
        when: "合并完成"
        then: "SHALL 把被覆盖的旧版本写入冲突日志（含 eid、双方 updated_at、落点），绝不静默丢弃"
      - id: SC-022
        confidence: medium
        evidence: "复用 experience.py 既有 _index_lock / _rebuild_index 并发安全逻辑"
        given: "多节点并发触发 sync"
        when: "并发合并执行"
        then: "SHALL 经索引锁保证不出现半写索引或竞争损坏"

  # ───────────────────────── SC6 / 约束：不引入第三方外发 ─────────────────────────
  - id: REQ-006
    description: "保持框架「经验不外发第三方」硬规定：不 reintroduce 任何第三方外发；experience.py 中 _cmd_share_single 永久禁用 leonai42/hzddyy 的禁用状态与注释保持不变"
    scenarios:
      - id: SC-023
        confidence: high
        evidence: "约束条款 + proposal.evidence：_cmd_share_single 已硬编码禁用 leonai42/stdd-experiences 与 hzddyy.com，并注释指向 share_experience.py"
        given: "upstream/fstdd/cli/commands/experience.py 的 _cmd_share_single"
        when: "本变更落地后检查该段"
        then: "SHALL 仍含 leonai42 与 hzddyy 的禁用分支且其注释与禁用逻辑未被改动"
      - id: SC-024
        confidence: high
        evidence: "非目标条款：不建第三方 community registry；不改永久禁用路径"
        given: "本变更新增/修改的全部源码"
        when: "对源码做第三方外发字面量审计（grep 已知第三方域名 / 仓库名）"
        then: "SHALL 不出现任何指向 leonai42/hzddyy 之外的第三方外发目标（仅第一方 fstdd-hub 出现在 share_experience 既有路径）"
